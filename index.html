<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0907">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>Duelist Scorekeeper</title>
<style>
:root{--cw:min(calc((100vw - 28px) / 5 / 1.458 - 5px),56px);--ch:calc(var(--cw) * 1.458);--bg:#0d0907;--panel:rgba(32,18,9,.74);--panel2:rgba(84,46,18,.82);--txt:#fff1e3;--dim:#d0ae93;--gold:#ffb43d;--red:#ff5d6c;--green:#52d68a;--blue:#5aa9ff}
@media (max-height:700px){:root{--cw:min(calc((100vw - 28px) / 5 / 1.458 - 5px),37px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg) url(img/bg-embers.jpg) center/cover no-repeat;color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:0;padding:2px 0}
.side.opp{transform:rotate(180deg)}
#fbg{position:fixed;inset:0;z-index:0;display:none;background:var(--bg)}
#fbg div{position:absolute;left:0;right:0;background:center/cover no-repeat}
#fb1{top:0;height:50%;transform:rotate(180deg)}#fb0{top:50%;height:50%}
#fbg.one #fb0{top:0;height:100%}#fbg.one #fb1{display:none}
#app{position:relative;z-index:1}
.emzrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 0;position:relative;z-index:1}
.emzcell{min-height:calc(var(--ch) + 10px);display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:10px;color:var(--dim)}
.emzcell.on{padding:0}.emzcell .slot{width:100%}
.emzcell.ph{border:1px dashed #6b452488;background:#0006}
.cb.pend{background:linear-gradient(160deg,#27b58a,#e0414f)}
.mid.flip{transform:rotate(180deg)}
.mid button:disabled{opacity:.35}
dialog.flip{transform:rotate(180deg)}.x.fl{float:left;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;z-index:200;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.slot,.fchip{position:relative}.bdg{position:absolute;top:1px;right:3px;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 1px 2px #000;pointer-events:none}
.lk{font-size:10px;letter-spacing:1px;color:var(--gold);line-height:1;white-space:nowrap}
.lprow{display:flex;align-items:center;gap:6px}
.lp{flex:1;background:var(--panel);border-radius:12px;padding:4px 10px;display:flex;align-items:baseline;justify-content:space-between;border:2px solid transparent;position:relative;overflow:hidden}
.lpfill{position:absolute;left:0;bottom:0;height:5px;border-radius:0 3px 3px 0;background:#52d68a;pointer-events:none}
.lp::after{content:"";position:absolute;inset:0;border-radius:10px;opacity:0;pointer-events:none}
.lp.dmg{animation:lpshake .4s}.lp.dmg .num{color:var(--red)}.lp.dmg::after{background:#ff2d3f;animation:lpflash .6s}
.lp.heal{animation:lpshakev .4s}.lp.heal .num{color:var(--green)}.lp.heal::after{background:#3dff8a;animation:lpflash .6s}
@keyframes lpflash{0%{opacity:.75}100%{opacity:0}}
@keyframes lpshakev{0%,100%{transform:translateY(0)}20%{transform:translateY(-4px)}40%{transform:translateY(4px)}60%{transform:translateY(-3px)}80%{transform:translateY(2px)}}
@keyframes lpshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.lp.turn{border-color:var(--gold)}
.lp .nm{font-size:12px;color:var(--dim)}
.lp .num{font-size:38px;font-weight:800;line-height:1.1}
.lp .num.low{color:var(--red)}
.btns{display:flex;gap:3px}
button{font:inherit;color:var(--txt);background:var(--panel2);border:0;border-radius:10px;padding:8px 6px;min-width:40px}
button:active{filter:brightness(1.4)}
.lpb{font-size:11px;font-weight:700;padding:8px 1px;min-width:0}
.slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;min-height:0}
.slot{background:var(--panel);border-radius:10px;padding:3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;font-size:11px;min-height:0;overflow:hidden;border:1px solid #6b4524}
.slot.empty{min-height:calc(var(--ch) + 12px);color:var(--dim);justify-content:center;font-size:22px}
.slot .n{font-weight:700;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.slot .st{font-size:12px;font-weight:400;white-space:nowrap;letter-spacing:-.3px}
.slot .st span{opacity:.75}.slot .st span.act{font-weight:900;opacity:1}
.slot .st .up{color:var(--green)}.slot .st .down{color:var(--red)}
.cb{border-radius:4px;display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden;border:2px solid #e8c36a;box-shadow:0 2px 6px #0008;flex:none}
.cb .n{font-size:8px;line-height:1.05;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cb.port{width:var(--cw);height:var(--ch)}
.cb.land{width:var(--ch);height:var(--cw)}
.cb.atk{background:linear-gradient(160deg,#e0414f,#8a1424)}
.cb.def{background:linear-gradient(160deg,#4a8fe8,#173f8a)}
.cb.spell{background:linear-gradient(160deg,#27b58a,#0d5c47)}
.cb.trap{background:linear-gradient(160deg,#c15bb0,#5a1f55)}
.cb.fdv{background:url(img/cardback-v.jpg) center/cover}
.cb.fd{background:url(img/cardback-h.jpg) center/cover}
.cbw{height:var(--ch);width:100%;display:flex;align-items:center;justify-content:center}
.sl-lbl{font-size:9px;color:var(--dim);margin:0 2px}
.st.dim{color:var(--dim)}
.mid{transition:transform .35s;display:flex;flex-direction:column;gap:4px;padding:4px 0}
.mid .st1{text-align:center;font-weight:800;font-size:14px;text-shadow:0 1px 4px #000,0 0 8px #000}
.mid .row1{display:flex;gap:4px;align-items:stretch}
.side.compact{flex:.6}.side.compact .lp .num{font-size:26px}.side.compact .lpb{padding:5px 3px;font-size:11px}
#phase{flex:2;background:#8be32a;color:#0b2200;font-weight:800;font-size:15px;padding:10px 6px;border-radius:12px;line-height:1.2}
#phase.wait{background:#7a5230;color:var(--txt)}
#rules{flex:1;background:#ff6a2b;color:#2a0e00;font-weight:800;border-radius:12px}
.mid button.sm{font-size:20px;padding:10px 4px;min-width:36px}
dialog{background:#1c1109;border:1px solid #6b4524;color:var(--txt);border:0;border-radius:16px;width:min(94vw,520px);max-height:92dvh;padding:14px;overflow:auto}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 8px;font-size:18px}
dialog .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
dialog .row button{flex:1;min-width:56px}
input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #7a5230;background:#0a0705;color:var(--txt);user-select:text}
.res{max-height:38dvh;overflow:auto;margin-top:6px}
.res div{padding:8px;border-bottom:1px solid #4a3220;font-size:14px}
.res small{color:var(--dim)}
.card{background:#0a0705;border-radius:10px;padding:10px;margin-top:8px;font-size:14px;line-height:1.35;user-select:text;max-height:34dvh;overflow:auto}
.card b{color:var(--gold)}
.phtxt h3{margin:10px 0 2px;font-size:14px}.phtxt .may{color:var(--green)}.phtxt .cant{color:var(--red)}
.phtxt ul{margin:2px 0 0 18px;padding:0;font-size:14px}
.big{font-size:48px;text-align:center;font-weight:800;margin:10px 0}
.x{float:right;background:none;font-size:22px}
.hist{font-size:12px;color:var(--dim);max-height:20dvh;overflow:auto}
.oh{flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;text-align:center}
.oh.rot{transform:rotate(180deg)}.oh.win{color:var(--green)}.oh.lose{color:var(--red)}.oh.draw{color:var(--gold)}
#over{position:fixed;inset:0;background:#000d;z-index:50;display:flex;flex-direction:column}
#over[hidden]{display:none}
.omid{display:flex;gap:8px;justify-content:center;padding:8px}.omid button{padding:12px 16px;font-weight:700}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg) url(img/bg-embers.jpg) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;overflow:auto}
#splash[hidden]{display:none}
#splash img{width:max(240px,min(92vw,360px,calc(100dvh - 416px)));height:auto}
#splash h1{margin:0;font-size:26px}
#splash .by{color:#f1dcc8;font-size:13px;margin-top:-4px;font-weight:600;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 -1.5px 0 #000,0 1.5px 0 #000,-1.5px 0 0 #000,1.5px 0 0 #000,0 0 6px #000}
#splash .grp{width:min(100%,380px)}
#splash .lbl{font-size:12px;color:var(--dim);margin:6px 0 4px;text-align:left}
#splash .opt{display:flex;gap:6px}
#splash .opt button{flex:1;padding:12px 6px;font-weight:700;border:2px solid transparent}
#splash .opt button.on{border-color:var(--gold);background:#6b4524}
#splash .opt small{display:block;font-weight:400;color:var(--dim);font-size:11px}
#splash .go{width:min(100%,380px);padding:14px;font-size:18px;font-weight:800;background:#8be32a;color:#0b2200;margin-top:6px}
#splash .go2{width:min(100%,380px);padding:12px;font-weight:700;background:var(--blue);color:#001a33}
#splash .kofi{width:min(100%,380px);display:block;background:#ff5e5b;color:#fff;font-weight:800;border-radius:10px;padding:10px;text-decoration:none}
#splash small.fine{color:#f1dcc8;font-size:11px;max-width:380px;font-weight:600;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 -1.5px 0 #000,0 1.5px 0 #000,-1.5px 0 0 #000,1.5px 0 0 #000,0 0 6px #000}
.zrow{gap:4px}.zb{flex:1;font-size:12px;padding:5px 4px;background:var(--panel);border:1px solid #6b4524}.zb b{color:var(--gold)}
.fchip{flex:0 0 92px;background:var(--panel);border:1px solid #6b4524;border-radius:10px;font-size:10px;line-height:1.15;padding:2px 4px;text-align:center;color:var(--txt);overflow:hidden}.fchip{background-size:cover;background-position:center;font-weight:700;text-shadow:0 1px 3px #000,0 0 6px #000;min-height:44px}
.fchip.empty{background-image:linear-gradient(#000b,#000b),url(img/cardback-h.jpg)}
.fchip.fd{background-image:linear-gradient(#0006,#0006),url(img/cardback-h.jpg);border-color:#e8c36a}
.fchip.up{background:linear-gradient(160deg,#27b58a,#0d5c47);border-color:#e8c36a;color:#fff}
.fchip.up.g-zee{background:linear-gradient(160deg,#2f95e8,#0f4a8f)}
.fchip.up.g-moeras{background:linear-gradient(160deg,#5f8f55,#2c4a2a)}
.fchip.up.g-bos{background:linear-gradient(160deg,#3dbb5a,#176a2c)}
.fchip.up.g-berg{background:linear-gradient(160deg,#c98a4a,#6e4220)}
.fchip.up.g-vuur{background:linear-gradient(160deg,#ff6a2b,#a01e0a)}
.fchip.up.g-spookhuis{background:linear-gradient(160deg,#8d6bb8,#40285e)}
.fchip.up.g-duister{background:linear-gradient(160deg,#5a4a7a,#1e1530)}
.fchip.up.g-licht{background:linear-gradient(160deg,#f0c75a,#a8791a);color:#2a1a00;text-shadow:none}
.fchip.up.g-kasteel{background:linear-gradient(160deg,#8a929c,#444c56)}
.fchip.up.g-stad{background:linear-gradient(160deg,#6c86a6,#2e3f58)}
.fchip.up.g-arena{background:linear-gradient(160deg,#e8873a,#8f3d0c)}
.fchip.up.g-cyber{background:linear-gradient(160deg,#27c4d8,#0b5d70)}
.fchip.up.g-ruimte{background:linear-gradient(160deg,#6a5bd8,#231a66)}
.fchip.up.g-toon{background:linear-gradient(160deg,#ff7fc0,#b0307a)}
.fchip.up.g-draak{background:linear-gradient(160deg,#7aa83a,#34501a)}
/* duel intro: skills -> coin toss -> IT'S TIME TO... DUEL! */
#intro{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;background:var(--bg) url(img/bg-embers.jpg) center/cover;transition:opacity .5s}
#intro[hidden]{display:none}
#intro.out{opacity:0}
.ihalf{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:12px}
.ihalf.rot{transform:rotate(180deg)}
.imid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:2}
.imid>*{pointer-events:auto}
.ibox{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;max-width:340px;width:100%;text-shadow:0 1px 4px #000,0 0 8px #000}
.ihead{font-size:20px;font-weight:900;color:var(--gold)}.isub{font-size:15px}
.ibox button,.igo{font-weight:800;font-size:17px;padding:14px 16px;width:100%;border-radius:14px}
.igo{background:#8be32a;color:#0b2200;width:min(80vw,300px)}
.coinwrap{width:120px;height:120px;perspective:600px;animation:cointoss 1.9s cubic-bezier(.3,.1,.5,1)}
.coin{width:120px;height:120px;position:relative;transform-style:preserve-3d;transition:transform 1.9s cubic-bezier(.2,.7,.25,1)}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:50px;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d6a21f 60%,#8a5d07);color:#5a3a00;border:5px solid #f5cf5a;box-shadow:0 6px 18px #000a}
.face.b{transform:rotateX(180deg)}
@keyframes cointoss{0%{transform:translateY(40px) scale(.8)}45%{transform:translateY(-110px) scale(1.5)}100%{transform:translateY(0) scale(1)}}
.cres{font-size:38px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #000;letter-spacing:2px}
.clegend{font-size:12px;color:#f1dcc8;text-shadow:0 1px 3px #000}
.itt{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible}
.ittl{font-size:min(11vw,52px);font-weight:900;color:#ff8a1f;letter-spacing:2px;text-align:center;line-height:1.1;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px #ff8a1f88}
.ltr{display:inline-block;opacity:0;transform:scale(2.4);animation:ltrin .22s ease-out forwards}
.ltr.sp{width:.35em}
.push .ltr{animation:ltrout .6s ease-in forwards}
@keyframes ltrin{to{opacity:1;transform:scale(1)}}
@keyframes ltrout{from{opacity:1;transform:scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.5)}}
.duel{position:absolute;font-size:min(30vw,150px);font-weight:900;color:#8be32a;opacity:0;letter-spacing:2px;text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,0 0 30px #8be32a;animation:duelslam .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes duelslam{0%{transform:scale(6);opacity:0}55%{opacity:1}100%{transform:scale(1);opacity:1}}
.iflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.iflash.go{animation:iflash .45s ease-out}
@keyframes iflash{0%{opacity:.95}100%{opacity:0}}
#intro.shake{animation:ishake .35s}
@keyframes ishake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}
/* small phones (e.g. 667px high): tighter layout; must stay last so it wins */
@media (max-height:700px){.side{gap:1px}.lp .num{font-size:30px}.lpb{padding:5px 1px}.zb{padding:3px 4px}body.emzon{--cw:28px;--ch:calc(28px * 1.458)}.emzrow{--cw:26px;--ch:calc(26px * 1.458)}.emzcell{min-height:0}}
#fx{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden}
#fx>*{position:fixed;pointer-events:none}
.fxslash{height:7px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff 18%,#ffe9a0 62%,transparent);box-shadow:0 0 14px 4px #ffd45acc;transform-origin:0 50%;animation:fxslash .36s ease-out forwards}
@keyframes fxslash{0%{transform:rotate(var(--a)) scaleX(0);opacity:1}55%{transform:rotate(var(--a)) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) scaleX(1);opacity:0}}
.fxflash{border-radius:14px;background:radial-gradient(circle,#ff2d3fdd 0%,#ff2d3f88 45%,#ff2d3f00 75%);animation:fxflash .55s ease-out forwards}
@keyframes fxflash{0%{opacity:0;transform:scale(.7)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.fxdust{background:url(img/fx/dust.webp) center/contain no-repeat;animation:fxdust .75s ease-out forwards}
@keyframes fxdust{0%{transform:translateY(28%) scale(.25);opacity:0}30%{opacity:.95}100%{transform:translateY(-14%) scale(1.3);opacity:0}}
.fxshield{background:url(img/fx/shield.webp) center/contain no-repeat;animation:fxshin .22s ease-out forwards}
.fxshield.hold{animation:fxshin .22s ease-out forwards,fxshake .4s .3s,fxshout .3s 1s forwards}
@keyframes fxshin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fxshake{0%,100%{translate:0}20%{translate:-7px 0}45%{translate:7px 0}70%{translate:-4px 0}}
@keyframes fxshout{to{opacity:0;transform:scale(.9)}}
.fxshield.half{background-image:url(img/fx/shield.webp);animation:none}
.fxshield.half.l{clip-path:polygon(0 0,58% 0,42% 100%,0 100%);animation:fxsplitl .55s .12s ease-in forwards}
.fxshield.half.r{clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);animation:fxsplitr .55s .12s ease-in forwards}
@keyframes fxsplitl{to{transform:translate(-34px,18px) rotate(-14deg);opacity:0}}
@keyframes fxsplitr{to{transform:translate(34px,18px) rotate(14deg);opacity:0}}
.fxtext{font-size:28px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 12px #000;text-align:center;animation:fxtext 1s ease-out forwards}
@keyframes fxtext{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#phase.paused{background:var(--gold);color:#241a00}
.fxring{border-radius:12px;border:4px solid var(--c);box-shadow:0 0 16px 5px var(--c),inset 0 0 12px var(--c);animation:fxring .9s ease-out forwards}
@keyframes fxring{0%{opacity:0;transform:scale(1.25)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.fxchip{padding:3px 9px;border-radius:12px;background:var(--c);color:#111;font-size:13px;font-weight:900;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 2px 8px #000a;animation:fxchip .95s ease-out forwards}
@keyframes fxchip{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.fxarrow{left:0;top:0;width:100vw;height:100vh;overflow:visible}
.fxarrow line{stroke:#ffd45a;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px #ffb43d);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:fxdraw .4s ease-out forwards,fxarrowout .4s .55s forwards}
@keyframes fxdraw{to{stroke-dashoffset:0}}
@keyframes fxarrowout{to{opacity:0}}
</style>
</head>
<body>
<div id="splash" hidden></div>
<div id="fbg"><div id="fb1"></div><div id="fb0"></div></div>
<div id="app">
  <div class="side opp" id="s1"></div>
  <div id="emz" hidden></div>
  <div class="mid">
    <div class="st1" id="status"></div>
    <div class="row1">
      <button class="sm" id="btnTools" title="Coin / dice">🎲</button>
      <button class="sm" id="btnUndo" title="Undo last action" disabled>↩</button>
      <button id="phase"></button>
      <button id="rules">Rules</button>
      <button class="sm" id="btnSearch" title="Card search">🔍</button>
      <button class="sm" id="btnMenu" title="Menu">⚙️</button>
    </div>
  </div>
  <div class="side" id="s0"></div>
</div>

<div id="over" hidden></div>
<div id="intro" hidden></div>
<div id="toast"></div>
<div id="fx"></div>
<dialog id="dlg"></dialog>

<script>
// ---------- Phases (official order) ----------
const PHASES_MD=[
 {n:"Draw Phase",may:["The turn player draws 1 card (the first player does NOT draw on the very first turn of the duel). A player who cannot draw loses the Duel.","Quick Effects, Quick-Play Spells and Traps can be activated (after the draw)."],cant:["Normal Summon/Set.","Attack."]},
 {n:"Standby Phase",may:["Effects that trigger 'during the Standby Phase' (e.g. upkeep costs).","Quick Effects, Quick-Play Spells and Traps can be activated."],cant:["Normal Summon/Set.","Attack."]},
 {n:"Main Phase 1",may:["1 Normal Summon OR Set per turn (Tribute if needed).","Unlimited Special Summons and Flip Summons.","Activate Spells, Set Spells/Traps.","Change monsters' battle position (once per monster; not if it was just summoned or Set this turn).","Activate monster effects."],cant:["Attack (only in the Battle Phase)."]},
 {n:"Battle Phase",may:["Officially the Battle Phase has four steps (Start Step, Battle Step, Damage Step, End Step). This app treats it as ONE phase: attack whenever you like while you are in it.","Each face-up monster in Attack Position may attack once: declare an attacker and a target, or attack directly if the opponent has no monsters. You do not have to attack (or enter the Battle Phase) at all.","A face-down monster that is attacked is flipped face-up in the Damage Step.","Damage: ATK vs ATK → the difference is taken by the owner of the weaker monster; ATK vs DEF → damage only if ATK > DEF (the difference) — unless an effect says otherwise.","Quick Effects and Traps in the Battle Step."],cant:["Normal Summon/Set.","Change battle position.","In the Damage Step: only Counter Traps and effects that specifically allow it (e.g. ATK/DEF changes).","On the first turn of the duel the starting player has NO Battle Phase."]},
 {n:"Main Phase 2",may:["Everything from Main Phase 1 (Normal Summon only if you haven't done one yet).","Activate/Set Spells and Traps.","Special Summons."],cant:["Attack.","Change position of monsters that attacked or were summoned this turn."]},
 {n:"End Phase",may:["Effects 'at the end of the turn' / 'during the End Phase'.","Quick Effects and Traps can be activated.","Hand limit: if you hold more than 6 cards, discard down to 6."],cant:["Summon or attack.","After this, the turn ends and the opponent's turn begins."]}
];
// Speed Duel: no Main Phase 2 (official Speed Duel rules)
const PHASES_SD=PHASES_MD.filter(x=>x.n!=="Main Phase 2").map(x=>x.n==="Main Phase 1"?{n:"Main Phase",may:x.may.concat(["There is NO Main Phase 2 in Speed Duel: Set and use your Spells and Traps before you go to the Battle Phase."]),cant:x.cant}:x);
let PHASES=PHASES_MD;
const OPP_TURN_RULES={may:["Activate Traps you Set (not on the turn you Set them).","Activate Quick-Play Spells you Set and Quick Effects.","Respond to the opponent's actions (chain)."],cant:["Normal Summon/Set.","Activate Normal Spells.","Attack."]};

// ---------- State ----------
const KEY="ygoref.v2";
let S=load()||fresh();
S.st=S.st||[Array(5).fill(null),Array(5).fill(null)];S.field=S.field||[null,null];S.n=S.n||5;S.ns=!!S.ns;S.gy=S.gy||[[],[]];S.ban=S.ban||[[],[]];S.skill=S.skill||[null,null];S.edup=S.edup||[[],[]];S.pt=S.pt||[0,0];if(S.n===5)for(const a of S.mon)while(a.length<7)a.push(null);
function fresh(lp=8000,n=5){return{n,ns:false,field:[null,null],gy:[[],[]],ban:[[],[]],skill:[null,null],edup:[[],[]],pt:[0,0],lp:[lp,lp],sign:[-1,-1],turn:0,tc:1,ph:0,sub:0,startPlayer:0,view:"2p",mon:[Array(n===5?7:n).fill(null),Array(n===5?7:n).fill(null)],st:[Array(n).fill(null),Array(n).fill(null)],log:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const STEPS=[5,10,50,100,500,1000,2000];
const NAME=p=>p===0?"You":"Opponent";

// ---------- Phase stepping ----------
function stepFrom(st){
  let {ph,sub,turn,tc}=st;
  const cur=PHASES[ph];
  if(cur.sub&&sub<cur.sub.length-1)return{ph,sub:sub+1,turn,tc};
  if(ph<PHASES.length-1){
    ph++;
    if(tc===1&&PHASES[ph].n==="Battle Phase")ph=PHASES.length-1; // no Battle Phase on the first turn, and Main Phase 2 only follows a Battle Phase
    return{ph,sub:0,turn,tc};
  }
  return{ph:0,sub:0,turn:1-turn,tc:tc+1};
}
function nextLabel(){
  const n=stepFrom(S);
  if(n.turn!==S.turn)return `Move to ${NAME(n.turn)==="You"?"your":"opponent's"} Draw Phase`;
  const p=PHASES[n.ph];
  return `Move to ${p.sub?p.sub[n.sub]:p.n}`;
}
function nextPhase(){
  if(S.paused){resumeBattle();return}
  if(oppWait()){Object.assign(S,{ph:0,sub:0,turn:0,tc:S.tc+1});S.ns=false;render();return}
  const n=stepFrom(S);if(n.turn!==S.turn)S.ns=false;
  Object.assign(S,n);render();
}
function oppWait(){return S.view==="1p"&&S.turn===1}

// ---------- Render ----------
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const FB={};
function slug(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
let MAP=null;
fetch("img/field/map.json").then(r=>r.json()).then(m=>{MAP=m;render()}).catch(()=>{MAP={}});
function fieldGroup(p){const f=S.field[p];return(f&&MAP&&MAP[slug(f.name)])||""}
function fieldBg(p){
  const f=S.field[p];if(!f||f.pos!=="UP")return"";
  const k=slug(f.name);
  if(FB[k]!==undefined)return FB[k]||"";
  if(MAP===null)return"";
  FB[k]=false;
  const cand=[`img/field/${k}.jpg`];if(MAP[k])cand.push(`img/field/${MAP[k]}.jpg`);
  (function t(i){if(i>=cand.length)return;const im=new Image();im.onload=()=>{FB[k]=`url(${cand[i]})`;render()};im.onerror=()=>t(i+1);im.src=cand[i]})(0);
  return"";
}
function render(){
  PHASES=S.n===3?PHASES_SD:PHASES_MD;if(S.ph>=PHASES.length)S.ph=PHASES.length-1;
  const one=S.view==="1p";
  for(let p=0;p<2;p++){
    const el=$("s"+p);
    el.className="side"+(p===1&&!one?" opp":"")+(p===1&&one?" compact":"");
    el.innerHTML=`
      <div class="lprow"><div class="lp ${S.turn===p?"turn":""}" data-lp="${p}"><span class="nm">${p===0?"YOU":"OPPONENT"}${S.turn===p?" • turn":""}</span><span class="num ${S.lp[p]<=2000?"low":""}">${lpShown(p)}</span><span class="lpfill" style="${lpFill(p)}"></span></div><button class="fchip ${S.field[p]?(S.field[p].pos==="FD"?"fd":"up g-"+fieldGroup(p)):"empty"}" data-p="${p}">${fieldChip(p)}</button></div>
      <div class="lprow"><div class="btns" style="flex:1">
        ${STEPS.map(v=>`<button class="lpb" style="flex:1" data-p="${p}" data-d="${v*(S.sign?.[p]??-1)}">${S.sign?.[p]===1?"+":"-"}${v}</button>`).join("")}
        <button class="lpb" data-p="${p}" data-sign="1" style="flex:0 0 38px;background:${S.sign?.[p]===1?"#1f5a3a":"#6b2230"}">${S.sign?.[p]===1?"+":"−"}</button>
      </div></div>
      <div class="slots" style="grid-template-columns:repeat(${S.n},1fr)">${S.mon[p].slice(0,S.n).map((m,i)=>slotHTML(p,i,m)).join("")}</div>
      <div class="slots" style="grid-template-columns:repeat(${S.n},1fr)">${S.st[p].slice(0,S.n).map((m,i)=>stHTML(p,i,m)).join("")}</div>
      <div class="lprow zrow"><button class="zb" data-p="${p}" data-pile="gy">🪦 ${S.n===3?"GY":"Graveyard"} <b>${S.gy[p].length}</b></button><button class="zb" data-p="${p}" data-pile="ban">🌀 ${S.n===3?"Ban.":"Banished"} <b>${S.ban[p].length}</b></button>${S.n===3?`<button class="zb" data-p="${p}" data-skill="1">⚡ Skill ${S.skill[p]?(S.skill[p].uses?"<b>used</b>":"<b>✓</b>"):"+"}</button>`:""}</div>`;
  }
  renderEMZ();
  document.querySelector(".mid").classList.toggle("flip",S.view==="2p"&&S.turn===1);
  const b0=fieldBg(0),b1=fieldBg(1),fb=$("fbg");
  if(!b0&&!b1)fb.style.display="none";
  else{fb.style.display="block";const two=b0&&b1&&b0!==b1;fb.className=two?"":"one";
    $("fb0").style.backgroundImage=b0||b1;$("fb1").style.backgroundImage=b1||b0}
  const ph=PHASES[S.ph];
  $("status").innerHTML=oppWait()?`Turn ${S.tc} • Opponent's turn`:`Turn ${S.tc} • ${NAME(S.turn)==="You"?"Your turn":"Opponent's turn"} • ${ph.n}${ph.sub?" – "+ph.sub[S.sub]:""} <small style="font-weight:400;color:${S.ns?"var(--red)":"var(--green)"}">• Normal Summon ${S.ns?"used":"available"}</small>${S.tc===1&&S.ph===0?` <small style="color:var(--gold)">• first turn: no draw</small>`:S.tc===1&&/^Main Phase/.test(ph.n)?` <small style="color:var(--gold)">• first turn: no Battle Phase</small>`:""}`;
  const pb=$("phase");
  pb.className=oppWait()?"wait":"";
  pb.textContent=oppWait()?"Opponent's turn — tap when it's your turn":nextLabel();
  if(S.paused){const pm=S.mon[S.paused.p][S.paused.i];pb.className="paused";pb.textContent="▶ Continue the paused attack";$("status").innerHTML=`⏸ Attack paused (${esc(pm?pm.name:"?")}) — resolve effects, then continue`}
  $("rules").textContent=S.paused?"✖ End attack":"Rules";
  lpAnim();
  gameOver();
  if(FXQ.length)fxFlush();
  undoTrack();
  save();
}
// ---------- Effects: slash, shield, red flash, dust ----------
let FXQ=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const monEl=(p,i)=>document.querySelector(`.slot[data-p="${p}"][data-i="${i}"][data-row="mon"]`);
function fxAdd(cls,r,w,h,html,css){
  const e=document.createElement("div");e.className=cls;
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  e.style.cssText=`left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px;${css||""}`;
  if(html)e.innerHTML=html;
  $("fx").appendChild(e);return e;
}
const fxLife=(e,ms)=>setTimeout(()=>e.remove(),ms);
function fxSlash(r,flip){
  const L=Math.min(Math.max(r.width,r.height)*2.3,380),a=(flip?35:-35)*Math.PI/180,cx=r.left+r.width/2,cy=r.top+r.height/2;
  const e=document.createElement("div");e.className="fxslash";
  e.style.cssText=`left:${cx-Math.cos(a)*L/2}px;top:${cy-Math.sin(a)*L/2}px;width:${L}px;--a:${flip?35:-35}deg`;
  $("fx").appendChild(e);fxLife(e,420);
}
function fxFlash(r){const e=fxAdd("fxflash",r,Math.min(r.width*1.6,240),Math.min(r.height*1.6,300));fxLife(e,600)}
function fxDust(r){const w=Math.min(Math.max(r.width,r.height)*1.5,230);const e=fxAdd("fxdust",r,w,w);fxLife(e,800)}
const shieldW=r=>Math.min(Math.max(r.width*1.5,90),190);
function fxShieldHold(r){ // the shield holds: shakes and says BLOCKED
  const w=shieldW(r),h=w*1.21;
  const e=fxAdd("fxshield hold",r,w,h);fxLife(e,1400);
  const t=fxAdd("fxtext",{left:r.left,top:r.top-h*0.45,width:r.width,height:r.height},180,40,"BLOCKED","animation-delay:.25s;opacity:0");fxLife(t,1400);
}
function fxShieldBreak(r){ // the shield splits in two
  const w=shieldW(r),h=w*1.21;
  const a=fxAdd("fxshield half l",r,w,h),b=fxAdd("fxshield half r",r,w,h);fxLife(a,900);fxLife(b,900);
}
function fxLunge(p,i,toRect){
  const el=monEl(p,i);if(!el||!toRect||!el.animate)return;
  const r=el.getBoundingClientRect();let dx=(toRect.left+toRect.width/2-r.left-r.width/2)*0.35,dy=(toRect.top+toRect.height/2-r.top-r.height/2)*0.35;
  if(el.closest(".side.opp")||el.closest('.emzcell[style*="rotate"]')){dx=-dx;dy=-dy} // those halves are turned upside down
  el.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${dx}px,${dy}px) scale(1.1)`,offset:.5},{transform:"translate(0,0) scale(1)"}],{duration:420,easing:"ease-in-out"});
}
function fxRing(r,color){const e=fxAdd("fxring",r,r.width+10,r.height+10,"",`--c:${color}`);fxLife(e,1000)}
function fxChip(r,text,color){const e=document.createElement("div");e.className="fxchip";e.textContent=text;e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top-4}px;--c:${color}`;$("fx").appendChild(e);fxLife(e,1000)}
function fxArrow(ra,rt){
  const x1=ra.left+ra.width/2,y1=ra.top+ra.height/2,x2=rt.left+rt.width/2,y2=rt.top+rt.height/2;
  const len=Math.hypot(x2-x1,y2-y1),k=Math.max(0,(len-Math.max(rt.width,rt.height)*0.45)/len); // stop at the edge of the target
  const ex=x1+(x2-x1)*k,ey=y1+(y2-y1)*k;
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("class","fxarrow");
  svg.innerHTML=`<defs><marker id="fxah" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffd45a"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" marker-end="url(#fxah)" style="--len:${len}"/>`;
  $("fx").appendChild(svg);fxLife(svg,1000);
}
// plan: {kind:"direct",p,i,q} | {p,i,q,k,def,brk,tDies,aDies,aTxt,tTxt}
async function fxBattle(pl){
  if(calmMotion())return;
  const ra=monEl(pl.p,pl.i)&&monEl(pl.p,pl.i).getBoundingClientRect();
  if(pl.kind==="direct"){
    const lp=document.querySelector(`#s${pl.q} .lp`);const rl=lp&&lp.getBoundingClientRect();
    if(rl&&ra){fxRing(ra,"#ffd45a");fxRing(rl,"#ff5d6c");fxChip(ra,pl.aTxt||"ATTACKER","#ffd45a");fxArrow(ra,rl);await sleep(420)}
    if(rl){fxLunge(pl.p,pl.i,rl);await sleep(230);fxSlash(rl);await sleep(380)}
    return;
  }
  const el=monEl(pl.q,pl.k),rt=el&&el.getBoundingClientRect();if(!rt||!ra)return;
  fxRing(ra,"#ffd45a");fxRing(rt,"#ff5d6c");fxChip(ra,pl.aTxt||"ATTACKER","#ffd45a");fxChip(rt,pl.tTxt||"TARGET","#ff8a8a");fxArrow(ra,rt);await sleep(420);
  fxLunge(pl.p,pl.i,rt);await sleep(200);
  if(pl.def){
    if(pl.brk){ // the shield appears, the slash hits it, it splits in two, the monster is destroyed
      const w=shieldW(rt),sh=fxAdd("fxshield",rt,w,w*1.21);
      await sleep(300);fxSlash(rt);await sleep(220);
      sh.remove();fxShieldBreak(rt);await sleep(300);
      if(pl.tDies)fxFlash(rt);await sleep(520)}
    else{fxShieldHold(rt);await sleep(280);fxSlash(rt);await sleep(900)}
  }else{
    fxSlash(rt);await sleep(300);
    if(pl.tDies)fxFlash(rt);if(pl.aDies)fxFlash(ra);
    await sleep(600);
  }
}
function fxFlush(){
  const q=FXQ;FXQ=[];if(calmMotion())return;
  requestAnimationFrame(()=>q.forEach(f=>{if(f.t==="dust"){const el=monEl(f.p,f.i);if(el)fxDust(el.getBoundingClientRect())}}));
}

// ---------- Undo: every change to the game state can be taken back ----------
let UNDO=[],LASTSTR=null,UNDOING=false,UNDOMERGE=false; // UNDOMERGE: several changes count as one undo step
function toast(t){const e=$("toast");if(!e)return;e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1300)}
function undoTrack(){
  if(UNDOMERGE)return;
  const cur=JSON.stringify(S);
  if(LASTSTR!==null&&cur!==LASTSTR&&!UNDOING){UNDO.push(LASTSTR);if(UNDO.length>60)UNDO.shift()}
  LASTSTR=cur;UNDOING=false;
  const b=$("btnUndo");if(b)b.disabled=!UNDO.length;
}
function undoStep(){
  if(!UNDO.length){toast("Nothing to undo");return}
  const snap=UNDO.pop();UNDOING=true;
  S=JSON.parse(snap);
  if(dlg.open)dlg.close();
  render();
  toast("↩ Undone");
}

// ---------- LP counter animation (counts up/down like in the series) ----------
const LPD=[null,null],LPA=[null,null];let LPHOLD=false; // LPHOLD: duel intro running, show 0 LP and count up afterwards
const lpMax=()=>S.n===3?4000:8000;
const lpShown=p=>Math.round(LPD[p]??S.lp[p]);
function lpFill(p){const v=Math.max(0,Math.min(1,(LPD[p]??S.lp[p])/lpMax()));return`width:${(v*100).toFixed(1)}%;background:${v>.5?"#52d68a":v>.25?"#ffb43d":"#ff5d6c"}`}
function lpPaint(p){
  const lp=document.querySelector(`#s${p} .lp`);if(!lp)return;
  const num=lp.querySelector(".num"),fill=lp.querySelector(".lpfill");
  if(num)num.textContent=lpShown(p);
  if(fill)fill.setAttribute("style",lpFill(p));
}
function lpAnim(){
  if(LPHOLD){for(let p=0;p<2;p++){LPD[p]=0;LPA[p]=null;lpPaint(p)}return}
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  for(let p=0;p<2;p++){
    const to=S.lp[p];
    if(LPD[p]===null||calm){LPD[p]=to;LPA[p]=null;lpPaint(p);continue}
    const a=LPA[p];
    if(a&&a.to===to){lpPaint(p);const lp=document.querySelector(`#s${p} .lp`);if(lp)lp.classList.add(a.dir<0?"dmg":"heal");continue}
    if(LPD[p]===to){LPA[p]=null;lpPaint(p);continue}
    const from=LPD[p],dir=to<from?-1:1,dur=Math.min(1500,Math.max(500,Math.abs(to-from)/4000*1200+400));
    const anim=LPA[p]={to,dir,from,t0:performance.now(),dur};
    const lp=document.querySelector(`#s${p} .lp`);if(lp){lp.classList.remove("dmg","heal");void lp.offsetWidth;lp.classList.add(dir<0?"dmg":"heal")}
    const step=now=>{
      if(LPA[p]!==anim)return;
      const k=Math.min(1,(now-anim.t0)/anim.dur),e=1-Math.pow(1-k,3);
      LPD[p]=anim.from+(anim.to-anim.from)*e;
      lpPaint(p);
      if(k<1)requestAnimationFrame(step);
      else{LPD[p]=anim.to;LPA[p]=null;lpPaint(p);const l=document.querySelector(`#s${p} .lp`);if(l)l.classList.remove("dmg","heal")}
    };
    requestAnimationFrame(step);
  }
}
function renderEMZ(){
  const el=$("emz");if(!el)return;
  const cells=[EMZ0,EMZ1].map(k=>{const p=S.mon[0][k]?0:S.mon[1][k]?1:-1;return{k,p}});
  document.body.classList.toggle("emzon",S.n===5&&cells.some(c=>c.p>=0));
  if(S.n!==5||cells.every(c=>c.p<0)){el.hidden=true;el.innerHTML="";return}
  const one=S.view==="1p";
  const col=[null,cells[0],null,cells[1],null];
  el.className="emzrow";el.hidden=false;
  el.innerHTML=col.map(c=>{
    if(!c)return"<div></div>";
    if(c.p<0)return`<div class="emzcell ph">EX</div>`;
    const html=slotHTML(c.p,c.k,S.mon[c.p][c.k]);
    return`<div class="emzcell on" ${c.p===1&&!one?'style="transform:rotate(180deg)"':""}>${html}</div>`;
  }).join("");
}
function gameOver(){
  if(LPA[0]||LPA[1]){setTimeout(gameOver,150);return}
  const o=$("over"),a=S.lp[0],b=S.lp[1];
  if(a>0&&b>0){o.hidden=true;return}
  const m=(x,y)=>x===0&&y===0?["DRAW","draw"]:x===0?["YOU LOST","lose"]:["YOU WIN","win"];
  const [t0,c0]=m(a,b),[t1,c1]=m(b,a);
  const two=S.view!=="1p";
  o.innerHTML=(two?`<div class="oh rot ${c1}">${t1}</div>`:"")+`<div class="omid"><button id="ovU">↩ Undo last change</button><button id="ovN" style="background:var(--gold);color:#241a00">New duel</button></div><div class="oh ${c0}">${t0}</div>`;
  o.hidden=false;
  $("ovU").onclick=()=>undoStep();
  $("ovN").onclick=()=>{const v=S.view,n=S.n;startDuel(n===3?4000:8000,n,v)};
}
function fieldChip(p){
  const f=S.field[p];
  if(!f)return`<span style="color:var(--dim)">+ Field<br>Spell</span>`;
  return`<b>${f.pos==="FD"?"Set Field":esc(f.name)}</b>${f.pos==="FD"?"":badges(f)}`;
}
function slotHTML(p,i,m){
  const a=`data-p="${p}" data-i="${i}" data-row="mon"`;
  if(!m)return`<div class="slot empty" ${a}>+<br><span class="sl-lbl">monster</span></div>`;
  if(m.pos==="FD")return`<div class="slot" ${a}><div class="cbw"><div class="cb land fd"></div></div><div class="st dim">? / ?</div></div>`;
  const cls=x=>x>0?"up":x<0?"down":"";
  const d=m.pos==="DEF",s=stats(p,i),da=s.a-m.atk,dd=s.d-m.def;
  return`<div class="slot" ${a}>${badges(m)}
    <div class="cbw"><div class="cb ${d?"land def":"port atk"}"><span class="n">${esc(m.name)}</span></div></div>

// ---------- Card data ----------
let CARDS=null;
async function cards(){
  if(CARDS)return CARDS;
  const r=await fetch("data/cards.json");
  CARDS=(await r.json()).map(c=>({id:c[0],name:c[1],type:c[2],desc:c[3],atk:c[4],def:c[5],lvl:c[6],attr:c[7],race:c[8],lm:c[9]|0,sc:c[10],lc:c[1].toLowerCase()}));
  return CARDS;
}
async function find(q,row){
  const all=await cards();q=q.trim().toLowerCase();if(q.length<2)return[];
  const st=[],inn=[];
  for(const c of all){if(row==='mon'&&!/Monster/.test(c.type))continue;if(row==='st'&&(!/Spell|Trap/.test(c.type)||/Field/.test(c.type)))continue;if(row==='stp'&&!(/Spell|Trap/.test(c.type)&&!/Field/.test(c.type))&&!/Pendulum/.test(c.type))continue;if(row==='field'&&c.type!=='Field Spell')continue;const i=c.lc.indexOf(q);if(i===0)st.push(c);else if(i>0)inn.push(c);if(st.length+inn.length>=60)break}
  return st.concat(inn).slice(0,50);
}
function cardInfo(c){
  const mon=c.atk!=null||c.def!=null||/Monster/.test(c.type);
  return`<b>${esc(c.name)}</b><br><small>${esc(c.type)}${c.attr?" • "+esc(c.attr):""}${c.race?" • "+esc(c.race):""}${c.lvl!=null?" • Level/Link "+c.lvl:""}</small>${mon?`<br>ATK ${c.atk===-1?"?":c.atk??"-"} / DEF ${c.def===-1?"?":c.def??"-"}`:""}<hr style="border-color:#4a3220">${esc(c.desc).replace(/\n/g,"<br>")}`;
}

// graveyard / banished piles: lists of {name,id,type}; custom monsters (no id) are not tracked
function sendTo(p,kind,c,fromField){
  if(!c||!c.name||c.id===undefined)return;
  const e={name:c.name,id:c.id,type:c.type};
  if(fromField&&kind==="gy"&&/Pendulum/.test(c.type||"")){S.edup[p].unshift(e);addLog(`${c.name} (Pendulum) went to the Extra Deck face-up instead of the Graveyard`);return}

}
function removeMon(p,i,dest="gy"){
  const m=S.mon[p][i];
  S.mon[p][i]=null;
