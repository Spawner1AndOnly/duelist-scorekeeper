<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0907">
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>Duelist Scorekeeper</title>
<style>
:root{--cw:min(calc((100vw - 28px) / 5 / 1.458 - 5px),56px);--ch:calc(var(--cw) * 1.458);--bg:#0d0907;--panel:rgba(32,18,9,.74);--panel2:rgba(84,46,18,.82);--txt:#fff1e3;--dim:#d0ae93;--gold:#ffb43d;--red:#ff5d6c;--green:#52d68a;--blue:#5aa9ff}
@media (max-height:700px){:root{--cw:min(calc((100vw - 28px) / 5 / 1.458 - 5px),37px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg) url(img/bg-embers.jpg) center/cover no-repeat;color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:0;padding:2px 0}
.side.opp{transform:rotate(180deg)}
#fbg{position:fixed;inset:0;z-index:0;display:none;background:var(--bg)}
#fbg div{position:absolute;left:0;right:0;background:center/cover no-repeat}
#fb1{top:0;height:50%;transform:rotate(180deg)}#fb0{top:50%;height:50%}
#fbg.one #fb0{top:0;height:100%}#fbg.one #fb1{display:none}
#app{position:relative;z-index:1}
.emzrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 0;position:relative;z-index:1}
.emzcell{min-height:calc(var(--ch) + 10px);display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:10px;color:var(--dim)}
.emzcell.on{padding:0}.emzcell .slot{width:100%}
.emzcell.ph{border:1px dashed #6b452488;background:#0006}
.lprow.md .fchip{flex-basis:70px}
.emzbox{flex:none;align-self:stretch;display:flex;gap:3px;width:96px}.emzbox.two{width:auto}
.emzbox .slot{--cw:24px;--ch:35px;flex:1;min-height:0!important;padding:2px 4px 2px 3px;border-radius:10px}
.emzbox .slot.empty{flex-direction:column;gap:0;font-size:15px;line-height:1;border-style:dashed}.emzbox .slot.empty .sl-lbl{font-size:9px;line-height:1.1}
.emzbox .slot:not(.empty){display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:4px;row-gap:1px;align-content:center;justify-items:start}
.emzbox .cbw{grid-row:1/3}.emzbox .cb .n{display:none}.emzbox .mn{font-size:10px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.emzbox .slot .st{height:auto;line-height:1.1;font-size:10px;letter-spacing:-.4px}.emzbox .ai,.emzbox .eqs,.emzbox .lk,.emzbox .atkx{display:none}
.emzbox .lvb{transform:scale(.75);transform-origin:top left;top:-2px;left:-2px}
.emzbox.two .mn,.emzbox.two .st .sl,.emzbox.two .st .sd,.emzbox.two .st span:nth-of-type(3){display:none}.emzbox.two .slot{grid-template-columns:auto auto}
.cb.pend{background:linear-gradient(160deg,#27b58a,#e0414f)}
.mid .row1{transition:transform .35s}.mid .row1.flip{transform:rotate(180deg)}
.stopp{transform:rotate(180deg)}.st1.idle{opacity:.5}
.mid button:disabled{opacity:.35}
dialog.flip{transform:rotate(180deg)}.x.fl{float:left;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;z-index:200;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
dialog button.chg{animation:chg .6s ease-out}@keyframes chg{0%{box-shadow:0 0 0 3px #ffe08a,0 0 18px #ffd34d;filter:brightness(1.35)}100%{filter:none}}
.slot,.fchip{position:relative}.bdg{position:absolute;top:1px;right:3px;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 1px 2px #000;pointer-events:none}
.lk{font-size:10px;letter-spacing:1px;color:var(--gold);line-height:1;white-space:nowrap}
#pickbar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;display:flex;align-items:center;gap:10px;background:#1c1109ee;border:2px solid var(--gold);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 4px 18px #000b;width:max-content;max-width:calc(100vw - 16px);box-sizing:border-box}#pickbar span{min-width:0;line-height:1.25}#pickbar button{white-space:nowrap;flex:none}#pickbar.rot{transform:translate(-50%,-50%) rotate(180deg)}
body.picking .slot.pk{outline:3px solid var(--gold);outline-offset:-2px;animation:pkp .8s infinite alternate}
body.picking .slot.picked{outline-color:var(--green);animation:none;background:#1f5a3a88}
body.picking .slot.picked::after{content:"¹4";position:absolute;right:3px;bottom:2px;font-size:18px;font-weight:900;color:var(--green);text-shadow:0 1px 3px #000}
@keyframes pkp{to{outline-color:#fff}}
.cth{display:flex;align-items:center;justify-content:space-between;gap:8px}.ctb{display:flex;align-items:center;gap:5px;flex:none}.ctb .lvb,.ctb .ai{position:static;font-size:13px;line-height:20px;padding:0 6px 0 3px}.ctb .ai{width:24px;height:24px;padding:0}.ctb .lvb i{font-size:14px}
.ai{position:absolute;top:2px;right:3px;width:17px;height:17px;border-radius:50%;box-shadow:0 1px 3px #000a;pointer-events:none;z-index:1}.ai~.bdg{top:21px}
.lvb{position:absolute;top:2px;left:3px;display:flex;align-items:center;gap:1px;background:#e8731a;color:#fff;border-radius:9px;padding:0 4px 0 2px;font-size:10px;font-weight:800;line-height:14px;box-shadow:0 1px 3px #000a;pointer-events:none;z-index:1}
.lvb i{font-style:normal;color:#ffe08a;font-size:11px}
.lvb.rk{background:#23232b;border:1px solid #ffe08a;line-height:12px}.lvb.lkn{background:#1f5fd0}
.oub{position:absolute;right:3px;top:58px;z-index:3;min-width:26px;padding:1px 5px;border-radius:9px;background:#0b0a16;border:1.5px solid #6aa8ff;color:#cfe3ff;font-size:11px;font-weight:800;text-align:center;box-shadow:0 0 6px #6aa8ff99;pointer-events:auto;cursor:pointer;line-height:15px}
.atkx{font-size:9px;line-height:11px;color:#ffd45a;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:1px}.atkx img{height:13px;width:auto}
.sti{height:12px;width:auto;vertical-align:-2px;margin-right:1px}.sti.sd{margin-left:1px;margin-right:0}.slot .st:has(.sti){font-size:10.5px;letter-spacing:-.6px;white-space:nowrap}.st .sl{margin:0 1px;opacity:.8}
.eqs{position:absolute;top:22px;left:3px;display:flex;flex-direction:column;gap:0;font-size:14px;line-height:13px;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;z-index:1}
.eqt{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-size:16px;line-height:15px;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;z-index:1}
.lprow{display:flex;align-items:center;gap:6px}
.lp{flex:1;background:var(--panel);border-radius:12px;padding:4px 10px;display:flex;align-items:baseline;justify-content:space-between;border:2px solid transparent;position:relative;overflow:hidden}
.lpfill{position:absolute;left:0;bottom:0;height:5px;border-radius:0 3px 3px 0;background:#52d68a;pointer-events:none}
.lp::after{content:"";position:absolute;inset:0;border-radius:10px;opacity:0;pointer-events:none}
.lp.dmg{animation:lpshake .4s}.lp.dmg .num{color:var(--red)}.lp.dmg::after{background:#ff2d3f;animation:lpflash .6s}
.lp.heal{animation:lpshakev .4s}.lp.heal .num{color:var(--green)}.lp.heal::after{background:#3dff8a;animation:lpflash .6s}
@keyframes lpflash{0%{opacity:.75}100%{opacity:0}}
@keyframes lpshakev{0%,100%{transform:translateY(0)}20%{transform:translateY(-4px)}40%{transform:translateY(4px)}60%{transform:translateY(-3px)}80%{transform:translateY(2px)}}
@keyframes lpshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.lp.turn{border-color:var(--gold)}
.lp .nm{font-size:12px;color:var(--dim)}
.lp .num{font-size:38px;font-weight:800;line-height:1.1}
.lp .num.low{color:var(--red)}
.btns{display:flex;gap:3px}
button{font:inherit;color:var(--txt);background:var(--panel2);border:0;border-radius:10px;padding:8px 6px;min-width:40px}
button:active{filter:brightness(1.4)}
.lpb{font-size:11px;font-weight:700;padding:8px 1px;min-width:0}
.slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;min-height:0}
.slot{background:var(--panel);border-radius:10px;padding:3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;font-size:11px;min-height:0;overflow:hidden;border:1px solid #6b4524}
.slot.empty{min-height:calc(var(--ch) + 12px);color:var(--dim);justify-content:center;font-size:22px}
.slot .n{font-weight:700;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.slot .st{font-size:12px;font-weight:400;white-space:nowrap;letter-spacing:-.3px}.slot .st{height:14px;line-height:14px;flex:none}.slot[data-row="mon"],.slot[data-row="st"]{min-height:calc(var(--ch) + 25px)} /* room for card + ATK/DEF line even when empty: the board does not shift when a monster arrives */
.slot .st span{opacity:.75}.slot .st span.act{font-weight:900;opacity:1}
.slot .st .up{color:var(--green)}.slot .st .down{color:var(--red)}
.cb{border-radius:4px;display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden;border:2px solid #e8c36a;box-shadow:0 2px 6px #0008;flex:none}
.cb .n{font-size:8px;line-height:1.05;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cb.port{width:var(--cw);height:var(--ch)}
.cb.land{width:var(--ch);height:var(--cw)}
.cb.atk{background:linear-gradient(160deg,#e0414f,#8a1424)}
.cb.def{background:linear-gradient(160deg,#4a8fe8,#173f8a)}
.cb.spell{background:linear-gradient(160deg,#27b58a,#0d5c47)}
.cb.trap{background:linear-gradient(160deg,#c15bb0,#5a1f55)}
.cb.fdv{background:url(img/cardback-v.jpg) center/cover}
.cb.fd{background:url(img/cardback-h.jpg) center/cover}
/* card colours (Yu-Gi-Oh style): the same colour on the field card and in its pop-up */
[data-th=normal],.th-normal{--c1:#d4ad4a;--c2:#8a6a1a;--fg:#fff}
[data-th=effect],.th-effect{--c1:#d27a34;--c2:#8a3d12;--fg:#fff}
[data-th=ritual],.th-ritual{--c1:#4a7fdc;--c2:#1a3a86;--fg:#fff}
[data-th=fusion],.th-fusion{--c1:#9a5cc4;--c2:#47206b;--fg:#fff}
[data-th=synchro],.th-synchro{--c1:#ebe7da;--c2:#a29d8a;--fg:#1d1a12}
[data-th=xyz],.th-xyz{--c1:#4a4a54;--c2:#101014;--fg:#fff}
[data-th=link],.th-link{--c1:#1b6f9a;--c2:#08324f;--fg:#fff}
[data-th=token],.th-token{--c1:#9a9a9a;--c2:#555;--fg:#fff}
[data-th=spell],.th-spell{--c1:#1f9478;--c2:#0a4638;--fg:#fff}
[data-th=trap],.th-trap{--c1:#d7399f;--c2:#6e0e52;--fg:#fff}
[data-th=menu]{--c1:#4b301b;--c2:#1a1009;--fg:#fff1e3}
[data-th=gy]{--c1:#6b7681;--c2:#222930;--fg:#fff}
[data-th=ban]{--c1:#7a55e0;--c2:#1b1043;--fg:#fff}
[data-th=pend],.th-pend{--c1:#d9832a;--c2:#1f8f6e;--fg:#fff}
.cb[class*="th-"]{background:linear-gradient(160deg,var(--c1),var(--c2));border:2px solid #f0d78a;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #0009,0 2px 6px #0008}
.cb.th-synchro .n{color:#1d1a12;text-shadow:none}
dialog[data-th]{background:linear-gradient(165deg,var(--c1),var(--c2));color:var(--fg);border:3px solid #120c05;box-shadow:inset 0 0 0 2px #e8c36a,inset 0 0 0 4px #120c05;padding:18px}
dialog[data-th] h2{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:20px;letter-spacing:.3px;background:linear-gradient(#ffffff55,#ffffff18);border:2px solid #000a;border-radius:6px;padding:3px 10px;overflow:hidden;text-shadow:0 1px 2px #0008}
dialog[data-th=gy]{background:linear-gradient(#00000033,#00000073),url(img/gy-portrait.webp) center/cover}
dialog[data-th=ban]{background:linear-gradient(#00000033,#00000073),url(img/ban-portrait.webp) center/cover}
dialog[data-th] .res div{background:#0000002e;border:0;border-left:6px solid #ffffff55;border-radius:6px;margin:4px 0}
dialog[data-th] .res div[class*=th-]{border-left-color:var(--c1);background:linear-gradient(90deg,#0000004a,#00000020)}
dialog[data-th] .res div small{color:#ffffffcc}
.zi{height:17px;width:auto;vertical-align:-3px}
.pilehd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.pilehd img{height:54px;flex:none;filter:drop-shadow(0 2px 3px #000a)}.pilehd .sw{font-size:42px;line-height:54px;flex:none}.pilehd h2{flex:1;margin:0!important}
dialog[data-th=synchro] h2{text-shadow:none}dialog[data-th=synchro] .x{color:#1d1a12}
dialog[data-th] .card{background:linear-gradient(#f4e8c6,#e6d49d);color:#2b1d08;border:2px solid #3a2a0c;border-radius:4px}
dialog[data-th] #ct{background:linear-gradient(#f4e8c6,#e6d49d);color:#2b1d08;border:2px solid #3a2a0c;border-radius:4px}
dialog[data-th] #ct hr{border-color:#8a6c2a!important}
.cbw{height:var(--ch);width:100%;display:flex;align-items:center;justify-content:center}
.sl-lbl{font-size:9px;color:var(--dim);margin:0 2px}
.st.dim{color:var(--dim)}
.mid{transition:transform .35s;display:flex;flex-direction:column;gap:4px;padding:4px 0}
.mid .st1{text-align:center;font-weight:800;font-size:14px;text-shadow:0 1px 4px #000,0 0 8px #000;white-space:nowrap;overflow:hidden;height:19px;line-height:19px} /* fixed height: a longer text gets a smaller font (fitMid), so the board never shifts */
.mid .row1{display:flex;gap:4px;align-items:stretch;height:60px}.mid .row1 button{overflow:hidden}
.side.compact{flex:.6}.side.compact .lp .num{font-size:26px}.side.compact .lpb{padding:5px 3px;font-size:11px}
#phase{flex:2;background:#8be32a;color:#0b2200;font-weight:800;font-size:15px;padding:10px 6px;border-radius:12px;line-height:1.2}
#phase.wait{background:#7a5230;color:var(--txt)}
#rules{flex:1;background:#ff6a2b;color:#2a0e00;font-weight:800;border-radius:12px}
.mid button.sm{font-size:20px;padding:10px 4px;min-width:36px}
dialog{background:#1c1109;border:1px solid #6b4524;color:var(--txt);border:0;border-radius:16px;width:min(94vw,520px);max-height:92dvh;padding:14px;overflow:auto}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 8px;font-size:18px}

dialog .row button{flex:1;min-width:56px}
dialog .volrow{align-items:center}
dialog .volrow button{flex:0 0 112px}
dialog .volrow button.off{opacity:.55}
dialog .mtn{font-size:12px;opacity:.75;text-align:right;margin:-4px 2px 4px}
dialog .volrow button.nx{flex:0 0 44px;min-width:44px;padding-left:0;padding-right:0}
dialog .volrow input[type=range]{flex:1;min-width:0;accent-color:#d4a940;height:28px}
input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #7a5230;background:#0a0705;color:var(--txt);user-select:text}
.res{max-height:38dvh;overflow:auto;margin-top:6px}
.res div{padding:8px;border-bottom:1px solid #4a3220;font-size:14px}
.res small{color:var(--dim)}
.card{background:#0a0705;border-radius:10px;padding:10px;margin-top:8px;font-size:14px;line-height:1.35;user-select:text;max-height:34dvh;overflow:auto}
.card b{color:var(--gold)}
.phtxt h3{margin:10px 0 2px;font-size:14px}.phtxt .may{color:var(--green)}.phtxt .cant{color:var(--red)}
.phtxt ul{margin:2px 0 0 18px;padding:0;font-size:14px}
.big{font-size:48px;text-align:center;font-weight:800;margin:10px 0}
.x{float:right;background:none;font-size:22px}
.hist{font-size:12px;color:var(--dim);max-height:20dvh;overflow:auto}
.oh{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;position:relative;z-index:3;overflow:hidden}

#over[hidden]{display:none}
.oban{position:relative;min-width:min(86vw,340px);padding:16px 18px 14px;border-radius:10px;background:linear-gradient(165deg,#4b301bf0,#1a1009f5);border:3px solid #120c05;box-shadow:inset 0 0 0 2px #e8c36a,inset 0 0 0 4px #120c05,0 6px 24px #000d;opacity:0;transform:scale(.6)}

.oban.draw{background:linear-gradient(165deg,#4b3d1bf0,#1a1509f5)}

.oban.win .obt{color:#8be32a;text-shadow:0 4px 0 #000,0 0 26px #8be32a}.oban.lose .obt{color:#ff4d5e;text-shadow:0 4px 0 #000,0 0 20px #ff2d3f88}.oban.draw .obt{color:#ffd27a}
.obs{font:700 13px/1.3 Georgia,serif;color:#f1dcc8;margin-top:8px;padding-top:7px;border-top:1px solid #e8c36a55}
.orays{position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:repeating-conic-gradient(#ffd27a55 0 7deg,#0000 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,#0000 66%);mask:radial-gradient(circle,#000 18%,#0000 66%);z-index:-1;pointer-events:none;display:none;animation:rays 14s linear infinite}
.oban.win .orays{display:block}
@keyframes rays{to{transform:rotate(360deg)}}
.orem{font-size:14px;font-weight:600;color:#ffd27a;margin-top:10px;line-height:1.45}
.omid{display:flex;gap:10px;justify-content:center;padding:10px;position:relative;z-index:3;opacity:0;transition:opacity .5s}
#over.done .omid{opacity:1}
.omid button{padding:12px 18px;font:700 16px/1.2 Georgia,serif;border-radius:10px;border:2px solid #120c05;box-shadow:inset 0 0 0 1.5px #e8c36a,0 3px 8px #000c;background:linear-gradient(180deg,#6b4524,#3a2412);color:#fff1e3}
.omid #ovN{background:linear-gradient(180deg,#ffd27a,#d39a2a);color:#241a00}
#over:not(.done) .omid button{pointer-events:none}
.endfx{position:fixed;pointer-events:none;z-index:2}
.endshard{overflow:hidden}.endshard>.side{position:absolute;left:0;top:0}
.endcrack svg{overflow:visible}.endcrack path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #9cf);stroke-dasharray:900;stroke-dashoffset:900;animation:crack .5s ease-out forwards}
.endcrack path.ring{stroke-width:1.6;animation-delay:.18s}.endcrack.off{opacity:0;transition:opacity .2s}
@keyframes crack{to{stroke-dashoffset:0}}
.endember{border-radius:50%;box-shadow:0 0 8px currentColor}
.endportal{filter:drop-shadow(0 0 18px #a46bff)}
@keyframes endshake{0%,100%{translate:0 0}15%{translate:-10px 6px}30%{translate:9px -7px}50%{translate:-7px -5px}70%{translate:6px 6px}85%{translate:-3px 2px}} /* 'translate', not 'transform': the opponent's half stays turned 180 degrees */
.oban.wA,.oban.lA{animation:banslam .55s cubic-bezier(.2,1.5,.4,1) .9s forwards}
.oban.lA{animation-delay:1.25s}

<script>
// ---------- Phases (official order) ----------
const PHASES_MD=[
 {n:"Draw Phase",may:["The turn player draws 1 card (the first player does NOT draw on the very first turn of the duel). A player who cannot draw loses the Duel.","Quick Effects, Quick-Play Spells and Traps can be activated (after the draw)."],cant:["Normal Summon/Set.","Attack."]},
 {n:"Standby Phase",may:["Effects that trigger 'during the Standby Phase' (e.g. upkeep costs).","Quick Effects, Quick-Play Spells and Traps can be activated."],cant:["Normal Summon/Set.","Attack."]},
 {n:"Main Phase 1",may:["1 Normal Summon OR Set per turn (Tribute if needed).","Unlimited Special Summons and Flip Summons.","Activate Spells, Set Spells/Traps.","Change monsters' battle position (once per monster; not if it was just summoned or Set this turn).","Activate monster effects."],cant:["Attack (only in the Battle Phase)."]},
 {n:"Battle Phase",may:["Officially the Battle Phase has four steps (Start Step, Battle Step, Damage Step, End Step). This app treats it as ONE phase: attack whenever you like while you are in it.","Each face-up monster in Attack Position may attack once: declare an attacker and a target, or attack directly if the opponent has no monsters. You do not have to attack (or enter the Battle Phase) at all.","A face-down monster that is attacked is flipped face-up in the Damage Step.","Damage: ATK vs ATK → the difference is taken by the owner of the weaker monster; ATK vs DEF → damage only if ATK > DEF (the difference) — unless an effect says otherwise.","Quick Effects and Traps in the Battle Step."],cant:["Normal Summon/Set.","Change battle position.","In the Damage Step: only Counter Traps and effects that specifically allow it (e.g. ATK/DEF changes).","On the first turn of the duel the starting player has NO Battle Phase."]},
 {n:"Main Phase 2",may:["Everything from Main Phase 1 (Normal Summon only if you haven't done one yet).","Activate/Set Spells and Traps.","Special Summons."],cant:["Attack.","Change position of monsters that attacked or were summoned this turn."]},
 {n:"End Phase",may:["Effects 'at the end of the turn' / 'during the End Phase'.","Quick Effects and Traps can be activated.","Hand limit: if you hold more than 6 cards, discard down to 6."],cant:["Summon or attack.","After this, the turn ends and the opponent's turn begins."]}
];
// Speed Duel: no Main Phase 2 (official Speed Duel rules)
const PHASES_SD=PHASES_MD.filter(x=>x.n!=="Main Phase 2").map(x=>x.n==="Main Phase 1"?{n:"Main Phase",may:x.may.concat(["There is NO Main Phase 2 in Speed Duel: Set and use your Spells and Traps before you go to the Battle Phase."]),cant:x.cant}:x);
let PHASES=PHASES_MD;
const OPP_TURN_RULES={may:["Activate Traps you Set (not on the turn you Set them).","Activate Quick-Play Spells you Set and Quick Effects.","Respond to the opponent's actions (chain)."],cant:["Normal Summon/Set.","Activate Normal Spells.","Attack."]};

// ---------- State ----------
const KEY="ygoref.v2";
let S=load()||fresh();
S.st=S.st||[Array(5).fill(null),Array(5).fill(null)];S.field=S.field||[null,null];S.n=S.n||5;S.ns=!!S.ns;S.gy=S.gy||[[],[]];S.ban=S.ban||[[],[]];S.skill=S.skill||[null,null];S.edup=S.edup||[[],[]];S.pt=S.pt||[0,0];if(S.n===5)for(const a of S.mon)while(a.length<7)a.push(null);
function fresh(lp=8000,n=5){return{n,ns:false,field:[null,null],gy:[[],[]],ban:[[],[]],skill:[null,null],edup:[[],[]],pt:[0,0],lp:[lp,lp],sign:[-1,-1],turn:0,tc:1,ph:0,sub:0,startPlayer:0,view:"2p",mon:[Array(n===5?7:n).fill(null),Array(n===5?7:n).fill(null)],st:[Array(n).fill(null),Array(n).fill(null)],log:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const STEPS=[5,10,50,100,500,1000,2000];
const NAME=p=>p===0?"You":"Opponent";
const NAMES=p=>p===0?"Your":"Opponent's"; // possessive

// ---------- Phase stepping ----------
function stepFrom(st){
  let {ph,sub,turn,tc}=st;
  const cur=PHASES[ph];
  if(cur.sub&&sub<cur.sub.length-1)return{ph,sub:sub+1,turn,tc};
  if(ph<PHASES.length-1){
    ph++;
    if(tc===1&&PHASES[ph].n==="Battle Phase")ph=PHASES.length-1; // no Battle Phase on the first turn, and Main Phase 2 only follows a Battle Phase
    if(PHASES[ph].n==="Standby Phase"&&sbSkip(tc))ph++; // nothing to do in the Standby Phase: straight on to Main Phase 1
    return{ph,sub:0,turn,tc};
  }
  return{ph:0,sub:0,turn:1-turn,tc:tc+1};
}
// The Standby Phase is skipped when no card mentions it (445 cards do, always written out as "Standby Phase"):
// face-up cards on the field of both players + cards in the Graveyards, banished and the face-up Extra Deck (e.g. Sacred Phoenix of Nephthys).
// 'Stop at the Standby Phase' in the Rules pop-up of the Draw Phase (S.sbStop) stops there anyway, for a Trap or Quick-Play Spell.
let CARDID=null;
function cardDesc(e){if(e.desc)return e.desc;if(e.id==null)return"";if(!CARDS)return null;if(!CARDID){CARDID=new Map();CARDS.forEach(c=>CARDID.set(c.id,c))}const c=CARDID.get(e.id);return c?c.desc:""}
function standbyCards(){
  const L=[],add=(e,where)=>{if(!e||e.pos==="FD")return;const d=cardDesc(e);if(d===null||/Standby Phase/i.test(d))L.push(e.name+(where?" ("+where+")":""))};
  [0,1].forEach(c=>{
    S.mon[c].forEach(m=>add(m));S.st[c].forEach(e=>add(e));add(S.field[c]);
    (S.gy[c]||[]).forEach(e=>add(e,"Graveyard"));(S.ban[c]||[]).forEach(e=>add(e,"banished"));(S.edup&&S.edup[c]||[]).forEach(e=>add(e,"Extra Deck"));
  });
  return L;
}
function sbSkip(tc){
  if(S.phManual||S.sbStop===tc)return false; // menu 'Phases: Manual' = never skip
  if(!CARDS&&!sbSkip.ld){sbSkip.ld=1;cards().then(()=>render()).catch(()=>{})} // card texts of the piles not loaded yet: stop to be safe, and load them
  return !standbyCards().length;
}
function nextLabel(){
  const n=stepFrom(S);
  if(n.turn!==S.turn)return `Move to ${NAME(n.turn)==="You"?"your":"opponent's"} Draw Phase`;
  const p=PHASES[n.ph];
  return `Move to ${p.sub?p.sub[n.sub]:p.n}`;
}
function nextPhase(){
  if(S.paused){resumeBattle();return}
  if(oppWait()&&online()){toast("Wait: it's your opponent's turn");return}
  if(oppWait()){ctlEndPhase();Object.assign(S,{ph:0,sub:0,turn:0,tc:S.tc+1});S.ns=false;render();setTimeout(drawAsk,350);return}
  const n=stepFrom(S);if(n.turn!==S.turn)S.ns=false;
  if(PHASES[S.ph].n==="Draw Phase"&&n.turn===S.turn&&PHASES[n.ph].n!=="Standby Phase")setTimeout(()=>toast("Standby Phase: nothing to do"),50);
  Object.assign(S,n);if(PHASES[S.ph].n==="End Phase"||n.turn!==S.turn)ctlEndPhase();render();
  if(PHASES[S.ph].n==="Standby Phase")setTimeout(showStandby,350);
  if(PHASES[S.ph].n==="Draw Phase")setTimeout(drawAsk,350);
}
function oppWait(){return S.view==="1p"&&S.turn===1}
// Draw Phase (not on the very first turn of the duel): one pop-up to confirm the draw and move on (Standby Phase, or Main Phase 1 when it is skipped)
function drawAsk(){
  if(S.phManual||dlg.open||PHASES[S.ph].n!=="Draw Phase"||S.tc===1||oppWait())return;
  const p=S.turn;DLGP=p;
  open(`${closeX()}<h2>Draw Phase</h2><p>Draw 1 card.</p>
   <div class="row"><button id="drOk" style="background:#1f5a3a">✔ Card drawn → ${esc(nextLabel().replace(/^Move to /,""))}</button></div>
   <div class="row"><button id="drStay">Stay in the Draw Phase</button></div>
   <div class="row"><button id="drNo" style="background:#6b2230">⛔ No cards left to draw → lose the duel</button></div>
   <small>A player who cannot draw loses the Duel. Stay in the Draw Phase to activate a Trap or Quick-Play Spell.</small>`,()=>{
    $("drOk").onclick=()=>{dlg.close();nextPhase()};
    $("drStay").onclick=()=>dlg.close();
    $("drNo").onclick=()=>{dlg.close();setLP(p,0,()=>`${NAME(p)} could not draw a card and loses`)};
  });
}
// Soul Exchange and similar: "you cannot conduct your Battle Phase the turn you activate this card" -> warn (do not block) when moving on to the Battle Phase
const NOBP_RX=/cannot conduct your Battle Phase the turn you activate/i;
// the middle strip keeps the same height: a status line stays on 1 line, the phase button on 2 lines; a longer text gets a smaller font
function fitText(el,min){if(!el||el.hidden)return;el.style.fontSize="";let f=parseFloat(getComputedStyle(el).fontSize);
  while((el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)&&f>min){f-=.5;el.style.fontSize=f+"px"}}
function fitMid(){fitText($("status"),9);fitText($("statusOpp"),9);fitText($("phase"),10);fitText($("rules"),10)}
addEventListener("resize",()=>{try{fitMid()}catch(e){}});
function phaseClick(){
  if(!S.paused&&!oppWait()&&S.nobp===S.tc&&PHASES[stepFrom(S).ph].n==="Battle Phase"&&stepFrom(S).turn===S.turn){
    open(`${closeX()}<h2>⚠ Battle Phase skipped</h2><p>You activated a card this turn (such as Soul Exchange) that says you cannot conduct your Battle Phase. Moving on will skip your Battle Phase.</p>
     <div class="row"><button id="bk">Cancel</button><button id="sk" style="background:#1f5a3a">Skip to the End Phase</button></div>
     <div class="row"><button id="an" style="background:#6b2230">Go to the Battle Phase anyway</button></div>`,()=>{
      $("bk").onclick=()=>dlg.close();
      $("sk").onclick=()=>{dlg.close();Object.assign(S,{ph:PHASES.length-1,sub:0});ctlEndPhase();render()};
      $("an").onclick=()=>{dlg.close();nextPhase()};
    });
    return;
  }
  nextPhase();
}

// ---------- Render ----------
const $=id=>document.getElementById(id);
// ---------- Sound: all sounds are generated here with Web Audio (no files, no copyright) ----------
const SFX=(()=>{
  let ac=null,master,echo,on=true,vol=1,mOn=true,mVol=.5,mSrc=null,mT=null,mGain=null,mIdx=0,mBusy=false;
  const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  on=LS("ygoref-snd","1")!=="0";mOn=LS("ygoref-mus","1")!=="0";vol=+LS("ygoref-sv",1);mVol=+LS("ygoref-mv",.5);
  function init(){
    if(ac)return ac;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    ac=new C();master=ac.createGain();master.gain.value=.55*vol;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    echo=ac.createGain();const d=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter(),wet=ac.createGain();
    d.delayTime.value=.13;fb.gain.value=.4;lp.type="lowpass";lp.frequency.value=2400;wet.gain.value=.5;
    echo.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(master); // echo: every repeat is quieter and duller
    return ac;
  }
  function ready(){if(!on||!init())return false;if(ac.state==="suspended")ac.resume();return true}
  function tone(o){ // {f,f2,type,dur,vol,t,echo}
    if(!ready())return;
    const f=o.f||800,dur=o.dur||.08,vol=o.vol==null?.25:o.vol,t0=ac.currentTime+(o.t||0);
    const osc=ac.createOscillator(),g=ac.createGain();osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(f,t0);if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.004);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g);g.connect(master);if(o.echo)g.connect(echo);osc.start(t0);osc.stop(t0+dur+.05);
  }
  let nbuf=null;
  function noise(o){ // {dur,vol,t,f,f2,q,type,echo}
    if(!ready())return;
    if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const dur=o.dur||.2,vol=o.vol==null?.3:o.vol,t0=ac.currentTime+(o.t||0);
    const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;
    const fl=ac.createBiquadFilter();fl.type=o.type||"bandpass";fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.f||1000,t0);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(fl);fl.connect(g);g.connect(master);if(o.echo)g.connect(echo);s.start(t0);s.stop(t0+dur+.05);
  }
  // recorded sounds (Tom's own voice, folder snd/): decoded once, then played with a slightly random speed so they never sound exactly the same
  const SAMPLES={slash:["slash1","slash2"],stomp:["stomp2"],stomp0:["stomp0"],flip:["flip3"],lunge:["lunge1"],block:["block1"],sbreak:["shieldbreak1"],banish:["banish1"],shovel:["shovel1","shovel2","shovel3"],zap:["zap1"],thunder:["thunder1"]},buf={};let loading=false;
  function loadSamples(){
    if(loading||!init())return;loading=true;
    for(const k in SAMPLES)for(const n of SAMPLES[k])fetch("snd/"+n+".m4a").then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>ac.decodeAudioData(b,ok,no))).then(d=>{(buf[k]=buf[k]||[]).push(d)}).catch(()=>{});
  }
  function sample(k,o){ // true if a recording was played, false = use the synthesised fallback
    if(!ready())return true;loadSamples();
    const L=buf[k];if(!L||!L.length)return false;o=o||{};
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=L[Math.floor(Math.random()*L.length)];
    s.playbackRate.value=(o.rate||1)*(o.exact?1:.96+Math.random()*.08);g.gain.value=o.vol==null?.9:o.vol;
    s.connect(g);g.connect(master);if(o.echo){const e=ac.createGain();e.gain.value=o.echo===true?1:o.echo;g.connect(e);e.connect(echo)} // o.echo = how much echo (1 = full)

async function cards(){

  if(!r.ok)throw new Error("cards.json "+r.status);
  CARDS=(await r.json()).map(c=>({id:c[0],name:c[1],type:c[2],desc:c[3],atk:c[4],def:c[5],lvl:c[6],attr:c[7],race:c[8],lm:c[9]|0,sc:c[10],lc:c[1].toLowerCase()}));

async function find(q,row){

  const st=[],inn=[];
  for(const c of all){if(row==='mon'&&!/Monster/.test(c.type))continue;if(row==='st'&&(!/Spell|Trap/.test(c.type)||/Field/.test(c.type)))continue;if(row==='stp'&&!(/Spell|Trap/.test(c.type)&&!/Field/.test(c.type))&&!/Pendulum/.test(c.type))continue;if(row==='field'&&c.type!=='Field Spell')continue;const i=c.lc.indexOf(q);if(i===0)st.push(c);else if(i>0)inn.push(c);if(st.length+inn.length>=60)break}

function setPos(p,i,np){
  const m=S.mon[p][i],old=m.pos,w=[];
  if(old===np)return;
  if(m.noPosT===S.tc)w.push("After Creature Swap these monsters can't change their battle position for the rest of this turn.");
  const turnMain=()=>{if(p!==S.turn)w.push("This is only allowed on your own turn.");if(!inMain())w.push(`Only allowed in a Main Phase (now: ${phName()}).`)};
  if(old==="FD"&&np==="ATK"){
    turnMain();
    if(m.sumT===S.tc)w.push("A monster can't be flipped face-up (Flip Summon) on the turn it was Set (also when it was Set by an effect).");
  }else if(np==="FD"){w.push("A face-up monster is only turned face-down by a card effect.")}
  else if(old==="FD"&&np==="DEF"){w.push("A face-down monster is flipped face-up in Attack Position (Flip Summon). Defense only by an effect.")}
  else{
    turnMain();
    if(m.sumT===S.tc)w.push("A monster can't change its battle position on the turn it was Summoned or Set (Special Summons included), unless a card effect allows it.");
    if(m.flipT===S.tc)w.push("A Flip Summoned monster can't change position the turn it was flipped.");
    if(m.posT===S.tc)w.push("This monster already changed position this turn.");
    if(m.attT===S.tc)w.push("This monster attacked this turn, so it can't change position.");
  }
  guard(w,()=>{const fl=old==="FD"&&np==="ATK";if(fl)m.flipT=S.tc;else m.posT=S.tc;m.pos=np;render();dlg.close();if(fl)sumAsk(p,i,"flip")},()=>slotDialog(p,i));
}

// innate extra attacks in the monster's own text ("This card can make a second attack", "can attack all monsters your opponent controls, once each"); conditional versions ("once per turn: ...", "if ...") are not counted
function selfAtks(m){
  let n=1,all=false;
  for(const x of (m&&m.desc||"").split(/(?<=[.●])\s+|\n/)){
    const t=x.trim(),q=t.match(/^(?:This card|It) can (?:make (?:a second attack|up to (\d|two|three) attacks?)|attack twice|attack all monsters)/i);
    if(!q)continue;
    if(/attack all monsters/i.test(t))all=true;
    else{const w=(q[1]||"2").toLowerCase();n=Math.max(n,{two:2,three:3}[w]||+w||2)}
  }
  return{n,all};
}
function atkInfo(p,i){
  const m=S.mon[p]&&S.mon[p][i];if(!m||m.pos==="FD")return{n:1,all:false};
  const r=selfAtks(m);
  for(const q of[0,1])S.st[q].forEach(e=>{if(e&&e.eq&&!e.hold&&e.pos==="UP"&&e.tgt&&e.tgt.p===p&&e.tgt.i===i){if(e.eq.atks)r.n=Math.max(r.n,e.eq.atks);if(e.eq.atkAll)r.all=true}});
  return r;
}
const maxAtk=(p,i)=>atkInfo(p,i).n;
const markAtt=(m,key)=>{if(m.attT===S.tc)m.attN=(m.attN||1)+1;else{m.attT=S.tc;m.attN=1;m.attKs=[]}if(key){m.attKs=m.attKs||[];m.attKs.push(key)}};
function attackWarnings(p,i){
  const m=S.mon[p][i],w=[];
  if(p!==S.turn)w.push("Only the turn player can attack.");
  if(PHASES[S.ph].n!=="Battle Phase")w.push(`Attacks are made in the Battle Phase (now: ${phName()}).`);
  const ai=atkInfo(p,i);
  if(m.attT===S.tc&&!ai.all&&(m.attN||1)>=ai.n)w.push(ai.n>1?`This monster already made its ${ai.n} attacks this turn.`:"This monster already attacked this turn.");
  return w;

function chainApply(e,log){
  if(e.t==="neg"){CH.negated=true;log.push("The attack is negated.");return}
  if(e.t==="note"){log.push(`Note: ${e.text} (do it by hand)`);return}

  if(e.t==="lp"){setLP(e.who,S.lp[e.who]+e.n,x=>`${NAME(e.who)}: ${e.n>=0?"+":""}${e.n} (effect) → ${x}`);log.push(e.text);return}
  const m=S.mon[e.p][e.i];
  if(!m||(m.name!==e.nm&&!m.ph)){log.push(`${e.nm} is no longer on the field — its effect is skipped.`);return}
  if(e.t==="stat"){
    if(e.u){const t=m.tm&&m.tm.t===S.tc?m.tm:{a:0,d:0,t:S.tc};t.a+=e.a;t.d+=e.d;m.tm=t}else{m.da+=e.a;m.dd+=e.d}
    log.push(e.text);return;
  }
  if(e.t==="kill"){removeMon(e.p,e.i,e.ban?"ban":"gy");log.push(e.text)}
}
function chainResolve(){

  const tell=()=>{if(online())netCtl({t:"clog",log:[]})}; // the other phone stops waiting
  if(ctx.act&&st.length===1){CH=null;FLIP=null;tell();ctx.fin();return} // nobody responded
  if(ctx.sum&&st.length===1){CH=null;FLIP=null;tell();if(dlg.open)dlg.close();return}
  UNDOMERGE=true;const n0=onField();
  const toGY=(r,z,i,c)=>chainToPile(r,z,i,c,"gy");
  for(let n=st.length-1;n>=0;n--){ // the last activated resolves first
    const R=st[n];
    if(negL.has(n)){
      log.push(R.base&&ctx.sum?`The Summon of ${R.srcName} is negated — it goes to the Graveyard.`:`${R.who}: ${R.srcName||"a card"} is negated — no effect.`);
      if(R.base&&ctx.sum){const a=ctx.sum,m=S.mon[a.p][a.i];if(m&&m.sid===a.sid)removeMon(a.p,a.i,"gy")}
      else if(R.base){baseNeg=true;const a=ctx.act,c=getZ(a.p,a.i,a.z);if(c&&c.uid===a.uid)toGY(a.p,a.z,a.i,c)}
      else if(R.src&&R.src.z==="st"){const c=S.st[R.r][R.src.i];if(c)toGY(R.r,"st",R.src.i,c)}
      continue;
    }
    if(R.base&&ctx.sum){const m=S.mon[ctx.sum.p][ctx.sum.i];if(m&&m.sid===ctx.sum.sid)log.push(`The Summon of ${R.srcName} succeeds.`);continue}
    log.push(`${R.who}: ${R.srcName||"a card"}`);
    for(const e of R.effects){if(e.t==="negc"){if(n>0){negL.add(n-1);log.push(e.text)}continue}chainApply(e,log)}
    if(R.src&&R.src.z==="st"){ // the card is used: it turns face-up, a one-shot card goes to the Graveyard
      const c=S.st[R.r][R.src.i];
      if(c){c.pos="UP";if(NOBP_RX.test(c.desc||""))S.nobp=S.tc;if(/^(Normal|Quick-Play|Ritual) Spell|^(Normal|Counter) Trap/.test(c.type||"")){const se=stEl(R.r,R.src.i);if(se)flyToPile(se.getBoundingClientRect(),c,R.r,"gy");S.st[R.r][R.src.i]=null;sendTo(R.r,"gy",c,true)}}
    }
  }
  UNDOMERGE=false;render();
  const neg=CH.negated;CH=null;
  if(onField()<n0&&!calmMotion()){if(dlg.open)dlg.close();setTimeout(()=>chainShow(ctx,log,neg,baseNeg),1900);return} // cards left the field: first let the gravestone / portal / flying cards play, then the summary
  chainShow(ctx,log,neg,baseNeg);

function parseTrapMon(desc){

  if(!m)return null;
  const parts=m[2].split("/").map(x=>x.trim()),o={mtype:m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+" Monster",tuner:false};

    else if((q=x.match(/^ATK (\?|\d+)$/i)))o.atk=q[1]==="?"?-1:+q[1];
    else if((q=x.match(/^DEF (\?|\d+)$/i)))o.def=q[1]==="?"?-1:+q[1];
    else if(/^(DARK|LIGHT|EARTH|WATER|FIRE|WIND|DIVINE)$/i.test(x))o.attr=x.toUpperCase();

// Standby Phase effects on Life Points (Snatch Steal, Cure Mermaid, Lava Golem, ...): who is affected, whose Standby Phase it is
// returns [{owner,who,d,txt}] for a face-up card controlled by c; owner = the player whose Standby Phase triggers it, who = the player whose LP change
function standbyEffects(desc,c,eqTarget){
  const out=[],o=1-c,num=x=>+String(x).replace(/,/g,"");
  for(const sent of (desc||"").split(/(?<=[.;])\s+|\n/)){
    if(!/Standby Phase/i.test(sent)||/for (?:each|every)|randomly|Detach|next Standby/i.test(sent))continue;
    let owner;
    if(/controller of this card|controller of the|This card's controller|A player controlling|^The controller|controller must/i.test(sent))owner=c;
    else if(/your opponent'?s (?:each )?Standby|opponent's Standby|of their Standby|your opponent gains/i.test(sent))owner=o;
    else if(/each player's Standby|the Standby Phase|each Standby Phase|turn player/i.test(sent))owner="turn";
    else if(/his\/her Standby/i.test(sent))owner=/controller of this card|controller of the spell|player controlling|controller must|^The controller|^A player/i.test(sent)?c:/opponent/i.test(sent)?o:c;
    else owner=c;
    let m,who=null,d=0,kind="";
    if(m=sent.match(/Place (\d+|one) (.+?) Counters? on this card/i)){out.push({owner,who:null,kind:"counter",n:/^\d+$/.test(m[1])?+m[1]:1,cname:m[2],txt:sent.trim()});continue}
    if(m=sent.match(/\b(?:This card|It) gains? (\d[\d,]*) ATK(?:\/| and )DEF/i)){out.push({owner,who:null,kind:"stat",a:num(m[1]),txt:sent.trim()});continue}
    if(m=sent.match(/increase your (?:Life Points|LP) by (\d[\d,]*)/i)){who=c;d=num(m[1]);kind="gain"}
    else if(m=sent.match(/(?:They|Your opponent) gains? (\d[\d,]*) (?:Life Points|LP)/i)){who=owner==="turn"?"turn":owner===c?o:owner;if(/Your opponent gains/i.test(sent))who=o;d=num(m[1]);kind="gain"}
    else if(m=sent.match(/\b(?:you )?gain (\d[\d,]*) (?:Life Points|LP)/i)){who=c;d=num(m[1]);kind="gain"}
    else if(m=sent.match(/inflict (\d[\d,]*) (?:points of )?damage to (the controller of the equipped monster|your opponent)/i)){who=/controller/i.test(m[2])?(eqTarget!=null?eqTarget:o):o;d=-num(m[1]);kind="dmg"}
    else if(m=sent.match(/(?:The turn player|player controlling this monster|The controller of this card|controller must) (?:takes?|loses?|pays?|must pay)(?: |)(\d[\d,]*)/i)){who=/turn player/i.test(sent)?"turn":c;d=-num(m[1]);kind="dmg"}
    else if(m=sent.match(/\b(?:you |)(?:must |)take (\d[\d,]*) (?:points of )?damage|Take (\d[\d,]*) damage/i)){who=c;d=-num(m[1]||m[2]);kind="dmg"}
    else if(m=sent.match(/\b(?:you must |you can |)pay (\d[\d,]*) (?:Life Points|LP)/i)){who=c;d=-num(m[1]);kind="pay"}
    if(who===null||!d)continue;
    out.push({owner,who,d,kind,destroy:/or destroy/i.test(sent),txt:sent.trim()});
  }
  return out;
}

function standbyNow(){

// a Deck (Main + Extra + Side) holds at most 3 copies of a card: count the copies of player p (owner) that the app can see
function copyCount(p,name){
  let n=0;const hit=x=>x&&x.name===name;
  for(const q of[0,1]){
    S.mon[q].forEach(m=>{if(!m)return;if(hit(m)&&(m.own??q)===p)n++;if((m.own??q)===p)(m.ou||[]).forEach(u=>{if(hit(u))n++})});
    S.st[q].forEach(c=>{if(hit(c)&&(c.own??q)===p)n++});
    if(hit(S.field[q])&&(S.field[q].own??q)===p)n++;
  }
  for(const L of[S.gy[p],S.ban[p],S.edup[p]])(L||[]).forEach(c=>{if(hit(c))n++});
  return n;
}

async function copyGuard(p,c,go,back){ // 3 copies is a hard limit (no 'Do it anyway')

  if(n<lim)return go();
  open(`${closeX()}<h2>⛔ Not allowed</h2><p style="font-size:15px">${lim?`${NAME(p)} already ${p===0?"have":"has"} ${n} cop${n>1?"ies":"y"} of “${esc(c.name)}” on the field, in the Graveyard or banished.`:""}</p><p style="font-size:15px">${esc(why)}</p>

$("rules").onclick=()=>{

  if(!w&&S.tc===1&&ph.n==="Draw Phase")cant.unshift("FIRST TURN: the first player does NOT draw a card (the Draw Phase itself still takes place).");
  if(!w&&S.tc===1&&/^Main Phase/.test(ph.n))cant.unshift("FIRST TURN: the first player has no Battle Phase. From here the turn goes straight to the End Phase (Main Phase 2 only follows a Battle Phase).");
  const canSkip=!w&&S.tc>1&&S.ph===2&&PHASES[3]&&PHASES[3].n==="Battle Phase";
  let sbx="";
  if(!w&&ph.n==="Draw Phase"&&!S.phManual){const L=standbyCards();
    sbx=L.length?`<p><small>The duel stops at the Standby Phase for: ${esc(L.slice(0,6).join(", "))}${L.length>6?" …":""}</small></p>`
      :S.sbStop===S.tc?`<p><small>✓ The duel will stop at the Standby Phase this turn.</small></p>`
      :`<p><small>No card mentions the Standby Phase, so it is skipped automatically.</small></p><div class="row"><button id="sbstop">Stop at the Standby Phase (for a Trap or Quick-Play Spell)</button></div>`}
  open(`${closeX()}<h2>${w?"Opponent's turn":ph.n+(ph.sub?" – "+ph.sub[S.sub]:"")}</h2><div class="phtxt">
   ${!w&&ph.sub?`<small>Steps: ${ph.sub.join(" → ")}</small>`:""}
   <h3 class="may">✅ You MAY / CAN</h3><ul>${r.may.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <h3 class="cant">⛔ You may NOT</h3><ul>${cant.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   </div>${sbx}${canSkip?`<div class="row"><button id="skipbp">Skip the Battle Phase → End Phase</button></div><small>You do not have to battle. Without a Battle Phase there is no Main Phase 2 either.</small>`:""}<div class="row"><button onclick="dlg.close()">Close</button></div>`,()=>{
    if($("sbstop"))$("sbstop").onclick=()=>{S.sbStop=S.tc;render();dlg.close()};
    if($("skipbp"))$("skipbp").onclick=()=>{S.ph=PHASES.length-1;S.sub=0;render();dlg.close()};
  });

// ---------- Duel intro: (Speed Duel: Skills) -> coin toss -> "IT'S TIME TO… DUEL!" ----------
let rnd=n=>Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n);
const calmMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function introLayout(h0,h1,mid){ // h0 = bottom half (you), h1 = top half (opponent, upside down in 2 players)
  const two=S.view!=="1p",el=$("intro");
  el.className="";el.hidden=false;
  el.innerHTML=(two?`<div class="ihalf rot">${h1||""}</div>`:"")+`<div class="ihalf">${h0||""}</div>`+(mid?`<div class="imid">${mid}</div>`:"");
}
function startDuel(lp,n,view){
  const sp0=S.startPlayer||0;

  S=fresh(lp,n);S.view=view;S.startPlayer=sp0;S.turn=sp0;render();
  $("splash").hidden=true;if(dlg.open)dlg.close();

}
function introSkills(){
  const two=S.view!=="1p";
  const lbl=p=>S.skill[p]?`⚡ ${esc(S.skill[p].ch||"Skill")} ✓ <small style="display:block;font-size:12px;opacity:.8">tap to change</small>`:"⚡ Choose a Skill (optional)";
  const draw=()=>{
    introLayout(`<div class="ibox"><div class="ihead">${two?"YOU":"YOUR SKILL"}</div><button id="isk0">${lbl(0)}</button><div class="isub">Skills are set face-down before the coin toss.</div></div>`,
      two?`<div class="ibox"><div class="ihead">OPPONENT</div><button id="isk1">${lbl(1)}</button><div class="isub">Skills are set face-down before the coin toss.</div></div>`:"",
      online()&&NET.rdy.me?`<button class="igo" id="itoss" disabled>✓ Ready — waiting for your opponent…</button>`:`<button class="igo" id="itoss">${online()?"Ready ✓":"Toss the coin 🪙"}</button>`);

    $("itoss").onclick=()=>{dlg.onclose=null;if(!online()){introCoin();return}$("itoss").disabled=true;$("itoss").textContent="✓ Ready — waiting for your opponent…";netReady()};

function introCoin(h){
  const two=S.view!=="1p";
  const heads=h!==undefined?h:rnd(2)===0,winner=heads?0:1; // online: the toss is made on the phone of seat 0 and sent
  const forced=S.n===3&&!!S.skill[winner]; // Speed Duel: whoever presented a Skill before the toss and wins it must go first
  const legend=two?"▼ Heads = bottom player · ▲ Tails = top player":"Heads = You · Tails = Opponent";
  introLayout("","",`<div class="coinwrap"><div class="coin" id="coin"><div class="face">H</div><div class="face b">T</div></div></div><div class="cres" id="cres">&nbsp;</div><div class="clegend">${legend}</div>`);
  const coin=$("coin");
  const spins=calmMotion()?0:5;
  SFX.coin(spins?spins*2+(heads?0:1):0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{coin.style.transform=`rotateX(${spins*360+(heads?0:180)}deg)`}));
  setTimeout(()=>{
    $("cres").textContent=heads?"HEADS":"TAILS";
    if(!calmMotion())coinLand();
    setTimeout(()=>introChoice(winner,forced,two,legend,heads),calmMotion()?700:1100);
  },calmMotion()?200:2000);
}
// ---------- Intro effects (Toms wish: the start as spectacular as the end) ----------
// DUEL! A = shockwave + embers, B = green portal + lightning; board A = both halves slide in and lock in the middle, B = the zones are dealt in like cards.
// Picked at random every duel; ?duel=A|B and ?board=A|B in the address fix one.
const introPick=k=>(new RegExp("[?&]"+k+"=([AB])").exec(location.search)||[])[1]||"AB"[rnd(2)];
function coinLand(){
  const c=$("coin"),r=c&&c.getBoundingClientRect(),el=$("intro");if(!r)return;
  try{SFX.stomp(1)}catch(e){}
  el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");
  for(let k=0;k<3;k++){const d=document.createElement("img");d.src="img/fx/dust.webp";d.className="endfx";const z=150+k*30;d.style.cssText=`left:${r.left+r.width/2-z/2+(k-1)*50}px;top:${r.bottom-z*.55}px;width:${z}px;height:${z}px;z-index:1`;el.appendChild(d);
    d.animate([{transform:"scale(.3)",opacity:0},{transform:"scale(1)",opacity:.9,offset:.3},{transform:`translate(${(k-1)*40}px,-20px) scale(1.4)`,opacity:0}],{duration:1100,easing:"ease-out",fill:"forwards"}).onfinish=()=>d.remove()}
  const b=$("cres");if(b){b.classList.add("cban");endEmbers(b,el)}
}
function introBoom(t,v){ // in every half (.itt), at the moment DUEL! hits
  const w=document.createElement("div");w.className="ishock";t.appendChild(w);
  w.animate([{transform:"scale(.2)",opacity:1},{transform:"scale(7)",opacity:0}],{duration:900,easing:"cubic-bezier(.1,.7,.3,1)",fill:"forwards"}).onfinish=()=>w.remove();
  if(v==="A"){const w2=w.cloneNode();t.appendChild(w2);w2.animate([{transform:"scale(.2)",opacity:.8},{transform:"scale(5)",opacity:0}],{duration:900,delay:140,easing:"cubic-bezier(.1,.7,.3,1)",fill:"both"}).onfinish=()=>w2.remove()}
  for(let k=0;k<(v==="A"?40:24);k++){ // sparks fly out of DUEL!
    const e=document.createElement("div");e.className="iember";const z=3+Math.random()*6,col=v==="A"?["#ffd27a","#ff8a1f","#fff3c0","#8be32a"][k%4]:["#b6ff5a","#eaffd0","#8be32a"][k%3];
    e.style.cssText=`width:${z}px;height:${z}px;margin:${-z/2}px;background:${col};color:${col}`;t.appendChild(e);
    const an=Math.random()*Math.PI*2,d=120+Math.random()*220;
    e.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(an)*d}px,${Math.sin(an)*d}px) scale(.3)`,opacity:0}],{duration:800+Math.random()*700,easing:"cubic-bezier(.1,.8,.3,1)",fill:"forwards"}).onfinish=()=>e.remove();
  }
}
function introBolt(el){ // DUEL! A: Tom's lightning (img/fx/bolt.webp) strikes from the top of the screen, flickering with the flash
  const bl=document.createElement("img");bl.src="img/fx/bolt.webp";bl.alt="";bl.className="ibig";
  const fl=Math.random()<.5?-1:1;bl.style.transform=`translateX(-50%) scaleX(${fl})`;el.appendChild(bl); // centred, sometimes mirrored
  bl.animate([{clipPath:"inset(0 0 100% 0)",opacity:1},{clipPath:"inset(0 0 0 0)",opacity:1,offset:.09},{opacity:1,offset:.3},{opacity:.25,offset:.42},{opacity:1,offset:.52},{opacity:.9,offset:.75},{clipPath:"inset(0 0 0 0)",opacity:0}],{duration:1150,fill:"forwards"}).onfinish=()=>bl.remove();
}
function introPortal(t){ // DUEL! B: a green portal opens behind the letters, lightning flickers around it
  const pt=document.createElement("img");pt.src="img/fx/banish.webp";pt.className="iportal";t.prepend(pt);
  pt.animate([{transform:"translate(-50%,-50%) scale(0) rotate(0)",opacity:0},{transform:"translate(-50%,-50%) scale(1) rotate(240deg)",opacity:1,offset:.3},{transform:"translate(-50%,-50%) scale(1.08) rotate(720deg)",opacity:1}],{duration:2600,easing:"ease-out",fill:"forwards"});
  const W=t.clientWidth,H=t.clientHeight,cx=W/2,cy=H/2;let paths="";
  for(let k=0;k<6;k++){const an=k/6*Math.PI*2+Math.random()*.5;let x=cx+Math.cos(an)*60,y=cy+Math.sin(an)*60,d=`M${x.toFixed(0)} ${y.toFixed(0)}`;
    for(let st=0;st<6;st++){x+=Math.cos(an)*W*.08+(Math.random()-.5)*30;y+=Math.sin(an)*W*.08+(Math.random()-.5)*30;d+=` L${x.toFixed(0)} ${y.toFixed(0)}`}paths+=`<path d="${d}"/>`}
  const bl=document.createElement("div");bl.className="ibolt";bl.innerHTML=`<svg width="${W}" height="${H}">${paths}</svg>`;t.appendChild(bl);
  bl.animate([{opacity:0},{opacity:1,offset:.05},{opacity:.1,offset:.15},{opacity:1,offset:.25},{opacity:0,offset:.4},{opacity:.9,offset:.55},{opacity:0,offset:.7},{opacity:0}],{duration:1500,fill:"forwards"}).onfinish=()=>bl.remove();
}
// after the intro: the board comes in
function boardIntro(v){
  if(calmMotion())return;
  const a=$("s0"),b=$("s1"),m=document.querySelector(".mid");
  if(v==="A"){ // both halves slide in from the edges and lock in the middle with a spark
    a.animate([{translate:"0 75vh"},{translate:"0 0"}],{duration:560,easing:"cubic-bezier(.3,1.2,.5,1)"});
    b.animate([{translate:"0 -75vh"},{translate:"0 0"}],{duration:560,easing:"cubic-bezier(.3,1.2,.5,1)"});
    m.animate([{opacity:0,scale:".5"},{opacity:0,scale:".5",offset:.55},{opacity:1,scale:"1.08",offset:.85},{opacity:1,scale:"1"}],{duration:700});
    setTimeout(()=>{try{SFX.clang()}catch(e){}const r=m.getBoundingClientRect(),sp=document.createElement("div");sp.className="endfx ispark";sp.style.cssText=`left:0;right:0;top:${r.top+r.height/2-40}px;height:80px;z-index:60`;document.body.appendChild(sp);
      sp.animate([{opacity:1,transform:"scaleX(.1)"},{opacity:1,transform:"scaleX(1)",offset:.3},{opacity:0,transform:"scaleX(1.2) scaleY(.2)"}],{duration:500,fill:"forwards"}).onfinish=()=>sp.remove();
      document.body.animate([{translate:"0 0"},{translate:"0 5px"},{translate:"0 -4px"},{translate:"0 0"}],{duration:260})},330);
  }else{ // the zones are dealt in like cards, in a wave from the middle out
    const cy=innerHeight/2;let n=0;
    document.querySelectorAll("#s0 .slot,#s1 .slot,#s0 .zb,#s1 .zb,#s0 .fchip,#s1 .fchip").forEach(z=>{
      const r=z.getBoundingClientRect(),dl=Math.abs(r.top+r.height/2-cy)/cy*650+Math.random()*60;
      z.animate([{opacity:0,transform:"perspective(500px) rotateY(100deg) translateY(-14px) scale(.8)"},{opacity:1,transform:"none"}],{duration:380,delay:dl,easing:"cubic-bezier(.3,1.3,.5,1)",fill:"backwards"});
    });
    [0,200,400,600].forEach(t=>setTimeout(()=>{try{SFX.flip()}catch(e){}},t+60));
  }
  document.querySelectorAll(".lp").forEach(l=>{l.classList.add("lpglow");setTimeout(()=>l.classList.remove("lpglow"),1900)});
}
function introChoice(winner,forced,two,legend,heads){
  const you=winner===0;
  const mine=(who)=>`<div class="ibox"><div class="ihead">🏆 ${two?"YOU WIN THE TOSS":(you?"YOU WIN THE TOSS":"OPPONENT WINS THE TOSS")}</div>${forced
      ?`<div class="isub">${two||you?"You":"The opponent"} presented a Skill, so ${two||you?"you":"they"} must go first.</div><button id="ifirst">OK, ${two||you?"I go":"they go"} first</button>`
      :`<div class="isub">${two||you?"You get to choose:":"Tap the opponent's choice:"}</div><button id="ifirst">${two||you?"I go first":"Opponent goes first"}</button><button id="isecond">${two||you?"My opponent goes first":"I go first"}</button>`}</div>`;
  const wait=`<div class="ibox"><div class="ihead">OPPONENT WON THE TOSS</div><div class="isub">They are choosing…</div></div>`;
  const mid=`<div class="cres cban" style="animation:none">${heads?"HEADS":"TAILS"}</div><div class="clegend">${legend}</div>`;
  if(two)introLayout(you?mine():wait,you?wait:mine(),mid);
  else introLayout(online()&&!you?wait:mine(),"",mid);
  const pick=first=>{ // first = true -> the toss winner goes first (in 1p without 'you', the buttons are labelled the other way round)
    const winnerFirst=forced?true:first; // 'ifirst' always means: the toss winner goes first
    const st=winnerFirst?winner:1-winner;
    if(online())netRaw({t:"first",starter:NET.seat?1-st:st});
    introFlash(st);
  };
  const f=document.querySelectorAll("#ifirst"),sc=document.querySelectorAll("#isecond");
  f.forEach(b=>b.onclick=()=>pick(true));sc.forEach(b=>b.onclick=()=>pick(false));
}
function introFlash(starter){
  const two=S.view!=="1p",el=$("intro"),calm=calmMotion();
  const word="IT'S TIME TO…";
  const letters=[...word].map((ch,i)=>ch===" "?`<span class="ltr sp" style="animation-delay:${i*40}ms">&nbsp;</span>`:`<span class="ltr" style="animation-delay:${i*40}ms;--dx:${rnd(1100)-550}px;--dy:${rnd(900)-450}px;--r:${rnd(720)-360}deg">${ch}</span>`).join("");
  const half=`<div class="itt"><div class="ittl" data-t>${letters}</div><div class="duel" data-d hidden>DUEL!</div></div>`;
  introLayout(half,two?half:"","");
  el.insertAdjacentHTML("beforeend",`<div class="iflash" id="iflash"></div>`);
  const DV=introPick("duel"),BV=introPick("board");new Image().src=DV==="A"?"img/fx/bolt.webp":"img/fx/banish.webp"; // load the picture before it is needed
  const finish=()=>{
    LPHOLD=false;S.startPlayer=starter;S.turn=starter;S.tc=1;S.ph=0;S.sub=0;S.t0=Date.now();render();
    el.hidden=true;el.className="";el.innerHTML="";
    boardIntro(BV);
  };
  if(calm){el.classList.add("out");setTimeout(finish,450);return}
  const t1=word.length*40+500;                       // letters have popped in
  // B: the lightning sound starts a little earlier, so its crack falls when the portal and the bolts appear
  if(DV==="B"){setTimeout(()=>{try{SFX.zap()}catch(e){}},Math.max(0,t1-380));setTimeout(()=>el.querySelectorAll(".itt").forEach(introPortal),t1+80)}
  // A: a thunderclap: the screen goes dark, then a double lightning flash with one big bolt (crack of the sound on DUEL!)
  let dim=null;if(DV==="A")setTimeout(()=>{dim=document.createElement("div");dim.className="idark";el.appendChild(dim);dim.animate([{opacity:0},{opacity:.72}],{duration:200,fill:"forwards"});try{SFX.thunder()}catch(e){}},t1+120); // a dark layer UNDER the bolt (dimming #intro itself would dim the bolt too)
  setTimeout(()=>{
    if(DV==="A"){introBolt(el); // first the bolt on the dark screen, a moment later the flash (a white flash at the same time would hide the white bolt)
      setTimeout(()=>{if(dim){const d=dim;d.animate([{opacity:.72},{opacity:0}],{duration:500,fill:"forwards"}).onfinish=()=>d.remove()}$("iflash").animate([{opacity:0},{opacity:.75,offset:.12},{opacity:.05,offset:.3},{opacity:.6,offset:.42},{opacity:0}],{duration:800})},170)}
    else{el.querySelectorAll(".itt").forEach(t=>introBoom(t,DV));$("iflash").classList.add("go");SFX.duel()}
    el.querySelectorAll(".ittl").forEach(e=>e.classList.add("push"));
    el.querySelectorAll("[data-d]").forEach(e=>e.hidden=false);
    el.classList.add("shake");
  },t1+350);
  setTimeout(()=>el.classList.add("out"),t1+350+1500);
  setTimeout(finish,t1+350+1500+520);
}

// ---------- Online: 1 player per phone (Online-plan.md) ----------
// What goes over the net is NEUTRAL: seat 0 (made the room) = index 0, seat 1 (joined) = index 1. The phone of seat 1 mirrors it,
// so on every phone all existing code keeps working with 'me = 0'. The state is sent in 3 parts (side 0, side 1, general), each with
// its own version number: the highest version wins; on a tie the owner of the part wins (general part: seat 0).
// Hidden information: my face-down cards and my unused Skill are replaced by a placeholder in what is SENT; the real card stays on my phone.
const RELAY=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&!/[?&]live\b/.test(location.search)?`ws://${location.hostname}:8787`:"wss://duelist-relay.duelist-relay.workers.dev"; // on the pc: the test relay (npm run dev), ?live = the real one
var NET=null; // {code,seat,cid,live,ver,last,hide,ws,peer,rdy}
const NETKEY="ygoref-net",SIDEK=["mon","st","field","gy","ban","skill","edup","pt","lp","sign","prev"],PARTS=["0","1","g","l"]; // l = the log
const KEEPFD=["pos","own","ctl","cnt","sumT","setT","how","tgt","attT","attN","attKs","noPosT","uid","sid","hk","da","dd","tm"]; // also ATK/DEF changes, so an effect of the opponent on my face-down monster is kept // what the opponent may know of a face-down card
const online=()=>!!(NET&&NET.live&&S.view==="1p");
function netSave(){try{if(NET)localStorage.setItem(NETKEY,JSON.stringify({code:NET.code,seat:NET.seat,cid:NET.cid,live:NET.live,ver:NET.ver,hide:NET.hide}));else localStorage.removeItem(NETKEY)}catch(e){}}
function netLoad(){try{return JSON.parse(localStorage.getItem(NETKEY))}catch(e){return null}}
const netNew=(code,seat)=>({code,seat,cid:(netLoad()||{}).cid||newUid(),live:false,ver:{0:0,1:0,g:0,l:0},last:{},hide:{},peer:false,rdy:{me:false,opp:false}});
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
// ---- mirror: players 0 and 1 swapped (also the 2 shared Extra Monster Zones: the left one for me is the right one for my opponent)
function swapLog(t){return String(t).replace(/\bOpponent's\b/g,"\u0001").replace(/\bOpponent\b/g,"\u0002").replace(/\bYour\b/g,"Opponent's").replace(/\bYou\b/g,"Opponent").replace(/\u0001/g,"Your").replace(/\u0002/g,"You")}
function mirror(s){
  const m=clone(s),md=s.n===5,zi=i=>md&&i===EMZ0?EMZ1:md&&i===EMZ1?EMZ0:i;
  const card=c=>{if(!c||typeof c!=="object")return;if(c.own!==undefined)c.own=1-c.own;if(c.tgt&&c.tgt.p!=null){c.tgt.p=1-c.tgt.p;c.tgt.i=zi(c.tgt.i)}
    if(c.attKs)c.attKs=c.attKs.map(k=>{const a=/^(\d):(\d+)$/.exec(k);return a?(1-a[1])+":"+zi(+a[2]):k})};
  for(const k of SIDEK)if(Array.isArray(m[k]))m[k].reverse();
  for(const p of[0,1]){if(md&&m.mon[p]){const a=m.mon[p][EMZ0];m.mon[p][EMZ0]=m.mon[p][EMZ1];m.mon[p][EMZ1]=a}
    (m.mon[p]||[]).forEach(card);(m.st[p]||[]).forEach(card);card(m.field&&m.field[p])}
  if(m.turn!=null)m.turn=1-m.turn;if(m.startPlayer!=null)m.startPlayer=1-m.startPlayer;
  if(m.paused){m.paused.p=1-m.paused.p;m.paused.i=zi(m.paused.i);if(m.paused.k>=0)m.paused.k=zi(m.paused.k)}
  if(m.log)m.log=m.log.map(swapLog);
  return m;
}
// ---- the neutral state as it is SENT: my face-down cards and unused Skill hidden
function netOut(){
  const real=[],names=new Set(),up=new Set();
  const mine=[...S.mon[0],...S.st[0],S.field[0]];
  mine.forEach(c=>{if(c&&c.pos==="FD"){if(!c.hk)c.hk=newUid();NET.hide[c.hk]=clone(c);names.add(c.name)}});
  for(const p of[0,1])[...S.mon[p],...S.st[p],S.field[p]].forEach(c=>{if(c&&c.pos!=="FD")up.add(c.name)});
  const s=clone(S);delete s.view;
  const ph=c=>{if(!c||c.pos!=="FD")return c;const o={name:"Set card",id:-1,atk:0,def:0,da:0,dd:0,type:"",desc:"",ph:1};KEEPFD.forEach(k=>{if(c[k]!==undefined)o[k]=c[k]});return o};
  s.mon[0]=s.mon[0].map(ph);s.st[0]=s.st[0].map(ph);s.field[0]=ph(s.field[0]);
  const k=s.skill&&s.skill[0];if(k&&!k.uses){if(!S.skill[0].hk)S.skill[0].hk=newUid();NET.hide[S.skill[0].hk]=clone(S.skill[0]);s.skill[0]={id:0,name:"Skill",ch:k.ch,desc:"",uses:0,ph:1,hk:S.skill[0].hk}}
  const secret=[...names].filter(n=>!up.has(n)); // a name in the log could give a Set card away
  if(secret.length)s.log=(s.log||[]).map(t=>secret.reduce((a,n)=>a.split(n).join("a Set card"),String(t)));
  return NET.seat?mirror(s):s;
}
function netParts(N){
  const side=p=>{const o={};SIDEK.forEach(k=>{o[k]=Array.isArray(N[k])?N[k][p]:null});return o};
  const g={};for(const k in N)if(!SIDEK.includes(k)&&k!=="log")g[k]=N[k];
  return{0:side(0),1:side(1),g,l:{log:N.log||[]}};
}
function netCtl(o){netSend();netRaw(o)} // a question/answer: first send the state it is about, then the message (they arrive in this order)
function netRaw(o){if(NET&&NET.ws&&NET.ws.readyState===1)try{NET.ws.send(JSON.stringify(o))}catch(e){}}
function netSync(now){if(!online())return;clearTimeout(NET.tm);if(now)netSend();else NET.tm=setTimeout(()=>netSend(),80)}
function netSend(full){
  if(!online())return;clearTimeout(NET.tm);
  const P=netParts(netOut()),out={};
  for(const k of PARTS){const str=JSON.stringify(P[k]);if(str!==NET.last[k]){NET.ver[k]=(NET.ver[k]||0)+1;NET.last[k]=str;out[k]={v:NET.ver[k],d:P[k]}}else if(full)out[k]={v:NET.ver[k],d:P[k]}}
  if(Object.keys(out).length)netRaw({t:"st",parts:out});
  netSave();
}
// ---- a state from the other phone: take the parts with a higher version, put my real hidden cards back
function netIn(parts){
  if(!online())return;
  netSend(); // first send what is still waiting here, then compare
  const take=PARTS.filter(k=>{const o=parts[k];if(!o)return false;const own=k==="g"||k==="l"?NET.seat===0:+k===NET.seat,mv=NET.ver[k]||0;return o.v>mv||(o.v===mv&&!own&&JSON.stringify(o.d)!==NET.last[k])});
  if(!take.length)return;
  const N=NET.seat?mirror(S):clone(S);delete N.view;
  const byHk={};[...S.mon[0],...S.st[0],S.field[0],S.skill&&S.skill[0]].forEach(c=>{if(c&&c.hk)byHk[c.hk]=c});
  const realOf=c=>{if(!c||!c.ph||!c.hk)return c;const r=clone(byHk[c.hk]||NET.hide[c.hk]);if(!r)return c;KEEPFD.forEach(k=>{if(c[k]!==undefined)r[k]=c[k];else if(k!=="hk"&&k!=="uid"&&k!=="sid")delete r[k]});return r};
  const pile=e=>{if(!e||!e.hk||e.id!==-1)return e;const r=byHk[e.hk]||NET.hide[e.hk];return r?Object.assign({},e,{name:r.name,id:r.id,type:r.type}):e};
  const oldTurn=S.turn,oldPh=S.ph;
  for(const k of take){
    const {v,d}=parts[k];NET.ver[k]=v;NET.last[k]=JSON.stringify(d);
    if(k==="l"){N.log=clone(d.log||[]);continue}
    if(k==="g"){for(const x in N)if(!SIDEK.includes(x)&&x!=="log")delete N[x];Object.assign(N,clone(d));continue}
    const p=+k,dd=clone(d);
    if(p===NET.seat){dd.mon=(dd.mon||[]).map(realOf);dd.st=(dd.st||[]).map(realOf);dd.field=realOf(dd.field);
      ["gy","ban","edup"].forEach(x=>{if(dd[x])dd[x]=dd[x].map(pile)});
      if(dd.skill&&dd.skill.ph){const r=byHk[dd.skill.hk]||NET.hide[dd.skill.hk];if(r)dd.skill=Object.assign(clone(r),{uses:dd.skill.uses,lastT:dd.skill.lastT})}}
    SIDEK.forEach(x=>{if(!Array.isArray(N[x]))N[x]=[null,null];N[x][p]=dd[x]});
  }
  const L=NET.seat?mirror(N):N;L.view=S.view;S=L;
  UNDO=[];LASTSTR=null; // undo only takes back my own changes since the opponent's last move
  render();
  if(S.turn===0&&S.ph===0&&(oldTurn!==0||oldPh!==0))setTimeout(drawAsk,350); // the opponent ended their turn: my Draw Phase
}
const netBusy=()=>(dlg.open&&!WAITQ)||document.body.classList.contains("picking");
function netFlushQ(force){if(NET&&NET.q&&(force||!netBusy())){const q=NET.q;NET.q=null;netIn(q)}}
setInterval(()=>netFlushQ(false),400);

// ---------- Online step 2: questions for the other player go to THEIR phone ----------
// The player who started it (attacker, summoner, activator) owns the chain: its CH (with the 'fin' callback) stays on that phone.
// The question goes back and forth; the player who may answer sees the normal pop-ups, the other sees 'Waiting…'.
// The chain is always resolved on the owner's phone; the other phone gets the summary. A copy of CH on the other phone has rem:true.
var WAITQ=false; // waiting for the opponent's answer: the waiting pop-up can't be closed and incoming state is applied at once
const remote=()=>online()&&NET.peer;
const zSwap=i=>S.n===5&&i===EMZ0?EMZ1:S.n===5&&i===EMZ1?EMZ0:i;
function netWait(txt){WAITQ=true;open(`<h2>⏳ ${esc(txt)}</h2><p><small>Your opponent answers on their own phone.</small></p>`);dlg.dataset.nox="1"}
function waitEnd(){WAITQ=false;delete dlg.dataset.nox}
function chMirror(ch){ // a chain as the other phone sees it (players swapped)
  const c=JSON.parse(JSON.stringify({ctx:ch.ctx,stack:ch.stack,negated:!!ch.negated})),x=c.ctx; // (JSON drops ctx.fin)
  if(x.act)x.act.p=1-x.act.p;else if(x.sum){x.sum.p=1-x.sum.p;x.sum.i=zSwap(x.sum.i)}else{x.p=1-x.p;x.i=zSwap(x.i);if(x.k>=0)x.k=zSwap(x.k)}
  c.stack.forEach(R=>{R.r=1-R.r;if(R.p!=null)R.p=1-R.p;R.who=swapLog(R.who||"");R.summary=swapLog(R.summary||"");if(R.src&&R.src.z==="mon")R.src.i=zSwap(R.src.i);
    (R.effects||[]).forEach(e=>{if(e.p!=null){e.p=1-e.p;if(e.t!=="sdes")e.i=zSwap(e.i)}if(typeof e.who==="number")e.who=1-e.who;e.text=swapLog(e.text||"")})});
  return c;
}
const chOwner=ch=>{const x=ch.ctx;return x.act?x.act.p:x.sum?x.sum.p:x.p};
function netQ(m){
  if(m.t==="ask"||m.t==="resolve"){
    const inc=m.ch,mine=chOwner(inc)===0; // after the mirror: owner 0 = this phone owns the chain
    if(mine){const fin=CH&&!CH.rem&&CH.ctx&&CH.ctx.fin;CH={ctx:Object.assign(inc.ctx,fin?{fin}:{}),stack:inc.stack,negated:inc.negated}}
    else CH=Object.assign(inc,{rem:true});
    waitEnd();
    if(m.t==="ask")chainAsk(0);else chainResolve();
    return;
  }
  if(m.t==="clog"){waitEnd();if(m.log&&m.log.length)open(`${closeX()}<h2>Chain resolved</h2><div class="card">${m.log.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div><div class="row"><button onclick="dlg.close()" style="background:#1f5a3a;font-weight:800">OK</button></div>`);else if(dlg.open)dlg.close();return}
  if(m.t==="battle"){battleAskRemote(m.p,m.i,m.k);return}
  if(m.t==="bans"){const b=NET.bat;waitEnd();NET.bat=null;if(!b)return;
    if(m.a==="no")battleConfirm(0,b.i,b.k);
    else{if(dlg.open)dlg.close();S.paused={p:0,i:b.i,k:b.k};render();toast("⏸ Your opponent paused the attack to respond by hand")}
    return}
  if(m.t==="reveal"){const t=S.mon[0][m.k];if(t&&t.pos==="FD"){t.pos="DEF";addLog(`${t.name} was attacked and flipped face-up`);render()}netSend();netRaw({t:"revealed"});return} // the attacked face-down monster is flipped face-up (official: in the Damage Step)
  if(m.t==="revealed"){const f=NET.revCont;NET.revCont=null;waitEnd();if(f)f();return}
}
// the defender's phone: the attacker asks "do you respond?"
function battleAskRemote(p,i,k){
  const m=S.mon[p][i],t=k>=0?S.mon[1-p][k]:null;if(!m){netCtl({t:"bans",a:"no"});return}
  const tn=k<0?"you directly":t?(t.pos==="FD"?"your face-down monster":esc(t.name)):"your monster";
  open(`<h2>⚔ ${esc(m.name)} attacks ${tn}</h2><p style="font-size:16px">${esc(m.name)} (${stats(p,i).a} ATK) attacks.</p>
   <p><b>Do you want to respond</b> with a Trap, a Quick-Play Spell or an effect?</p>
   <div class="row"><button id="rno" style="background:#1f5a3a;font-weight:800">No, continue</button></div>
   <div class="row"><button id="rbuild" style="background:#8a5a14;font-weight:800">Yes — activate (effect builder)</button></div>
   <div class="row"><button id="ryes">Yes — pause, I'll do it by hand</button></div>`,()=>{
    dlg.dataset.nox="1";
    $("rno").onclick=()=>{delete dlg.dataset.nox;netCtl({t:"bans",a:"no"});dlg.close()};
    $("rbuild").onclick=()=>{delete dlg.dataset.nox;CH={ctx:{p,i,k},stack:[],negated:false,rem:true};chainBuild(0)};
    $("ryes").onclick=()=>{delete dlg.dataset.nox;netCtl({t:"bans",a:"pause"});dlg.close();toast("⏸ Attack paused — resolve your effect, the attacker continues")};
  });
}
dlg.addEventListener("cancel",e=>{if(dlg.dataset.nox)e.preventDefault()}); // Esc / back button: a waiting or required pop-up stays

// ---- connection
function netConnect(create){
  if(!NET)return;clearTimeout(NET.rt);
  if(NET.ws){try{NET.ws.onclose=null;NET.ws.close()}catch(e){}}
  netBar("🔌 Connecting…");
  const ws=NET.ws=new WebSocket(`${RELAY}/room/${NET.code}?seat=${NET.seat}&cid=${encodeURIComponent(NET.cid)}${create?"&create=1":""}`);
  ws.onmessage=e=>{if(e.data==="pong")return;let m;try{m=JSON.parse(e.data)}catch(x){return}netMsg(m)};
  ws.onclose=()=>{if(!NET||NET.ws!==ws)return;NET.peer=false;netBar("🔌 Connection lost — reconnecting…");NET.rt=setTimeout(()=>netConnect(),NET.back=Math.min(15000,(NET.back||1000)*1.6))};
  ws.onopen=()=>{NET.back=1000;clearInterval(NET.pi);NET.pi=setInterval(()=>{if(ws.readyState===1)ws.send("ping")},25000)};
}
function netMsg(m){
  if(!NET)return;
  if(m.t==="err"){const why=m.err;const w=NET;NET.ws.onclose=null;
    if(why==="taken"&&w.seat===0&&!w.live){NET=netNew(roomCode(),0);NET.mode=w.mode;netSave();netConnect(true);lobbyDraw(true);return}
    NET=null;netSave();netBar("");
    open(`${closeX()}<h2>Online</h2><p>${why==="notfound"?"Room <b>"+esc(w.code)+"</b> was not found. Check the code with your opponent.":why==="full"?"Room <b>"+esc(w.code)+"</b> already has 2 players.":"The room is no longer available."}</p><div class="row"><button onclick="dlg.close()">OK</button></div>`);return}
  if(m.t==="hello"){NET.peer=m.peer;netBar(m.peer||!NET.live?"":"⏳ Opponent disconnected — waiting…");if(NET.live&&m.peer)netSend(true);lobbyDraw();return}
  if(m.t==="peer"&&!m.on&&WAITQ){waitEnd();if(dlg.open)dlg.close();toast("Your opponent disconnected");NET.bat=null;NET.revCont=null}
  if(m.t==="peer"){NET.peer=m.on;netBar(m.on||!NET.live?"":"⏳ Opponent disconnected — waiting…");if(m.on&&NET.live)netSend(true);if(m.on)SFX.pok&&SFX.pok();lobbyDraw();return}
  if(m.t==="st"){if(netBusy()){NET.q=NET.q||{};for(const k in m.parts)if(!NET.q[k]||m.parts[k].v>=NET.q[k].v)NET.q[k]=m.parts[k]}else netIn(m.parts);return}
  if(["ask","resolve","clog","battle","bans","reveal","revealed"].includes(m.t)){netFlushQ(true);netQ(m);return}
  if(m.t==="start"&&NET.seat===1){netBegin(m.lp,m.n);return}
  if(m.t==="ready"){NET.rdy.opp=true;netTossIfReady();return}
  if(m.t==="toss"&&NET.seat===1){introCoin(!m.heads);return}
  if(m.t==="first"){introFlash(NET.seat?1-m.starter:m.starter);return}
  if(m.t==="leave"){NET.peer=false;if(NET.live){netBar("");open(`${closeX()}<h2>Online</h2><p>Your opponent left the duel.</p><div class="row"><button id="lv">Leave too</button><button onclick="dlg.close()">Stay</button></div>`,()=>{$("lv").onclick=()=>{dlg.close();netLeave();showSplash()}})}lobbyDraw();return}
}
function netBar(t){let b=$("netbar");if(!b){b=document.createElement("div");b.id="netbar";document.body.appendChild(b)}b.textContent=t;b.hidden=!t}
function netLeave(){if(!NET)return;netRaw({t:"leave"});const ws=NET.ws;clearInterval(NET.pi);clearTimeout(NET.rt);clearTimeout(NET.tm);NET=null;netSave();netBar("");wakeLock(false);if(ws){ws.onclose=null;setTimeout(()=>{try{ws.close()}catch(e){}},150)}}
const roomCode=()=>Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[rnd(32)]).join("");
// keep the screen on during an online duel (a sleeping phone loses the connection)
async function wakeLock(on){try{if(!on){if(wakeLock.l){wakeLock.l.release();wakeLock.l=null}return}if("wakeLock"in navigator&&!wakeLock.l&&document.visibilityState==="visible"){wakeLock.l=await navigator.wakeLock.request("screen");wakeLock.l.addEventListener("release",()=>{wakeLock.l=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"||!NET)return;if(NET.live)wakeLock(true);if(!NET.ws||NET.ws.readyState>1)netConnect()});
// ---- lobby: make a room (seat 0) or join one (seat 1)
function lobbyCreate(mode){if(NET)netLeave();NET=netNew(roomCode(),0);NET.mode=mode;netSave();netConnect(true);lobbyDraw(true)}
function lobbyJoin(){

    const go=()=>{const c=$("rc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==5){$("rc").focus();return}if(NET)netLeave();NET=netNew(c,1);netSave();netConnect(false);lobbyDraw(true)};

function lobbyDraw(force){

  open(`<button class="x" id="lbx">✕</button><h2>Play online</h2>${host
    ?`<p>Room code:</p><div class="roomcode">${esc(NET.code)}</div><p><small>Your opponent opens ${esc(APP_NAME)} on their own phone, chooses <b>1 player · own phone</b> and taps <b>Join room</b>.</small></p>
      <p>${NET.peer?"✅ <b>Opponent connected!</b>":"⏳ Waiting for your opponent…"}</p><p><small>Rules: ${speed?"Speed Duel (4000 LP, 3 zones, Skills)":"Master Duel (8000 LP, 5 zones)"}</small></p>
      <div class="row"><button id="lbs" style="background:#8be32a;color:#0b2200;font-weight:800" ${NET.peer?"":"disabled"}>Start duel</button></div>`
    :`<p>Room <b>${esc(NET.code)}</b></p><p>${NET.peer?"✅ Connected. Waiting for the other player to start the duel…":NET.ws&&NET.ws.readyState===1?"⏳ The other player is not connected right now…":"🔌 Connecting…"}</p>`}
    <div class="row"><button id="lbl">Leave the room</button></div>`,()=>{
    dlg.dataset.lobby="1";
    const bye=()=>{delete dlg.dataset.lobby;netLeave();dlg.close()};
    $("lbx").onclick=bye;$("lbl").onclick=bye;
    if($("lbs"))$("lbs").onclick=()=>{delete dlg.dataset.lobby;dlg.close();netBegin(speed?4000:8000,speed?3:5)};
  });
}
function netBegin(lp,n){ // both phones: a new online duel
  if(!NET)return;
  if(NET.seat===0)netRaw({t:"start",lp,n});
  NET.live=true;NET.ver={0:0,1:0,g:0,l:0};NET.last={};NET.hide={};NET.rdy={me:false,opp:false};netSave();
  if(dlg.open){delete dlg.dataset.lobby;dlg.close()}
  wakeLock(true);netBar(NET.peer?"":"⏳ Opponent disconnected — waiting…");
  startDuel(lp,n,"1p");
}
function netReady(){NET.rdy.me=true;netSend();netRaw({t:"ready"});netTossIfReady()}
function netTossIfReady(){if(!online()||NET.seat!==0||!NET.rdy.me||!NET.rdy.opp)return;NET.rdy={me:false,opp:false};const heads=rnd(2)===0;netRaw({t:"toss",heads});introCoin(heads)}

  <p><b>Music</b> (Pixabay)</p>
  ${CREDITS_MUSIC.map(([t,a,u])=>`<div class="card" style="margin:4px 0;padding:8px 10px"><a href="${u}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${esc(t)}</a><br><small>by ${esc(a)} · Pixabay</small></div>`).join("")}

  <p><b>Logo, card back, field images, icons</b><br><small>Own work by Spawner Industries, partly created with AI image tools.</small></p>

  <div class="row"><button id="credBack">← Back</button></div>`,()=>{$("credBack").onclick=()=>$("btnMenu").onclick()});
}
function showSplash(){
  const sp=$("splash");
  let view=S.view==="1p"?"1p":"2p",mode=S.n===3?"speed":"master";
  const hasDuel=S.tc>1||S.ph>0||(S.log&&S.log.length>0)||S.lp.some(v=>v!==(S.n===3?4000:8000));
  const kofi="https://ko-fi.com/spawnerindustries",saved=netLoad();
  function draw(){
    sp.innerHTML=`<img src="img/logo.png" alt="Duelist Scorekeeper">
    <div class="by">by Spawner Industries</div>
    <div class="grp"><div class="lbl">View</div><div class="opt">
      <button data-v="2p" class="${view==="2p"?"on":""}">2 players<small>1 phone</small></button>
      <button data-v="1p" class="${view==="1p"?"on":""}">1 player<small>own phone · online</small></button></div></div>
    <div class="grp"><div class="lbl">Rules</div><div class="opt">
      <button data-m="master" class="${mode==="master"?"on":""}">Master Duel<small>8000 LP, 5 zones</small></button>
      <button data-m="speed" class="${mode==="speed"?"on":""}">Speed Duel<small>4000 LP, 3 zones</small></button></div></div>
    ${view==="1p"?`<button class="go" id="spMk">Create room</button><button class="go2" id="spJn">Join room</button>${saved&&saved.live?`<button class="go2" id="spCont">Continue online duel (room ${esc(saved.code)})</button>`:""}`
      :`<button class="go" id="spGo">Start duel</button>${hasDuel&&S.view!=="1p"?'<button class="go2" id="spCont">Continue previous duel</button>':""}`}
    <a class="kofi" href="${kofi}" target="_blank" rel="noopener"><span class="kcup">☕</span> Support me on Ko-fi</a>
    <small class="fine">Unofficial fan tool, free to use. Not affiliated with or endorsed by Konami.</small>`;
    sp.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});
    sp.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    if($("spGo"))$("spGo").onclick=()=>{if(NET)netLeave();startDuel(mode==="speed"?4000:8000,mode==="speed"?3:5,view)};
    if($("spMk"))$("spMk").onclick=()=>lobbyCreate(mode);
    if($("spJn"))$("spJn").onclick=()=>lobbyJoin();
    const c=$("spCont");if(c)c.onclick=()=>{ // the field pictures fade in again when the duel continues
      if(view==="1p"){if(!NET||NET.code!==saved.code){if(NET)netLeave();NET=Object.assign(netNew(saved.code,saved.seat),saved,{last:{}})}S.view="1p";const P=netParts(netOut());PARTS.forEach(k=>NET.last[k]=JSON.stringify(P[k]));wakeLock(true);netConnect()}else if(NET)netLeave();
      S.view=view;FBS.on=false;FBS.a=FBS.b="";render();sp.hidden=true};
  }
  draw();sp.hidden=false;sp.scrollTop=0;
}
showSplash();

render();
if("serviceWorker"in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!window.__rl&&document.getElementById("splash")&&!document.getElementById("splash").hidden){window.__rl=1;location.reload()}})}
