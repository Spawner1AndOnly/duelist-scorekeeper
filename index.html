  [0,1].forEach(q=>S.st[q].forEach((e,k)=>{if(e&&e.tgt&&e.tgt.p===p&&e.tgt.i===i){S.st[q][k]=null;sendTo(q,"gy",e);addLog(`${e.name} went to the Graveyard (equipped monster left the field)`)}}));
}

// ---------- Stat bonuses (equip / field) ----------
function parseMods(t){
  let a=0,d=0,found=false;
  for(const m of t.matchAll(/(gain|lose)s?\s+(\d+)\s+(ATK\/DEF|ATK and DEF|ATK|DEF)/gi)){
    const v=(/^gain/i.test(m[1])?1:-1)*(+m[2]),w=m[3].toUpperCase();
    if(w!=="DEF")a+=v;if(w!=="ATK")d+=v;found=true;
  }
  return found?{a,d,found}:{a:0,d:0,found:false};
}
function sentences(t){return t.replace(/\n/g," ").split(/(?<=[.●])\s+/)}
// old wording: "increases its ATK and DEF by 300 points", "The ATK of ... is decreased by 300 points"
function parseOld(s){
  let a=0,d=0,found=false;
  const add=(w,v)=>{w=w.toUpperCase();if(w!=="DEF")a+=v;if(w!=="ATK")d+=v;found=true};
  for(const m of s.matchAll(/\b(increase|decrease)s?\s+(?:its\s+|the\s+)?(ATK and DEF|ATK|DEF)\b[^.]*?\bby\s+(\d+)\s+points?/gi))add(m[2],(/^inc/i.test(m[1])?1:-1)*+m[3]);
  for(const m of s.matchAll(/\b(ATK and DEF|ATK|DEF) of [^.]*?\bis (increased|decreased) by (\d+)/gi))add(m[1],(/^inc/i.test(m[2])?1:-1)*+m[3]);
  return found?{a,d,found}:{a:0,d:0,found:false};
}
// m = the monster it is equipped to (needed for "ATK equal to its Level x 100")
function parseEquip(desc,m){
  for(const s of sentences(desc)){
    const statWord=/(gain|lose|increase|decrease)s?\b.*\b(ATK|DEF)|\b(ATK|DEF)\b.*(increased|decreased)/i.test(s);
    if(statWord){
      const lv=s.match(/\b(gain|lose)s?\s+(ATK and DEF|ATK\/DEF|ATK|DEF)\s+equal to its (Level|Rank)\s*x\s*(\d+)/i);
      if(lv&&!/\bif\b|\bwhen\b|\bwhile\b|until/i.test(s)){
        const lvl=m&&m.lvl>0?m.lvl:0,v=(/^lose/i.test(lv[1])?-1:1)*lvl*(+lv[4]),w=lv[2].toUpperCase();
        return{a:w==="DEF"?0:v,d:w==="ATK"?0:v,found:lvl>0,lvx:1,note:lvl>0?`${lv[3]} ${lvl} × ${lv[4]} applied.`:`Needs a monster with a ${lv[3]} — set it manually.`};
      }
      if(/for each|\bx its\b|\bequal to\b/i.test(s)){
        const fe=s.match(/for each (?:other )?(?:face-up )?(.+?)(?:[.,;]|$)/i);
        const per=fe&&!/same name|that has|different|Equip Spell|Attribute|Type/i.test(fe[1])?perKind(fe[1]):null;
        if(per&&per!=="cnt"&&per!=="selfcnt"&&!/\bif\b|\bwhen\b|\bwhile\b|until|this turn/i.test(s)){const r=parseMods(s);if(r.found)return{a:0,d:0,ua:r.a,ud:r.d,per,found:true}}
        return{a:0,d:0,found:false,note:"This bonus depends on the game state (“for each…”) — set it manually."};
      }
    }
    if(/opponent controls|monsters you control/i.test(s))continue;
    if(/during damage calculation|until the end|this turn|\bif\b|\bwhen\b|\bwhile\b|during (?:the|your|each)/i.test(s))continue;
    const o=parseOld(s);if(o.found)return o;
    if(/equipped monster|\bIt (?:gains|loses)|^The equipped|^Gains|gains? \d+|loses? \d+/i.test(s)){const r=parseMods(s);if(r.found)return r}
  }
  return{a:0,d:0,found:false};
}
const ATTRS=["EARTH","WATER","FIRE","WIND","LIGHT","DARK","DIVINE"];
// warning for ATK/DEF changes in the card text that the app could not apply (so the player knows to adjust manually)
function whyUnapplied(s){
  if(/for each|\bx its\b|\bequal to\b/i.test(s))return"depends on a count (counters, monsters or cards)";
  if(/your turn only|opponent's turn only/i.test(s))return"only applies on one player's turn";
  if(/damage calculation|\bbattl/i.test(s))return"only applies in battle";
  if(/this turn|until/i.test(s))return"is temporary";
  if(/\bif\b|\bwhile\b|\bwhen\b|once per turn/i.test(s))return"only applies under a condition";
  return"could not be read automatically";
}
function statNote(desc,covered){
  const rs=new Set();
  for(const s of sentences(desc||"")){
    const p=s.replace(/\([^)]*\)/g,"");
    if(!/\b(gain|lose|increase|decrease)s?\b[^.]*\b(ATK|DEF)\b|\b(ATK|DEF)\b[^.]*\b(increased|decreased)\b/i.test(p))continue;
    if(!/\d|equal to|for each/i.test(p))continue;
    if(covered(p))continue;
    rs.add(whyUnapplied(p));
  }
  return rs.size?"⚠ The card text mentions an ATK/DEF change that was not applied automatically ("+[...rs].join("; ")+"). Adjust monsters manually if needed.":"";
}
const TYPEW=["fusion","synchro","xyz","link","ritual","pendulum","normal","effect","tuner","flip","spirit","union","gemini","toon"];
// one alternative of a monster filter, e.g. 'FIRE Warrior', '"Springans" Xyz', 'Level 2 or lower' -> all parts must match (AND)
function parseAlt(tok){
  let s=tok;const alt={attr:"",race:"",type:"",names:[],lvlMax:0,lvlMin:0};
  s=s.replace(/"([^"]+)"/g,(_,n)=>{alt.names.push(n.toLowerCase());return " "});
  s=s.replace(/\bLevel\s+(\d+)\s+or\s+(lower|higher)\b/gi,(_,n,w)=>{if(/lower/i.test(w))alt.lvlMax=+n;else alt.lvlMin=+n;return " "});
  s=s.replace(/\bLevel\s+(\d+)\b/gi,(_,n)=>{alt.lvlMax=alt.lvlMin=+n;return " "});
  const rest=[];
  for(const w of s.replace(/-Type\b/gi,"").replace(/\bmonsters?\b/gi," ").split(/\s+/).filter(Boolean)){
    if(ATTRS.includes(w.toUpperCase()))alt.attr=w.toUpperCase();
    else if(TYPEW.includes(w.toLowerCase()))alt.type=w.toLowerCase();
    else rest.push(w);
  }
  alt.race=rest.join(" ").toLowerCase();
  return alt;
}
// "A, B or C" = alternatives (OR); words inside one alternative must all match
function parseAlts(f){
  const prot=f.replace(/\bLevel\s+(\d+)\s+or\s+(lower|higher)\b/gi,"Level $1 ~$2");
  const out=[];
  for(const part of prot.split(/,| or | and /i).map(x=>x.trim()).filter(Boolean)){
    const subs=part.split("/").map(x=>parseAlt(x.replace("~"," or ").trim()));
    const dims=a=>[a.attr&&"a",a.race&&"r",a.type&&"t",(a.lvlMax||a.lvlMin)&&"l",a.names.length&&"n"].filter(Boolean);
    const seen=new Set();let overlap=false;
    for(const a of subs)for(const k of dims(a)){if(seen.has(k))overlap=true;seen.add(k)}
    if(subs.length>1&&!overlap){ // e.g. Aqua/WATER/Level 2 or lower: one monster must match every part
      const m={attr:"",race:"",type:"",names:[],lvlMax:0,lvlMin:0};
      for(const a of subs){m.attr=m.attr||a.attr;m.race=m.race||a.race;m.type=m.type||a.type;m.names.push(...a.names);m.lvlMax=m.lvlMax||a.lvlMax;m.lvlMin=m.lvlMin||a.lvlMin}
      out.push(m);
    }else out.push(...subs);
  }
  return out;
}
function parseField(desc){
  // returns a list of effects: [{a,d,scope,alts,not,label}] (permanent "(All) X monsters ... gain/lose N ATK/DEF" clauses only)
  const out=[];
  const add=(clause,f,scopeWord)=>{
    const fe=clause.match(/for each (.+?)(?:[.,;]|$)/i);
    let per=null;
    if(fe){per=perKind(fe[1]);if(!per)return}
    if(/until|this turn|during|while|\bif\b|once per turn|\bwhen\b|\bx its\b/i.test(clause))return;
    const mods=parseMods(clause);if(!mods.found)return;
    const ex=clause.match(/,?\s*except\s+(.+?)[.\s]*$/i);
    const scope=/you control/i.test(scopeWord||"")?"own":/opponent controls/i.test(scopeWord||"")?"opp":"both";
    out.push({a:mods.a,d:mods.d,scope,alts:f?parseAlts(f):[],not:ex?parseAlts(ex[1]):[],exc:ex?ex[1]:"",label:f||"all",per});
  };
  for(const s of sentences(desc)){
    const plain=s.replace(/\([^)]*\)/g,"").trim();
    const re=/\bAll (?:(.+?) )?monsters?(?: (on the field|you control|your opponent controls))?\s+(?=gain|lose)/gi;
    const hits=[...plain.matchAll(re)];
    hits.forEach((mm,h)=>{
      const prefix=plain.slice(h?hits[h-1].index:0,mm.index).trim();
      if(h===0&&prefix&&!/^(also|and|,)$/i.test(prefix))return;
      const end=h+1<hits.length?hits[h+1].index:plain.length;
      add(plain.slice(mm.index,end),mm[1]||"",mm[2]);
    });
    if(!hits.length){ // sentence starting with "X monsters you control gain N ATK"
      const mm=plain.match(/^(?:(.+?) )?monsters?\s+(?:(you control|your opponent controls)\s+)?(?=gain|lose)/i);
      if(mm&&!/\b(that|each|any|extra|summoned|face-up|except)\b/i.test(mm[1]||""))add(plain,mm[1]||"",mm[2]);
    }
  }
  return out;
}
const fieldEffs=f=>Array.isArray(f.eff)?f.eff:(f.eff?[f.eff]:[]);
function altHit(x,m){
  if(x.attr&&x.attr!==(m.attr||"").toUpperCase())return false;
  if(x.race&&x.race!==(m.race||"").toLowerCase())return false;
  if(x.type&&!(m.type||"").toLowerCase().includes(x.type))return false;
  if(x.names.length&&!x.names.every(n=>(m.name||"").toLowerCase().includes(n)))return false;
  if(x.lvlMax||x.lvlMin){if(/Xyz|Link/i.test(m.type||"")||!(m.lvl>0))return false;if(x.lvlMax&&m.lvl>x.lvlMax)return false;if(x.lvlMin&&m.lvl<x.lvlMin)return false}
  return true;
}
function fieldHits(e,owner,p,m){
  if(m.pos==="FD")return false;
  if(e.scope==="own"&&p!==owner)return false;
  if(e.scope==="opp"&&p===owner)return false;
  if(e.alts){ // current format
    if(e.alts.length&&!e.alts.some(x=>altHit(x,m)))return false;
    if(e.not&&e.not.some(x=>altHit(x,m)))return false;
    return true;
  }
  if(!e.attrs.length&&!e.races.length&&!e.names.length)return true; // old saved format
  if(e.attrs.length&&e.attrs.includes((m.attr||"").toUpperCase()))return true;
  if(e.races.length&&e.races.includes((m.race||"").toLowerCase()))return true;
  if(e.names.length&&e.names.some(n=>(m.name||"").toLowerCase().includes(n)))return true;
  return false;
}
function stats(p,i){
  const m=S.mon[p][i];if(!m)return null;
  let a=m.atk+m.da,d=m.def+m.dd;const src=[];
  if(m.tm&&m.tm.t===S.tc){a+=m.tm.a;d+=m.tm.d;src.push(`temporary ${fmt(m.tm)}`)}
  for(const q of[0,1])S.st[q].forEach(e=>{if(e&&e.eq&&e.pos==="UP"&&e.tgt&&e.tgt.p===p&&e.tgt.i===i){const k=e.eq.per?perCount(e.eq.per,q,e,m):0,da=e.eq.a+(e.eq.ua||0)*k,dd=e.eq.d+(e.eq.ud||0)*k;a+=da;d+=dd;src.push(`${e.name} ${fmt({a:da,d:dd})}`)}});
  for(const q of[0,1]){const f=S.field[q];if(f&&f.pos==="UP"&&f.auto!==false)for(const e of fieldEffs(f))if(fieldHits(e,q,p,m)){const k=e.per?perCount(e.per,q,f,m):1;if(!k)continue;a+=e.a*k;d+=e.d*k;src.push(`${f.name} ${fmt({a:e.a*k,d:e.d*k})}`)}}
  return{a:Math.max(0,a),d:Math.max(0,d),src};
}

// ---------- Counters & once-per-turn marks ----------
function trackerHTML(m){
  const opt=/once per turn/i.test(m.desc||""),od=/once per duel/i.test(m.desc||"");
  const n=m.otT===S.tc?(m.otN||0):0;
  return`<div class="row" style="align-items:center"><b style="flex:1.4">Counters: ${m.cnt||0}</b><button data-tk="cnt-1">−1</button><button data-tk="cnt+1">+1</button><button data-tk="cnt0">reset</button></div>`
   +(opt?`<div class="row" style="align-items:center"><b style="flex:1.4">① Used this turn: ${n}×</b><button data-tk="ot+1">Used</button><button data-tk="ot0">Clear</button></div><small>The once-per-turn mark clears itself on the next turn.</small>`:"")
   +(od?`<div class="row"><button data-tk="od">${m.od?"☑ Once per Duel effect used":"☐ Once per Duel effect used"}</button></div>`:"");
}
function trackerBind(m,again){
  dlg.querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.tk;
    if(k==="cnt-1")m.cnt=Math.max(0,(m.cnt||0)-1);else if(k==="cnt+1")m.cnt=(m.cnt||0)+1;else if(k==="cnt0")m.cnt=0;
    else if(k==="ot+1"){m.otN=(m.otT===S.tc?(m.otN||0):0)+1;m.otT=S.tc}else if(k==="ot0"){m.otN=0;m.otT=0}
    else if(k==="od")m.od=!m.od;
    again();
  });
}
const badges=m=>{const b=[];if(m.cnt)b.push("●"+m.cnt);if(m.otT===S.tc&&m.otN)b.push(m.otN>1?"①×"+m.otN:"①");if(m.od)b.push("★");return b.length?`<span class="bdg">${b.join(" ")}</span>`:""};
// "for each …" bonuses: what is counted
function perKind(t){
  t=String(t).toLowerCase();
  if(/counter/.test(t)&&(/(on|of) this card|of these counters|counters? on this card/.test(t)))return"cnt";
  if(/counter/.test(t)&&/\b(them|it)\b/.test(t))return"selfcnt";
  if(/monsters? (in|on) your (gy|graveyard)/.test(t))return"gymon";
  if(/cards? in your (gy|graveyard)/.test(t))return"gyall";
  if(/monsters? you control/.test(t))return"ownmon";
  if(/monsters? your opponent controls/.test(t))return"oppmon";
  if(/monsters? on the field/.test(t))return"allmon";
  return null;
}
const perLabel=k=>({cnt:"Counter on this card",selfcnt:"Counter on the monster",gymon:"monster in your Graveyard",gyall:"card in your Graveyard",ownmon:"monster you control",oppmon:"monster your opponent controls",allmon:"monster on the field"})[k]||k;
function perCount(k,q,card,m){ // q = controller of the card with the bonus, card = that card, m = monster that gets the bonus
  const n=a=>a.filter(Boolean).length;
  switch(k){
    case"cnt":return card.cnt||0;
    case"selfcnt":return(m&&m.cnt)||0;
    case"gymon":return S.gy[q].filter(x=>/Monster/.test(x.type||"")).length;
    case"gyall":return S.gy[q].length;
    case"ownmon":return n(S.mon[q]);
    case"oppmon":return n(S.mon[1-q]);
    case"allmon":return n(S.mon[0])+n(S.mon[1]);
  }
  return 0;
}

// ---------- Pendulum Zones ----------
// Leftmost and rightmost Spell & Trap Zones are the Pendulum Zones. A Pendulum Monster in one is stored as {kind:"pend",scale}.
const isPZ=i=>S.n===5&&(i===0||i===S.n-1);
function pendScales(p){
  const l=S.st[p][0],r=S.st[p][S.n-1];
  if(!l||!r||l.kind!=="pend"||r.kind!=="pend")return null;
  const lo=Math.min(l.scale,r.scale),hi=Math.max(l.scale,r.scale);
  return{lo,hi,min:lo+1,max:hi-1,ok:hi-lo>=2};
}
const pendText=p=>{const r=pendScales(p);return r?(r.ok?`Pendulum Summon: Levels ${r.min}–${r.max} (Scales ${r.lo} & ${r.hi})`:`Scales ${r.lo} & ${r.hi}: no Level fits in between`):"Needs a Pendulum Monster in both Pendulum Zones"};

// ---------- Extra Monster Zones & Link arrows ----------
// Master Duel / TCG (Master Rule 2020): 5 Main Monster Zones (index 0-4) + 2 shared Extra Monster Zones.
// A monster in an EMZ is stored as S.mon[controller][5 or 6]; EMZ left = index 5 (above column 2), right = 6 (above column 4).
const EMZ0=5,EMZ1=6;
const isEMZ=i=>i>=EMZ0;
const zoneName=i=>i>=EMZ0?(i===EMZ0?"Extra Monster Zone (left)":"Extra Monster Zone (right)"):"Main Monster Zone "+(i+1);
const slotName=i=>i>=EMZ0?"Extra Monster Zone":"slot "+(i+1);
const LMK=[[1,-1,-1,"↖"],[2,0,-1,"↑"],[4,1,-1,"↗"],[8,-1,0,"←"],[16,1,0,"→"],[32,-1,1,"↙"],[64,0,1,"↓"],[128,1,1,"↘"]];
const linkArrows=m=>m&&m.lm?LMK.filter(a=>m.lm&a[0]).map(a=>a[3]).join(""):"";
// global grid: x 0-4 left to right as seen by player 0; row +1 = player 0's Main Monster Zones, 0 = Extra Monster Zones (x=1 and 3 only), -1 = player 1's
function gridPos(p,i){
  if(i>=EMZ0)return{x:i===EMZ0?1:3,r:0};
  return{x:p===0?i:4-i,r:p===0?1:-1};
}
function zoneAt(x,r){ // -> {p,i} of the zone at a grid position, or null if there is no zone there
  if(x<0||x>4||r<-1||r>1)return null;
  if(r===0)return x===1?{p:-1,i:EMZ0}:x===3?{p:-1,i:EMZ1}:null;
  const p=r===1?0:1;return{p,i:p===0?x:4-x};
}
function pointedZones(){ // Set of "p:i" (Main Monster Zones) and "e:i" (Extra Monster Zones) that any face-up Link Monster points at
  const out=new Set();
  for(const p of[0,1])S.mon[p].forEach((m,i)=>{
    if(!m||m.pos==="FD"||!m.lm)return;
    const g=gridPos(p,i),f=p===0?1:-1;
    for(const a of LMK){
      if(!(m.lm&a[0]))continue;
      const z=zoneAt(g.x+a[1]*f,g.r+a[2]*f);
      if(z)out.add(z.p<0?"e:"+z.i:z.p+":"+z.i);
    }
  });
  return out;
}
const zoneKey=(p,i)=>i>=EMZ0?"e:"+i:p+":"+i;
const emzFree=k=>!S.mon[0][k]&&!S.mon[1][k];
function isLinked(p,i){ // is the monster at (p,i) pointed at by a Link Monster?
  const m=S.mon[p][i];if(!m)return false;return pointedZones().has(zoneKey(p,i));
}
// rule warnings for putting a monster into zone z of player p; fromED = it is Special Summoned from the Extra Deck
function zoneWarnings(p,z,c,how,fromED){
  const w=[];const lk=/Link/i.test(c.type||""),pend=/Pendulum/i.test(c.type||"");
  const pointed=pointedZones().has(zoneKey(p,z));
  if(z>=EMZ0){
    if(S.n!==5)w.push("There are no Extra Monster Zones in this format.");
    if(!fromED)w.push("Only monsters Special Summoned from the Extra Deck are placed in an Extra Monster Zone.");
    const other=z===EMZ0?EMZ1:EMZ0;
    if(S.mon[p][other]&&!pointed)w.push("You already control a monster in the other Extra Monster Zone. You can only use this one if a Link Monster points to it (Extra Link).");
  }else if(S.n===5&&fromED&&(lk||pend)&&!pointed){
    w.push(`${lk?"A Link Monster":"A Pendulum Monster from the Extra Deck"} can only be Summoned to an Extra Monster Zone or to a Main Monster Zone that a Link Monster points to.`);
  }
  return w;
}
function freeZones(p){ // all empty zones the player could drop a monster into
  const out=[];
  for(let i=0;i<S.n;i++)if(!S.mon[p][i])out.push(i);
  if(S.n===5)for(const k of[EMZ0,EMZ1])if(emzFree(k))out.push(k);
  return out;
}

// ---------- Monster slot ----------
function placeMon(p,i,c,pos,how){
  FXQ.push({t:"dust",p,i});
  S.mon[p][i]={name:c.name,atk:Math.max(0,c.atk??0),def:Math.max(0,c.def??0),da:0,dd:0,pos,id:c.id,type:c.type,race:c.race,attr:c.attr,lvl:c.lvl,
    q:(c.atk===-1?"A":"")+(c.def===-1?"D":""),sumT:S.tc,how,lm:c.lm|0,desc:c.desc||""};
}
function loadMonDialog(p,i){
  open(`${closeX()}<h2>Load monster (slot ${i+1}) – monsters only</h2><input type="search" id="q" placeholder="Search by name…" autocomplete="off">
    <div class="res" id="res"></div>
    <div class="row"><button id="cust">Custom monster (no search)</button></div>`,()=>{
    const q=$("q");q.focus();
    q.oninput=async()=>{
      const r=await find(q.value,'mon');
      $("res").innerHTML=r.map((c,k)=>`<div data-k="${k}"><b>${esc(c.name)}</b><br><small>${esc(c.type)} • ${c.atk===-1?"?":c.atk??"-"}/${c.def===-1?"?":c.def??"-"}</small></div>`).join("")||"<div><small>Type at least 2 letters…</small></div>";
      $("res").onclick=ev=>{const d=ev.target.closest("[data-k]");if(!d)return;summonDialog(p,i,r[+d.dataset.k])};
    };
    $("cust").onclick=()=>{placeMon(p,i,{name:"Monster",atk:0,def:0,type:"Effect Monster"},"ATK","special");render();slotDialog(p,i)};
  });
}
function summonDialog(p,i,c,opts){
  opts=opts||{};
  const extra=/Fusion|Synchro|XYZ|Link/i.test(c.type),isLink=/Link/i.test(c.type),isPend=/Pendulum/i.test(c.type);
  if(isLink&&!c.lm)c.lm=c.lm|0;
  const noNS=/(?:cannot|can't) be Normal Summoned/i.test(c.desc);
  const lv=extra?0:(c.lvl||0);
  const need=lv>=7?2:lv>=5?1:0;
  const own=S.mon[p].map((m,k)=>m&&k!==i?{m,k}:null).filter(Boolean);
  // some monsters count as 2 (or 3) Tributes for certain monsters, e.g. Kaiser Sea Horse -> any LIGHT monster
  const tribVal=m=>{
    const d=m.desc||"";if(m.pos==="FD"||/toss a coin/i.test(d))return 1;
    const t=d.match(/can be treated as (\d|two|three) Tributes? for the Tribute Summon of an? (?:(.+?) )?monsters?\b/i);
    if(!t)return 1;
    const n={two:2,three:3}[t[1].toLowerCase()]||+t[1];
    return !t[2]||parseAlts(t[2]).some(a=>altHit(a,c))?n:1;
  };
  const noTrib=((c.desc||"").match(/[^.\n]*without Tributing[^.\n]*\./i)||[])[0];
  open(`${closeX()}<h2>${esc(c.name)}</h2><small>${esc(c.type)}${c.lvl!=null?" • Level/Link "+c.lvl:""} • ATK ${c.atk===-1?"?":c.atk??"-"} / DEF ${c.def===-1?"?":c.def??"-"}</small>
   ${need?`<p><b>Needs ${need} Tribute${need>1?"s":""}</b> for a Normal Summon/Set – select:</p><div id="trib">${own.map(o=>`<label style="display:block;padding:4px 0"><input type="checkbox" value="${o.k}"> ${o.m.pos==="FD"?"Face-down monster ("+slotName(o.k)+")":esc(o.m.name)}${tribVal(o.m)>1?` <small style="color:var(--gold)">(counts as ${tribVal(o.m)} Tributes)</small>`:""}</label>`).join("")||"<small>You control no other monsters.</small>"}</div>`:""}
   ${S.n===5?`<p>${isLink?"":`<label><input type="checkbox" id="pends" ${opts.ed?"checked":""}> Pendulum Summon (uses your Pendulum Scales)</label>`}${isPend?`<br><label><input type="checkbox" id="fromED" ${opts.ed?"checked":""}> Pendulum Monster summoned face-up from the Extra Deck</label>`:""}</p>`:""}
   ${S.n===5&&(extra||isPend)?`<p><b>Zone</b></p><div id="zsel" class="row" style="gap:4px"></div><small id="zhint"></small>`:""}
   <div class="row"><button id="bn">Normal Summon</button><button id="bs">Set (face-down)</button></div>
   <div class="row"><button id="sa">Special Summon (ATK)</button>${isLink?"":`<button id="sd">Special Summon (DEF)</button>`}</div>
   ${isLink?"":`<div class="row"><button id="fd">🂠 Place face-down (by an effect — uses no Normal Set)</button></div>`}
   <div class="card" style="max-height:22dvh">${esc(c.desc).replace(/\n/g,"<br>")}</div>
   <div class="row"><button id="bk">← Back to search</button></div>`,()=>{
    let zone=i;
    const fromED=()=>extra||($("fromED")&&$("fromED").checked);
    const drawZones=()=>{
      if(!$("zsel"))return;
      const pt=pointedZones(),free=freeZones(p).filter(z=>z<EMZ0||S.n===5);
      $("zsel").innerHTML=free.map(z=>`<button data-z="${z}" style="flex:1 1 30%;${z===zone?"outline:2px solid var(--gold)":""}">${z>=EMZ0?(z===EMZ0?"EMZ left":"EMZ right"):"Zone "+(z+1)}${pt.has(zoneKey(p,z))?" 🔗":""}</button>`).join("");
      $("zsel").onclick=e=>{const b=e.target.closest("[data-z]");if(b){zone=+b.dataset.z;drawZones()}};
      $("zhint").textContent=(isLink||isPend?"Link Monsters and Pendulum Monsters from the Extra Deck go to an Extra Monster Zone or a zone marked 🔗 (a Link Monster points to it). ":"")+"Fusion/Synchro/Xyz can go to any Main Monster Zone or an Extra Monster Zone. 🔗 = pointed to by a Link Monster.";
    };
    drawZones();if($("fromED"))$("fromED").onchange=drawZones;
    const go=how=>{
      const sel=[...dlg.querySelectorAll("#trib input:checked")].map(x=>+x.value);const w=[];
      if(zone>=EMZ0)w.push("Normal Summon/Set is never placed in an Extra Monster Zone (only Special Summons from the Extra Deck).");
      if(p!==S.turn)w.push("Normal Summon/Set is only allowed on your own turn.");
      if(!inMain())w.push(`Normal Summon/Set is only allowed in a Main Phase (now: ${phName()}).`);
      if(S.ns)w.push("You already used your Normal Summon/Set this turn.");
      if(extra)w.push("Extra Deck monsters can't be Normal Summoned or Set.");
      if(noNS)w.push("This card can't be Normal Summoned/Set (it must be Special Summoned).");
      const vals=sel.map(k=>{const o=own.find(x=>x.k===k);return o?tribVal(o.m):1});
      const total=vals.reduce((a,b)=>a+b,0);
      if(total<need)w.push(`This monster needs ${need} Tribute(s); you selected ${total}.${noTrib?` Its card text says: “${noTrib.trim()}” — if that applies, continue.`:""}`);
      else if(sel.length>1&&total-Math.min(...vals)>=need)w.push("You selected more Tributes than needed.");
      else if(need===0&&sel.length)w.push("This monster needs no Tribute.");
      guard(w,()=>{sel.forEach(k=>removeMon(p,k));placeMon(p,zone,c,how==="set"?"FD":"ATK",how);S.ns=true;render();slotDialog(p,zone)},()=>summonDialog(p,i,c,opts));
    };
    $("bn").onclick=()=>go("normal");$("bs").onclick=()=>go("set");
    const special=pos=>{
      const w=zoneWarnings(p,zone,c,"special",fromED());
      if($("pends")&&$("pends").checked){
        const ps=pendScales(p);
        if(!ps)w.push("A Pendulum Summon needs a Pendulum Monster in both of your Pendulum Zones (the leftmost and rightmost Spell & Trap Zones).");
        else if(extra&&!isPend)w.push("Only monsters with a Level can be Pendulum Summoned (not Xyz or Link Monsters).");
        else if(!extra||isPend){if(!(c.lvl>=ps.min&&c.lvl<=ps.max))w.push(`Level ${c.lvl??"?"} is not between the Pendulum Scales (allowed: Levels ${ps.ok?ps.min+"–"+ps.max:"none"}).`)}
        if(S.pt[p]===S.tc)w.push("You can only Pendulum Summon once per turn.");
        if(p!==S.turn||!inMain())w.push("A Pendulum Summon is done in your own Main Phase.");
      }
      if(S.mon[p][zone])w.push("That zone is occupied.");
      guard(w,()=>{placeMon(p,zone,c,pos,"special");if($("pends")&&$("pends").checked)S.pt[p]=S.tc;if(opts.take)opts.take();render();slotDialog(p,zone)},()=>summonDialog(p,i,c,opts));
    };
    $("sa").onclick=()=>special("ATK");
    if($("sd"))$("sd").onclick=()=>special("DEF");
    if($("fd"))$("fd").onclick=()=>{
      const w=zoneWarnings(p,zone,c,"special",fromED());
      if(S.mon[p][zone])w.push("That zone is occupied.");
      guard(w,()=>{placeMon(p,zone,c,"FD","special");render();slotDialog(p,zone)},()=>summonDialog(p,i,c,opts));
    };
    $("bk").onclick=()=>loadMonDialog(p,i);
  });
}
function slotDialog(p,i){
  const m=S.mon[p][i];
  if(!m){loadMonDialog(p,i);return}
  const s=stats(p,i),sg=m.sg||-1;
  const lkTxt=m.lm?`<p><small>Link Monster – arrows: <b>${linkArrows(m)}</b>${isLinked(p,i)?" • this monster is linked (a Link Monster points to it)":""}. ${m.lm?"Link Monsters have no DEF and can't be in Defense Position.":""}</small></p>`:isLinked(p,i)?`<p><small>🔗 Linked: a Link Monster points to this monster.</small></p>`:"";
  const adj=(label,key,eff)=>`<div><b>${label}: ${eff}</b> <small>(base ${m[key==="da"?"atk":"def"]}${m[key]?`, manual ${m[key]>0?"+":""}${m[key]}`:""})</small></div>
   <div class="row">${STEPS.map(v=>`<button data-k="${key}" data-v="${v*sg}" style="min-width:40px;padding:8px 2px">${sg>0?"+":"-"}${v}</button>`).join("")}<button id="sg${key}" style="background:${sg>0?"#1f5a3a":"#6b2230"};flex:0 0 40px">${sg>0?"+":"−"}</button><button data-k="${key}" data-v="0">reset</button></div>`;
  open(`${closeX()}<h2>${esc(m.name)}</h2>${s.src.length?`<small>From cards: ${s.src.map(esc).join(" • ")}</small>`:""}${lkTxt}
   ${adj("ATK","da",s.a)}${m.lm?"":adj("DEF","dd",s.d)}
   <div class="row">${[["ATK","⚔ Attack"],["DEF","🛡 Defense"],["FD","🂠 Face-down DEF"]].filter(x=>!m.lm||x[0]==="ATK").map(([k,l])=>`<button data-pos="${k}" style="${m.pos===k?"outline:2px solid var(--gold)":""}">${l}</button>`).join("")}</div>
   ${m.pos==="FD"?`<p><small>Hidden on the field. Only you should look at this screen.</small></p>`:""}
   ${m.pos==="FD"?"":trackerHTML(m)}
   <div class="row">${m.pos==="ATK"?`<button id="atk" style="background:#8a1424">⚔ Attack…</button>`:""}<button id="info">Card text</button></div>
   <div class="row"><button id="clr" style="background:#6b2230">🪦 To Graveyard</button><button id="ban" style="background:#3a2f66">🌀 Banish</button><button id="rm">Remove (hand/deck)</button></div>
   <div class="card" id="ct" hidden></div>`,()=>{
    dlg.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;m[k]=v===0?0:m[k]+v;render();slotDialog(p,i)});
    ["da","dd"].forEach(k=>{if($("sg"+k))$("sg"+k).onclick=()=>{m.sg=-(m.sg||-1);slotDialog(p,i)}});
    dlg.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>setPos(p,i,b.dataset.pos));
    if($("atk"))$("atk").onclick=()=>attackDialog(p,i);
    trackerBind(m,()=>{render();slotDialog(p,i)});
    $("clr").onclick=()=>{removeMon(p,i);render();dlg.close()};
    $("ban").onclick=()=>{removeMon(p,i,"ban");render();dlg.close()};
    $("rm").onclick=()=>{removeMon(p,i,"none");render();dlg.close()};
    $("info").onclick=async()=>{const all=await cards();const c=all.find(x=>x.id===m.id||x.name===m.name);$("ct").hidden=false;$("ct").innerHTML=c?cardInfo(c):"No card text (custom monster).";};
  });
}
function setPos(p,i,np){
  const m=S.mon[p][i],old=m.pos,w=[];
  if(old===np)return;
  const turnMain=()=>{if(p!==S.turn)w.push("This is only allowed on your own turn.");if(!inMain())w.push(`Only allowed in a Main Phase (now: ${phName()}).`)};
  if(old==="FD"&&np==="ATK"){
    turnMain();
    if(m.sumT===S.tc)w.push("A monster can't be flipped face-up (Flip Summon) on the turn it was Set (also when it was Set by an effect).");
  }else if(np==="FD"){w.push("A face-up monster is only turned face-down by a card effect.")}
  else if(old==="FD"&&np==="DEF"){w.push("A face-down monster is flipped face-up in Attack Position (Flip Summon). Defense only by an effect.")}
  else{
    turnMain();
    if(m.sumT===S.tc)w.push("A monster can't change its battle position on the turn it was Summoned or Set (Special Summons included), unless a card effect allows it.");
    if(m.flipT===S.tc)w.push("A Flip Summoned monster can't change position the turn it was flipped.");
    if(m.posT===S.tc)w.push("This monster already changed position this turn.");
    if(m.attT===S.tc)w.push("This monster attacked this turn, so it can't change position.");
  }
  guard(w,()=>{if(old==="FD"&&np==="ATK")m.flipT=S.tc;else m.posT=S.tc;m.pos=np;render();slotDialog(p,i)},()=>slotDialog(p,i));
}

// ---------- Attack ----------
function attackWarnings(p,i){
  const m=S.mon[p][i],w=[];
  if(p!==S.turn)w.push("Only the turn player can attack.");
  if(PHASES[S.ph].n!=="Battle Phase")w.push(`Attacks are made in the Battle Phase (now: ${phName()}).`);
  if(m.attT===S.tc)w.push("This monster already attacked this turn.");
  return w;
}
function attackDialog(p,i){
  const m=S.mon[p][i],q=1-p,s=stats(p,i),w0=attackWarnings(p,i);
  const targets=S.mon[q].map((t,k)=>t?{t,k}:null).filter(Boolean);
  open(`${closeX()}<h2>⚔ ${esc(m.name)} attacks (${s.a} ATK)</h2>
   ${w0.length?`<div class="card" style="color:var(--red)">⚠ ${w0.map(esc).join("<br>⚠ ")}</div>`:""}
   <p>Choose the target:</p><div class="res" id="tl">${targets.map(o=>`<div data-k="${o.k}"><b>${o.t.pos==="FD"?"Face-down monster":esc(o.t.name)}</b><br><small>${o.t.pos==="FD"?slotName(o.k):o.t.pos==="ATK"?"ATK "+stats(q,o.k).a:"DEF "+stats(q,o.k).d}</small></div>`).join("")}<div data-k="-1"><b>Direct attack</b></div></div>
   <div class="row"><button id="bk">← Back</button></div>`,()=>{
    $("tl").onclick=e=>{const d=e.target.closest("[data-k]");if(d)battleStart(p,i,+d.dataset.k)};
    $("bk").onclick=()=>slotDialog(p,i);
  });
}
// the defender gets the chance to respond (Trap, Quick-Play Spell, effect) before the result is calculated
function battleStart(p,i,k){
  if(S.noAsk||attackWarnings(p,i).length){battleConfirm(p,i,k);return}
  const m=S.mon[p][i],q=1-p,t=k>=0?S.mon[q][k]:null,two=S.view==="2p",A=stats(p,i).a;
  const tn=k<0?(two?"you directly":"the opponent directly"):t.pos==="FD"?"a face-down monster":esc(t.name);
  FLIP=two&&q===1?true:(two?false:null);
  open(`${closeX()}<h2>⚔ ${esc(m.name)} attacks ${tn}</h2><p style="font-size:16px">${esc(m.name)} (${A} ATK) attacks.</p>
   <p><b>${two?"Do you":"Does the opponent"} want to respond</b> with a Trap, a Quick-Play Spell or an effect?</p>
   <div class="row"><button id="rno" style="background:#1f5a3a;font-weight:800">No, continue</button></div>
   <div class="row"><button id="rbuild" style="background:#8a5a14;font-weight:800">Yes — activate (effect builder)</button></div>
   <div class="row"><button id="ryes">Yes — pause, I'll do it by hand</button></div>
   <div class="row"><button id="rbk">← Back</button></div>`,()=>{
    $("rno").onclick=()=>{FLIP=null;battleConfirm(p,i,k)};
    $("rbuild").onclick=()=>{CH={ctx:{p,i,k},stack:[],negated:false};chainBuild(q)};
    $("ryes").onclick=()=>{FLIP=null;dlg.close();S.paused={p,i,k};render();toast("⏸ Attack paused — resolve the effect, then continue")};
    $("rbk").onclick=()=>{FLIP=null;attackDialog(p,i)};
  });
}
function continueBattle(c){
  const m=S.mon[c.p][c.i];
  if(!m){if(dlg.open)dlg.close();render();toast("The attacker left the field — the attack ends");return}
  render();
  if(c.k>=0&&!S.mon[1-c.p][c.k]){toast("The target is gone — choose a new target");attackDialog(c.p,c.i);return} // replay
  battleConfirm(c.p,c.i,c.k);
}
function resumeBattle(){
  const pz=S.paused;if(!pz)return;S.paused=null;
  continueBattle(pz);
}

// ---------- Responding to an attack: effect builder + a simple chain (last activated resolves first) ----------
let CH=null; // {ctx:{p,i,k},stack:[response],negated}
const sideName=(r,p)=>p===r?"your":"opponent's";
const youOr=r=>(S.view==="2p"||r===0)?"you":"the opponent";
function chainOpen(r,html,after){FLIP=S.view==="2p"?r===1:null;open(html,after)}
function chainAsk(r){ // r = the player who may respond now
  const last=CH.stack[CH.stack.length-1];
  chainOpen(r,`${closeX()}<h2>Respond?</h2><p style="font-size:16px">${esc(last.who)} activated: <b>${esc(last.summary)}</b></p>
   <p><b>${S.view==="2p"?"Do you":"Does the opponent"} want to respond</b> to that?</p>
   <div class="row"><button id="cno" style="background:#1f5a3a;font-weight:800">No — resolve it</button><button id="cyes" style="background:#8a5a14;font-weight:800">Yes — activate something</button></div>`,()=>{
    $("cno").onclick=()=>chainResolve();
    $("cyes").onclick=()=>chainBuild(r);
  });
}
// every monster on the field, attacker and target first
function chainMons(r){
  const c=CH.ctx,out=[];
  for(const q of[0,1])S.mon[q].forEach((m,i)=>{if(m){const tag=(q===c.p&&i===c.i)?"attacker":(q===1-c.p&&i===c.k)?"attack target":"";out.push({p:q,i,m,tag,w:tag==="attacker"?0:tag?1:q===r?2:3})}});
  return out.sort((a,b)=>a.w-b.w);
}
const monLabel=(o,r)=>`${esc(o.m.pos==="FD"?"Face-down monster ("+o.m.name+")":o.m.name)} <small>— ${sideName(r,o.p)} monster${o.tag?" • "+o.tag:""}</small>`;
const monRadios=(r,pre)=>{const L=chainMons(r),pi=pre==="own"?Math.max(0,L.findIndex(o=>o.p===r)):0;return L.map((o,n)=>`<label style="display:block;padding:6px 0"><input type="radio" name="tg" value="${o.p}:${o.i}" ${n===pi?"checked":""}> ${monLabel(o,r)}</label>`).join("")||"<small>There are no monsters on the field.</small>"};
const pickedMon=()=>{const v=(dlg.querySelector('input[name="tg"]:checked')||{}).value;if(!v)return null;const[p,i]=v.split(":").map(Number);const m=S.mon[p][i];return m?{p,i,nm:m.name}:null};
function chainBuild(r){
  const R={p:r,who:r===0?"You":"Opponent",kind:"",src:null,srcName:"",effects:[]};
  const kinds=[["Trap Card","trap"],["Quick-Play Spell","spell"],["Monster effect","mon"],["Another effect","other"]];
  const stepKind=()=>chainOpen(r,`${closeX()}<h2>${S.view==="2p"?"What are you activating?":"What is the opponent activating?"}</h2>
    ${kinds.map(([l,k])=>`<div class="row"><button data-k="${k}">${l}</button></div>`).join("")}
    <div class="row"><button id="cx">Cancel</button></div>`,()=>{
    dlg.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{R.kind=b.dataset.k;stepSrc()});
    $("cx").onclick=()=>CH.stack.length?chainAsk(1-CH.stack[CH.stack.length-1].r):(FLIP=null,battleStart(CH.ctx.p,CH.ctx.i,CH.ctx.k));
  });
  const stepSrc=()=>{
    const items=[];
    if(R.kind==="mon")S.mon[r].forEach((m,i)=>{if(m)items.push({key:"mon:"+i,label:m.pos==="FD"?"Face-down monster ("+m.name+")":m.name})});
    else S.st[r].forEach((c,i)=>{if(c)items.push({key:"st:"+i,label:`${c.name} <small>(${c.pos==="FD"?"Set":"face-up"})</small>`})});
    chainOpen(r,`${closeX()}<h2>Which card?</h2><div class="res" id="sl">${items.map(o=>`<div data-s="${o.key}">${o.label}</div>`).join("")}<div data-s="none"><b>A card from my hand / Graveyard</b><br><small>not on the field</small></div></div><div class="row"><button id="bk">← Back</button></div>`,()=>{
      $("sl").onclick=e=>{const d=e.target.closest("[data-s]");if(!d)return;const v=d.dataset.s;
        if(v==="none"){R.src=null;R.srcName=""}else{const[z,i]=v.split(":");R.src={z,i:+i};const c=z==="mon"?S.mon[r][+i]:S.st[r][+i];R.srcName=c?c.name:""}
        stepEffects()};
      $("bk").onclick=stepKind;
    });
  };
  const sum=e=>e.text;
  const stepEffects=()=>{
    chainOpen(r,`${closeX()}<h2>What does it do?</h2><small>${esc(R.srcName||"A card")} (${kinds.find(x=>x[1]===R.kind)[0]})</small>
     <div class="card" id="el">${R.effects.length?R.effects.map((e,n)=>`<div>• ${esc(sum(e))} <button data-rm="${n}" style="min-width:0;padding:2px 8px">✕</button></div>`).join(""):"<small>Nothing added yet. Add the effects of your card:</small>"}</div>
     <div class="row"><button id="e1">ATK / DEF change</button><button id="e2">Destroy a monster</button></div>
     <div class="row"><button id="e3">Negate the attack</button><button id="e4">Life Points</button></div>
     <div class="row"><button id="e5">Other (just note it)</button></div>
     <div class="row"><button id="ebk">← Back</button><button id="edone" style="background:#8be32a;color:#0b2200;font-weight:800">Activate</button></div>
     ${R.src===null?`<small>If the card came from your hand, add it to your Graveyard afterwards (Graveyard list → + Add card).</small>`:""}`,()=>{
      dlg.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.effects.splice(+b.dataset.rm,1);stepEffects()});
      $("e1").onclick=()=>chainOpen(r,`${closeX()}<h2>ATK / DEF change</h2><p>Which monster?</p>${monRadios(r,"own")}
        <div class="row" style="align-items:center"><label style="flex:1">ATK change<input type="number" id="ea" value="0"></label><label style="flex:1">DEF change<input type="number" id="ed" value="0"></label></div>
        <label style="display:block;padding:6px 0"><input type="checkbox" id="eu" checked> Until the end of this turn</label>
        <small>Use a minus sign for a decrease (for example −500).</small>
        <div class="row"><button id="b1">← Back</button><button id="o1" style="background:#1f5a3a">Add</button></div>`,()=>{
          $("b1").onclick=stepEffects;
          $("o1").onclick=()=>{const t=pickedMon();if(!t)return;const a=parseInt($("ea").value)||0,d=parseInt($("ed").value)||0,u=$("eu").checked;
            if(!a&&!d)return stepEffects();
            R.effects.push({t:"stat",p:t.p,i:t.i,nm:t.nm,a,d,u,text:`${t.nm}: ${a>=0?"+":""}${a} ATK / ${d>=0?"+":""}${d} DEF${u?" until the end of the turn":""}`});stepEffects()};
        });
      $("e2").onclick=()=>chainOpen(r,`${closeX()}<h2>Destroy which monster?</h2>${monRadios(r,"attacker")}
        <label style="display:block;padding:6px 0"><input type="checkbox" id="eb"> Banish it instead</label>
        <div class="row"><button id="b2">← Back</button><button id="o2" style="background:#1f5a3a">Add</button></div>`,()=>{
          $("b2").onclick=stepEffects;
          $("o2").onclick=()=>{const t=pickedMon();if(!t)return;const b=$("eb").checked;R.effects.push({t:"kill",p:t.p,i:t.i,nm:t.nm,ban:b,text:`${b?"Banish":"Destroy"} ${t.nm}`});stepEffects()};
        });
      $("e3").onclick=()=>{if(!R.effects.some(e=>e.t==="neg"))R.effects.push({t:"neg",text:"Negate the attack"});stepEffects()};
      $("e4").onclick=()=>chainOpen(r,`${closeX()}<h2>Life Points</h2>
        <label style="display:block;padding:6px 0"><input type="radio" name="lw" value="${r}" checked> ${S.view==="2p"?"My":"The responder's"} Life Points</label>
        <label style="display:block;padding:6px 0"><input type="radio" name="lw" value="${1-r}"> The opponent's Life Points</label>
        <label>Change<input type="number" id="el1" value="0"></label><small>Positive = gain, negative = lose (for example −800).</small>
        <div class="row"><button id="b4">← Back</button><button id="o4" style="background:#1f5a3a">Add</button></div>`,()=>{
          $("b4").onclick=stepEffects;
          $("o4").onclick=()=>{const n=parseInt($("el1").value)||0;if(!n)return stepEffects();const who=+(dlg.querySelector('input[name="lw"]:checked')||{}).value;
            R.effects.push({t:"lp",who,n,text:`${NAME(who)}: ${n>=0?"+":""}${n} LP`});stepEffects()};
        });
      $("e5").onclick=()=>chainOpen(r,`${closeX()}<h2>Other effect</h2><p>Describe it (optional) — nothing on the board changes, you do it by hand.</p><input type="text" id="en" placeholder="e.g. draw 2 cards" autocomplete="off">
        <div class="row"><button id="b5">← Back</button><button id="o5" style="background:#1f5a3a">Add</button></div>`,()=>{
          $("b5").onclick=stepEffects;
          $("o5").onclick=()=>{const t=($("en").value||"").trim()||"Another effect";R.effects.push({t:"note",text:t});stepEffects()};
        });
      $("ebk").onclick=stepSrc;
      $("edone").onclick=()=>{
        R.summary=`${R.srcName||"a card"} — ${R.effects.length?R.effects.map(sum).join("; "):"no board change"}`;
        R.r=r;CH.stack.push(R);addLog(`${R.who} activated ${R.summary}`);
        chainAsk(1-r);
      };
    });
  };
  stepKind();
}
function chainApply(e,log){
  if(e.t==="neg"){CH.negated=true;log.push("The attack is negated.");return}
  if(e.t==="note"){log.push(`Note: ${e.text} (do it by hand)`);return}
  if(e.t==="lp"){setLP(e.who,S.lp[e.who]+e.n,x=>`${NAME(e.who)}: ${e.n>=0?"+":""}${e.n} (effect) → ${x}`);log.push(e.text);return}
  const m=S.mon[e.p][e.i];
  if(!m||m.name!==e.nm){log.push(`${e.nm} is no longer on the field — its effect is skipped.`);return}
  if(e.t==="stat"){
    if(e.u){const t=m.tm&&m.tm.t===S.tc?m.tm:{a:0,d:0,t:S.tc};t.a+=e.a;t.d+=e.d;m.tm=t}else{m.da+=e.a;m.dd+=e.d}
    log.push(e.text);return;
  }
  if(e.t==="kill"){removeMon(e.p,e.i,e.ban?"ban":"gy");log.push(e.text)}
}
function chainResolve(){
  const ctx=CH.ctx,log=[];UNDOMERGE=true;
  for(const R of CH.stack.slice().reverse()){ // the last activated resolves first
    log.push(`${R.who}: ${R.srcName||"a card"}`);
    for(const e of R.effects)chainApply(e,log);
    if(R.src&&R.src.z==="st"){ // the card is used: it turns face-up, a one-shot card goes to the Graveyard
      const c=S.st[R.r][R.src.i];
      if(c){c.pos="UP";if(/^(Normal|Quick-Play|Ritual) Spell|^(Normal|Counter) Trap/.test(c.type||"")){S.st[R.r][R.src.i]=null;sendTo(R.r,"gy",c,true)}}
    }
  }
  UNDOMERGE=false;render();
  const neg=CH.negated;CH=null;
  chainOpen(0,`${closeX()}<h2>Resolved</h2><div class="card">${log.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>
    <div class="row"><button id="cok" style="background:#1f5a3a;font-weight:800">${neg?"OK — the attack ends":"Continue the battle"}</button></div>`,()=>{
    FLIP=null;dlg.classList.remove("flip");
    $("cok").onclick=()=>{
      if(neg){const m=S.mon[ctx.p][ctx.i];if(m)m.attT=S.tc;render();dlg.close();toast("Attack negated");return}
      continueBattle(ctx);
    };
  });
}
function endPausedAttack(){
  const pz=S.paused;if(!pz)return;S.paused=null;
  const m=S.mon[pz.p][pz.i];if(m)m.attT=S.tc; // a declared attack counts as the monster's attack even if it is negated
  render();toast("Attack ended (counts as an attack)");
}
function battleConfirm(p,i,k){
  const m=S.mon[p][i],q=1-p,A=stats(p,i).a,w=attackWarnings(p,i);let txt,eff,pl;
  const hit=(who,n,why)=>setLP(who,S.lp[who]-n,x=>`${NAME(who)}: −${n} (${why}) → ${x}`);
  if(k<0){
    if(S.mon[q].some(Boolean))w.push("A direct attack is only allowed if the opponent controls no monsters.");
    txt=`Direct attack: ${NAME(q)} takes ${A} damage.`;eff=()=>hit(q,A,"direct attack");pl={kind:"direct",p,i,q,aTxt:`ATK ${A}`};
  }else{
    const t=S.mon[q][k],ts=stats(q,k),fd=t.pos==="FD",atkPos=t.pos==="ATK";
    const tname=fd?`Face-down monster (${t.name})`:t.name;
    if(atkPos){
      const v=ts.a;
      pl={p,i,q,k,def:false,tDies:A>=v,aDies:A<=v,aTxt:`ATK ${A}`,tTxt:fd?"face-down":`ATK ${v}`};
      if(A>v){txt=`${tname} (${v} ATK) is destroyed. ${NAME(q)} takes ${A-v} damage.`;eff=()=>{removeMon(q,k);hit(q,A-v,"battle")}}
      else if(A<v){txt=`${m.name} (${A}) is destroyed. ${NAME(p)} takes ${v-A} damage.`;eff=()=>{removeMon(p,i);hit(p,v-A,"battle")}}
      else{txt="Both monsters are destroyed. No damage.";eff=()=>{removeMon(q,k);removeMon(p,i);render()}}
    }else{
      const v=ts.d;pl={p,i,q,k,def:true,brk:A>v,tDies:A>v,aTxt:`ATK ${A}`,tTxt:`DEF ${v}`};
      if(A>v){txt=`${tname} (${v} DEF) is destroyed. No battle damage.${fd?" It is flipped face-up first.":""}`;eff=()=>{removeMon(q,k);render()}}
      else if(A<v){txt=`${tname} (${v} DEF) holds. ${NAME(p)} takes ${v-A} damage.${fd?" It is flipped face-up.":""}`;eff=()=>{if(fd)t.pos="DEF";hit(p,v-A,"battle")}}
      else{txt=`${tname} (${v} DEF) holds. No damage.${fd?" It is flipped face-up.":""}`;eff=()=>{if(fd)t.pos="DEF";render()}}
    }
  }
  open(`${closeX()}<h2>⚔ Battle result</h2>
   ${w.length?`<div class="card" style="color:var(--red)">⚠ ${w.map(esc).join("<br>⚠ ")}</div>`:""}
   <p style="font-size:16px">${esc(txt)}</p><small>Card effects (like traps) can change this. Apply only if nothing else happened.</small>
   <div class="row"><button id="ap" style="background:#1f5a3a">Apply result</button><button id="mk">Only mark as attacked</button><button id="bk">Back</button></div>`,()=>{
    $("ap").onclick=()=>guard(w,async()=>{m.attT=S.tc;dlg.close();await fxBattle(pl);eff();render()},()=>battleConfirm(p,i,k));
    $("mk").onclick=()=>{m.attT=S.tc;render();dlg.close()};
    $("bk").onclick=()=>attackDialog(p,i);
  });
}

// ---------- Spell / Trap / Field zones ----------
const getZ=(p,i,z)=>z==="field"?S.field[p]:S.st[p][i];
const setZ=(p,i,z,v)=>{if(z==="field")S.field[p]=v;else S.st[p][i]=v};
const putZone=(p,i,z,e)=>{if(z==="field"&&S.field[p]&&S.field[p]!==e){sendTo(p,"gy",S.field[p],true);addLog(`${S.field[p].name} was replaced by a new Field Spell`)}setZ(p,i,z,e)};
const subType=t=>(t||"").replace(/ (Spell|Trap)$/,"");
function pickTarget(onPick,back){
  const list=[];for(const q of[0,1])S.mon[q].forEach((m,k)=>{if(m)list.push({q,k,m})});
  open(`${closeX()}<h2>Equip to which monster?</h2>${list.length?"":"<p>There are no monsters on the field.</p>"}
   <div class="res" id="tl">${list.map((o,x)=>`<div data-x="${x}"><b>${o.m.pos==="FD"?"Face-down monster":esc(o.m.name)}</b><br><small>${NAME(o.q)} • ${slotName(o.k)}</small></div>`).join("")}</div>
   <div class="row"><button id="bk">Cancel</button></div>`,()=>{
    $("tl").onclick=e=>{const d=e.target.closest("[data-x]");if(d){const o=list[+d.dataset.x];onPick({p:o.q,i:o.k})}};
    $("bk").onclick=()=>back?back():dlg.close();
  });
}
function openZone(p,i,z){cardZoneDialog(p,i,z)}
// make a card face-up in a zone: pick equip target / parse field effect first
function activateIn(p,i,z,e,back){
  const done=()=>{e.pos="UP";if(/Field/.test(e.type))e.eff=parseField(e.desc||"");render();openZone(p,i,z)};
  if(/Equip/.test(e.type)){
    pickTarget(t=>{e.tgt=t;e.eq=parseEquip(e.desc||"",S.mon[t.p][t.i]);done()},back);
  }else done();
}
function stPlace(p,i,c,z){
  const t=c.type,spell=/Spell/.test(t),quick=/Quick-Play/.test(t);
  const mk=pos=>({name:c.name,kind:spell?"spell":"trap",type:t,pos:"FD",id:c.id,desc:c.desc,setT:S.tc});
  open(`${closeX()}<h2>${esc(c.name)}</h2><small>${esc(t)}</small>
   <div class="row"><button id="ba">Activate (face-up)</button><button id="bs">Set (face-down)</button></div>
   <div class="card" style="max-height:26dvh">${esc(c.desc).replace(/\n/g,"<br>")}</div>
   <div class="row"><button id="bk">← Back to search</button></div>`,()=>{
    const back=()=>stPlace(p,i,c,z);
    $("ba").onclick=()=>{const w=[];
      if(!spell)w.push("Trap Cards can't be activated from the hand: Set it first, then activate it from the next turn on.");
      else{if(p!==S.turn)w.push("Spells are only activated from the hand on your own turn.");if(!quick&&!inMain())w.push(`${t} can only be activated in a Main Phase (now: ${phName()}).`)}
      guard(w,()=>{const e=mk();putZone(p,i,z,e);activateIn(p,i,z,e,()=>{setZ(p,i,z,null);render();back()})},back)};
    $("bs").onclick=()=>{const w=[];
      if(p!==S.turn)w.push("Cards are only Set on your own turn.");
      if(!inMain())w.push(`Spells/Traps can only be Set in a Main Phase (now: ${phName()}).`);
      guard(w,()=>{putZone(p,i,z,mk());render();openZone(p,i,z)},back)};
    $("bk").onclick=()=>loadZoneDialog(p,i,z);
  });
}
function pendPlace(p,i,c){
  open(`${closeX()}<h2>${esc(c.name)}</h2><small>${esc(c.type)} • Pendulum Scale ${c.sc??"?"}</small>
   <div class="row"><button id="ba" style="background:#8be32a;color:#0b2200;font-weight:800">Place in Pendulum Zone</button></div>
   <div class="card" style="max-height:26dvh">${esc(c.desc).split("\n").join("<br>")}</div>
   <div class="row"><button id="bk">← Back to search</button></div>`,()=>{
    $("ba").onclick=()=>{
      const w=[];
      if(p!==S.turn)w.push("Pendulum Monsters are placed in a Pendulum Zone on your own turn.");
      if(!inMain())w.push(`Only in a Main Phase (now: ${phName()}).`);
      guard(w,()=>{S.st[p][i]={name:c.name,kind:"pend",type:c.type,pos:"UP",id:c.id,desc:c.desc,scale:c.sc??0,setT:S.tc};render();cardZoneDialog(p,i,"st")},()=>pendPlace(p,i,c));
    };
    $("bk").onclick=()=>loadZoneDialog(p,i,"st");
  });
}
function loadZoneDialog(p,i,z){
  open(`${closeX()}<h2>${z==="field"?"Load Field Spell":isPZ(i)&&z!=="field"?`Load card (Pendulum Zone) – Spells, Traps & Pendulum Monsters`:`Load Spell/Trap (slot ${i+1}) – Spells & Traps only`}</h2><input type="search" id="q" placeholder="Search by name…" autocomplete="off"><div class="res" id="res"></div>`,()=>{
    const q=$("q");q.focus();
    q.oninput=async()=>{
      const r=await find(q.value,z==="field"?"field":isPZ(i)?"stp":"st");
      $("res").innerHTML=r.map((c,k)=>`<div data-k="${k}"><b>${esc(c.name)}</b><br><small>${esc(c.type)}</small></div>`).join("")||"<div><small>Type at least 2 letters…</small></div>";
      $("res").onclick=ev=>{const d=ev.target.closest("[data-k]");if(!d)return;const c=r[+d.dataset.k];if(/Monster/.test(c.type))pendPlace(p,i,c);else stPlace(p,i,c,z)};
    };
  });
}
function cardZoneDialog(p,i,z){
  const m=getZ(p,i,z);
  if(!m){loadZoneDialog(p,i,z);return}
  const t=m.type||(m.kind==="spell"?"Normal Spell":"Normal Trap"),spell=m.kind==="spell",quick=/Quick-Play/.test(t);
  const oneShot=/^(Normal|Quick-Play|Ritual) Spell|^(Normal|Counter) Trap/.test(t);
  const sg=m.sg||-1,pend=m.kind==="pend";
  const pendUI=pend?`<p><b>⚖ Pendulum Scale ${m.scale}</b><br><small>${esc(pendText(p))}</small></p>`:"";
  const eqUI=m.eq&&m.pos==="UP"?(()=>{
    const tg=m.tgt&&S.mon[m.tgt.p][m.tgt.i];
    const adj=(label,key)=>`<div><b>${label}: ${m.eq[key]>=0?"+":""}${m.eq[key]}</b></div><div class="row">${STEPS.map(v=>`<button data-ek="${key}" data-v="${v*sg}" style="min-width:40px;padding:8px 2px">${sg>0?"+":"-"}${v}</button>`).join("")}<button id="esg${key}" style="background:${sg>0?"#1f5a3a":"#6b2230"};flex:0 0 40px">${sg>0?"+":"−"}</button></div>`;
    return`<p><b>Equipped to:</b> ${tg?(tg.pos==="FD"?"Face-down monster":esc(tg.name)):"?"} <button id="chg" style="min-width:0">Change</button></p>
      ${m.eq.per?`<small>Counted automatically: ${fmt({a:m.eq.ua,d:m.eq.ud})} for each ${esc(perLabel(m.eq.per))} (now ${perCount(m.eq.per,p,m,null)}). Use the buttons below for extra corrections.</small><br>`:""}${m.eq.found?"<small>Bonus detected from the card text — correct it if needed.</small>":"<small>No bonus detected in the text — set it manually if this card changes ATK/DEF.</small>"}${m.eq.note?`<br><small>${esc(m.eq.note)}</small>`:(w=>w?`<br><small>${esc(w)}</small>`:"")(statNote(m.desc,p=>parseEquip(p,tg).found))}${adj("ATK","a")}${adj("DEF","d")}`;
  })():"";

function pileAdd(p,kind){

function pileEntry(p,kind,k){
  const L=pileOf(p,kind),c=L[k];if(!c)return;

  const other=kind==="ban"?"gy":"ban";

    open(`${closeX()}<h2>${esc(c.name)}</h2><small>${esc(c.type||"")} • ${NAME(p)}'s Face-up Extra Deck</small>

     <div class="card" id="ct" hidden></div><div class="row"><button id="bk">← Back</button></div>`,()=>{
      $("ps").onclick=async()=>{const all=await cards();const c0=all.find(x=>x.id===c.id)||{name:c.name,type:c.type,atk:0,def:0,desc:""};const i=freeZones(p).find(z=>z<EMZ0);summonDialog(p,i===undefined?0:i,c0,{ed:true,take:()=>{const j=L.indexOf(c);if(j>=0)L.splice(j,1)}})};
      $("rm").onclick=()=>{L.splice(k,1);render();pileDialog(p,kind)};
      $("info").onclick=async()=>{const all=await cards();const x=all.find(y=>y.id===c.id);$("ct").hidden=false;$("ct").innerHTML=x?cardInfo(x):"No card text."};
      $("bk").onclick=()=>pileDialog(p,kind);
    });
    return;
  }
  open(`${closeX()}<h2>${esc(c.name)}</h2><small>${esc(c.type||"")} • ${NAME(p)}'s ${pileName(kind)}</small>
   <div class="row">${mon?`<button id="sa">Special Summon (ATK)</button><button id="sd">Special Summon (DEF)</button>`:`<button id="setf">Set on the field</button>`}</div>
   <div class="row"><button id="mv">→ ${pileName(other)}</button><button id="rm">Remove (to hand/deck)</button><button id="info">Card text</button></div>
   <div class="card" id="ct" hidden></div><div class="row"><button id="bk">← Back</button></div>`,()=>{
    const take=()=>{L.splice(k,1)};
    const warn=t=>open(`${closeX()}<h2>Can't do that</h2><p>${esc(t)}</p><div class="row"><button id="bk2">← Back</button></div>`,()=>{$("bk2").onclick=()=>pileEntry(p,kind,k)});
    const full=async pos=>{
      const all=await cards();const c0=all.find(x=>x.id===c.id)||{name:c.name,type:c.type,atk:0,def:0};
      const i=S.mon[p].slice(0,S.n).findIndex(x=>!x);
      if(i<0)return warn("You have no free monster zone.");
      take();placeMon(p,i,c0,pos,"special");render();dlg.close();
    };
    if($("sa")){$("sa").onclick=()=>full("ATK");$("sd").onclick=()=>full("DEF")}
    if($("setf"))$("setf").onclick=async()=>{
      const all=await cards();const c0=all.find(x=>x.id===c.id)||{};
      const e={name:c.name,kind:/Spell/.test(c.type||"")?"spell":"trap",type:c.type,pos:"FD",id:c.id,desc:c0.desc||"",setT:S.tc};
      if(isField){if(S.field[p])return warn("Your Field Zone is occupied. Send that Field Spell away first.");take();S.field[p]=e}
      else{const i=S.st[p].slice(0,S.n).findIndex(x=>!x);if(i<0)return warn("You have no free Spell/Trap zone.");take();S.st[p][i]=e}
      render();dlg.close();
    };
    $("mv").onclick=()=>{take();pileOf(p,other).unshift(c);render();pileDialog(p,kind)};
    $("rm").onclick=()=>{take();render();pileDialog(p,kind)};
    $("info").onclick=async()=>{const all=await cards();const x=all.find(y=>y.id===c.id);$("ct").hidden=false;$("ct").innerHTML=x?cardInfo(x):"No card text."};
    $("bk").onclick=()=>pileDialog(p,kind);
  });
}

// Official: each player picks 1 Skill, set face-down (opponent only sees the character); Skills don't use the Chain.
let SKILLS=null;
async function skills(){if(SKILLS)return SKILLS;const r=await fetch("data/skills.json");SKILLS=(await r.json()).map(c=>({id:c[0],name:c[1],ch:c[2],desc:c[3]}));return SKILLS}
function skillDialog(p,show){
  const k=S.skill[p];
  if(!k){skillPick(p);return}
  const vis=show||k.uses>0;
  const multi=/●/.test(k.desc);
  // Official (Speed Duel Addendum 1.2): a Skill can only be activated once per Duel unless its text says otherwise,
  // and if it doesn't say when, only in your own Main Phase with no Chain being built or resolved.
  const repeatable=/once per turn|each turn|every turn|any number of times|as many times|during each|each time|whenever/i.test(k.desc);
  const onceDuel=!repeatable,onceTurn=/Once per turn/i.test(k.desc);
  const timed=/start of the Duel|Standby Phase|Draw Phase|Battle Phase|End Phase|opponent's turn|during your turn|during the turn|during damage|\bwhen\b|\bif\b|\bduring\b|at any time/i.test(k.desc);
  open(`${closeX()}<h2>⚡ Skill – ${NAME(p)}</h2>
   <p><b>${esc(k.ch)}</b>'s Skill, face-down.<br><small>${k.uses?`Activated ${k.uses}× (last on turn ${k.lastT}).`:"Not activated yet."}</small></p>
   ${vis?`<div class="card"><b>${esc(k.name)}</b><br>${esc(k.desc).split("\n").join("<br>")}</div>`:`<p><small>The opponent may only see the character, not the Skill. Only the owner should look at it.</small></p>`}
   ${multi?`<p><small>This Skill has several effects — keep track yourself of which ones you used.</small></p>`:""}
   <div class="row"><button id="act" style="background:#8be32a;color:#0b2200;font-weight:800">⚡ Activate (flip it)</button>${vis?"":`<button id="peek">👁 Look (only you)</button>`}</div>
   <div class="row">${k.uses?"":`<button id="chg">Change Skill</button>`}<button id="rm" style="background:#6b2230">Remove Skill</button></div>
   <p><small>Skills don't use the Chain and can't be responded to. Activate only when its condition is met and no card is resolving.</small></p>`,()=>{
    if($("peek"))$("peek").onclick=()=>skillDialog(p,true);
    $("act").onclick=()=>{
      const w=[];
      if(onceDuel&&!multi&&k.uses>0)w.push("A Skill can only be activated once per Duel unless its text says otherwise (official Speed Duel rule).");
      if(!timed&&(p!==S.turn||!inMain()))w.push("This Skill doesn't say when it can be used, so it can only be activated in your own Main Phase.");
      if(onceTurn&&!multi&&k.lastT===S.tc)w.push("This Skill can only be used once per turn and was already used this turn.");
      guard(w,()=>{k.uses=(k.uses||0)+1;k.lastT=S.tc;addLog(`${NAME(p)} activated the Skill "${k.name}" (${k.ch})`);render();skillDialog(p,true)},()=>skillDialog(p,show));
    };
    if($("chg"))$("chg").onclick=()=>skillPick(p);
    $("rm").onclick=()=>{S.skill[p]=null;render();dlg.close()};
  });
}
async function skillPick(p){
  const all=await skills();const chars=[...new Set(all.map(s=>s.ch))].sort();
  open(`${closeX()}<h2>Choose your Skill – ${NAME(p)}</h2><small>Each player picks 1 Skill before the Duel. Only the player choosing should look at this screen.</small>
   <input type="search" id="q" placeholder="Search Skill or character…" autocomplete="off"><div class="res" id="res" style="max-height:42dvh"></div>
   <div class="row"><button id="cust">Custom Skill</button></div>`,()=>{
    const q=$("q");
    const draw=()=>{
      const v=q.value.trim().toLowerCase();
      if(v.length<2){
        $("res").innerHTML=chars.map(c=>`<div data-ch="${esc(c)}"><b>${esc(c)}</b> <small>${all.filter(s=>s.ch===c).length} Skill(s)</small></div>`).join("");
        $("res").onclick=e=>{const d=e.target.closest("[data-ch]");if(d){q.value=d.dataset.ch;draw()}};
        return;
      }

      $("res").innerHTML=r.map((s,k)=>`<div data-k="${k}"><b>${esc(s.name)}</b><br><small>${esc(s.ch)}</small></div>`).join("")||"<div><small>Nothing found.</small></div>";
      $("res").onclick=e=>{const d=e.target.closest("[data-k]");if(d)skillConfirm(p,r[+d.dataset.k])};
    };
    q.oninput=draw;draw();
    $("cust").onclick=()=>open(`${closeX()}<h2>Custom Skill</h2><input type="text" id="cn" placeholder="Skill name"><input type="text" id="cc" placeholder="Character (optional)" style="margin-top:6px"><textarea id="ct" rows="5" placeholder="Skill text" style="width:100%;margin-top:6px;font:inherit;padding:10px;border-radius:10px;border:1px solid #7a5230;background:#0a0705;color:var(--txt);user-select:text"></textarea><div class="row"><button id="bk">← Back</button><button id="ok" style="background:#1f5a3a">Set it</button></div>`,()=>{
      $("bk").onclick=()=>skillPick(p);
      $("ok").onclick=()=>{const n=$("cn").value.trim();if(!n)return;S.skill[p]={id:0,name:n,ch:$("cc").value.trim()||"Custom",desc:$("ct").value.trim(),uses:0};render();dlg.close()};
    });
  });
}
function skillConfirm(p,s){
  open(`${closeX()}<h2>${esc(s.name)}</h2><small>${esc(s.ch)}</small><div class="card">${esc(s.desc).split("\n").join("<br>")}</div>

    $("itoss").onclick=()=>{dlg.onclose=null;introCoin()};
  };
  dlg.onclose=draw;draw();
}
function introCoin(){
  const two=S.view!=="1p";
  const heads=rnd(2)===0,winner=heads?0:1;
  const forced=S.n===3&&!!S.skill[winner]; // Speed Duel: whoever presented a Skill before the toss and wins it must go first
  const legend=two?"▼ Heads = bottom player · ▲ Tails = top player":"Heads = You · Tails = Opponent";
  introLayout("","",`<div class="coinwrap"><div class="coin" id="coin"><div class="face">H</div><div class="face b">T</div></div></div><div class="cres" id="cres">&nbsp;</div><div class="clegend">${legend}</div>`);
  const coin=$("coin");
  const spins=calmMotion()?0:5;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{coin.style.transform=`rotateX(${spins*360+(heads?0:180)}deg)`}));
  setTimeout(()=>{
    $("cres").textContent=heads?"HEADS":"TAILS";
    setTimeout(()=>introChoice(winner,forced,two,legend,heads),700);
  },calmMotion()?200:2000);
}
function introChoice(winner,forced,two,legend,heads){
  const you=winner===0;
  const mine=(who)=>`<div class="ibox"><div class="ihead">🏆 ${two?"YOU WIN THE TOSS":(you?"YOU WIN THE TOSS":"OPPONENT WINS THE TOSS")}</div>${forced
      ?`<div class="isub">${two||you?"You":"The opponent"} presented a Skill, so ${two||you?"you":"they"} must go first.</div><button id="ifirst">OK, ${two||you?"I go":"they go"} first</button>`
      :`<div class="isub">${two||you?"You get to choose:":"Tap the opponent's choice:"}</div><button id="ifirst">${two||you?"I go first":"Opponent goes first"}</button><button id="isecond">${two||you?"My opponent goes first":"I go first"}</button>`}</div>`;
  const wait=`<div class="ibox"><div class="ihead">OPPONENT WON THE TOSS</div><div class="isub">They are choosing…</div></div>`;
  const mid=`<div class="cres" style="font-size:26px">${heads?"HEADS":"TAILS"}</div><div class="clegend">${legend}</div>`;
  if(two)introLayout(you?mine():wait,you?wait:mine(),mid);
  else introLayout(mine(),"",mid);
  const pick=first=>{ // first = true -> the toss winner goes first (in 1p without 'you', the buttons are labelled the other way round)
    const winnerFirst=forced?true:first; // 'ifirst' always means: the toss winner goes first
    introFlash(winnerFirst?winner:1-winner);
  };
  const f=document.querySelectorAll("#ifirst"),sc=document.querySelectorAll("#isecond");
  f.forEach(b=>b.onclick=()=>pick(true));sc.forEach(b=>b.onclick=()=>pick(false));
}
function introFlash(starter){
  const two=S.view!=="1p",el=$("intro"),calm=calmMotion();
  const word="IT'S TIME TO…";
  const letters=[...word].map((ch,i)=>ch===" "?`<span class="ltr sp" style="animation-delay:${i*40}ms">&nbsp;</span>`:`<span class="ltr" style="animation-delay:${i*40}ms;--dx:${rnd(1100)-550}px;--dy:${rnd(900)-450}px;--r:${rnd(720)-360}deg">${ch}</span>`).join("");
  const half=`<div class="itt"><div class="ittl" data-t>${letters}</div><div class="duel" data-d hidden>DUEL!</div></div>`;
  introLayout(half,two?half:"","");
  el.insertAdjacentHTML("beforeend",`<div class="iflash" id="iflash"></div>`);
  const finish=()=>{
    LPHOLD=false;S.startPlayer=starter;S.turn=starter;S.tc=1;S.ph=0;S.sub=0;render();
    el.hidden=true;el.className="";el.innerHTML="";
  };
  if(calm){el.classList.add("out");setTimeout(finish,450);return}
  const t1=word.length*40+500;                       // letters have popped in
  setTimeout(()=>{
    el.querySelectorAll(".ittl").forEach(e=>e.classList.add("push"));
    el.querySelectorAll("[data-d]").forEach(e=>e.hidden=false);
    $("iflash").classList.add("go");el.classList.add("shake");
  },t1+350);
  setTimeout(()=>el.classList.add("out"),t1+350+1500);
  setTimeout(finish,t1+350+1500+520);
}

// ---------- Menu ----------
const APP_NAME="Duelist Scorekeeper";
const COFFEE_URL="https://ko-fi.com/spawnerindustries";
$("btnMenu").onclick=()=>open(`${closeX()}<h2>Menu</h2>
  <div class="row"><button id="view">View: ${S.view==="2p"?"2 players, 1 phone (switch to 1 player)":"1 player, own phone (switch to 2 players)"}</button></div>
  <div class="row"><button id="n8">New duel (8000 LP, 5 zones)</button><button id="n4">Speed Duel (4000 LP, 3 zones)</button></div>
  <div class="row"><button id="who">Who starts? Now: ${NAME(S.startPlayer)}</button></div>
  <div class="row"><button id="ask">Ask the defender before each attack: ${S.noAsk?"OFF":"ON"}</button></div>
  <div class="row"><button id="surr" style="background:#6b2230">🏳 Surrender…</button></div>
  <p><small>A new duel resets LP, monsters and the turn counter.</small></p>
  <div class="row"><button id="home">🏠 Back to main menu</button></div>
  <div class="row"><a href="${COFFEE_URL}" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#ff5e5b;color:#fff;font-weight:800;border-radius:10px;padding:10px;text-decoration:none">☕ Support me on Ko-fi</a></div>
  <p><small>Unofficial fan tool, free to use. Not affiliated with or endorsed by Konami. Yu-Gi-Oh! and all card names and card text are © Konami. This app shows no card artwork. Card data via YGOPRODeck.</small></p>`,()=>{
  const nd=(lp,n)=>{dlg.close();startDuel(lp,n,S.view)};
  $("home").onclick=()=>{dlg.close();showSplash()};
  $("ask").onclick=()=>{S.noAsk=!S.noAsk;render();dlg.close()};
  $("surr").onclick=()=>open(`${closeX()}<h2>Surrender?</h2><p>The duel ends and the other player wins.</p><div class="row"><button id="s0" style="background:#6b2230">I surrender</button>${S.view==="1p"?"":`<button id="s1" style="background:#6b2230">Opponent surrenders</button>`}</div><div class="row"><button id="sno">Cancel</button></div>`,()=>{
    const go=p=>{dlg.close();setLP(p,0,()=>`${NAME(p)} surrendered`)};
    $("s0").onclick=()=>go(0);if($("s1"))$("s1").onclick=()=>go(1);$("sno").onclick=()=>dlg.close();
  });
  $("n8").onclick=()=>nd(8000,5);$("n4").onclick=()=>nd(4000,3);
  $("who").onclick=()=>{S.startPlayer=1-S.startPlayer;S.turn=S.startPlayer;S.tc=1;S.ph=0;S.sub=0;render();dlg.close()};
  $("view").onclick=()=>{S.view=S.view==="2p"?"1p":"2p";render();dlg.close()};
});

// ---------- Splash ----------
function showSplash(){
  const sp=$("splash");
  let view=S.view==="1p"?"1p":"2p",mode=S.n===3?"speed":"master";
  const hasDuel=S.tc>1||S.ph>0||(S.log&&S.log.length>0)||S.lp.some(v=>v!==(S.n===3?4000:8000));
  const kofi="https://ko-fi.com/spawnerindustries";
  function draw(){
    sp.innerHTML=`<img src="img/logo.png" alt="Duelist Scorekeeper">
    <div class="by">by Spawner Industries</div>
    <div class="grp"><div class="lbl">View</div><div class="opt">
      <button data-v="2p" class="${view==="2p"?"on":""}">2 players<small>1 phone</small></button>
      <button data-v="1p" class="${view==="1p"?"on":""}">1 player<small>own phone</small></button></div></div>
    <div class="grp"><div class="lbl">Rules</div><div class="opt">
      <button data-m="master" class="${mode==="master"?"on":""}">Master Duel<small>8000 LP, 5 zones</small></button>
      <button data-m="speed" class="${mode==="speed"?"on":""}">Speed Duel<small>4000 LP, 3 zones</small></button></div></div>
    <button class="go" id="spGo">Start duel</button>
    ${hasDuel?'<button class="go2" id="spCont">Continue previous duel</button>':""}
    <a class="kofi" href="${kofi}" target="_blank" rel="noopener">☕ Support me on Ko-fi</a>
    <small class="fine">Unofficial fan tool, free to use. Not affiliated with or endorsed by Konami.</small>`;
    sp.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});
    sp.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    $("spGo").onclick=()=>startDuel(mode==="speed"?4000:8000,mode==="speed"?3:5,view);
    const c=$("spCont");if(c)c.onclick=()=>{S.view=view;render();sp.hidden=true};
  }
  draw();sp.hidden=false;sp.scrollTop=0;
}
showSplash();

render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
